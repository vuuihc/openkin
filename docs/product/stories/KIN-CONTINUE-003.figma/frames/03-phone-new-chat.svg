<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">手机：新建对话</title><desc id="d">新建是原入口区上的专注任务，隐藏Tab。来自项目时沿用cwd、关闭回项目封面；来自对话时回列表。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.l{stroke:#ffffff;stroke-opacity:.1}.b{fill:#222226}.label{font-size:12px}.meta{font-size:11px}</style><rect width="390" height="844" rx="26" fill="#1a1a1c"/><text x="20" y="38" class="m meta">9:41</text><text x="23" y="79" class="s label">×&#160; 关闭</text><text x="355" y="79" text-anchor="end" class="m label">新建对话</text><text x="20" y="139" font-size="28" font-weight="600" class="t">开始一件事</text><text x="20" y="167" class="m label">描述你想要的改变，其他设置可以稍后再调。</text><rect x="20" y="197" width="350" height="144" rx="14" class="b"/><text x="38" y="228" class="s label">例如：检查手机上的导航返回行为。</text><text x="38" y="255" class="m label">并保留现有的搜索和筛选状态。</text><text x="350" y="319" text-anchor="end" class="m meta">⌘ Enter 开始</text><rect x="20" y="363" width="350" height="56" rx="12" class="b"/><text x="36" y="387" class="m label">设备与项目</text><text x="36" y="408" class="t label">本机 / 控制台</text><text x="344" y="399" class="m label">›</text><rect x="20" y="431" width="350" height="56" rx="12" class="b"/><text x="36" y="455" class="m label">Agent 与模型</text><text x="36" y="476" class="t label">默认 Agent / 默认模型</text><text x="344" y="467" class="m label">›</text><rect x="20" y="499" width="350" height="56" rx="12" class="b"/><text x="36" y="523" class="m label">权限</text><text x="36" y="544" class="t label">每次询问</text><text x="344" y="535" class="m label">›</text><text x="20" y="606" class="m meta">提示词、设备、项目、模型与权限在离开后保留。</text><rect x="20" y="645" width="350" height="48" rx="12" fill="#0a84ff"/><text x="195" y="675" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">开始</text><rect x="33" y="740" width="324" height="40" rx="10" fill="#141416"/><text x="195" y="765" text-anchor="middle" class="s meta">从项目进入 · 带该项目cwd · 关闭回项目封面</text><rect x="134" y="830" width="122" height="5" rx="3" class="m"/></svg>
