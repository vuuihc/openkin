<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">手机：对话区中的详情栈</title><desc id="d">详情占完整宽度且隐藏底部Tab；只在根页显示Tab。返回按入口回到原列表或项目封面。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.l{stroke:#ffffff;stroke-opacity:.1}.label{font-size:12px}.meta{font-size:11px}</style></defs><rect width="390" height="844" rx="26" fill="#1a1a1c"/><text x="18" y="37" class="m meta">9:41</text><rect x="12" y="53" width="44" height="44" rx="12"/><text x="18" y="83" font-size="27" class="t">‹</text><text x="57" y="71" class="t label">完善移动端的导航结构</text><text x="57" y="90" class="m meta">本机 / 控制台</text><rect x="332" y="53" width="44" height="44" rx="12"/><text x="347" y="83" class="s label">⋯</text><path d="M20 109H370" class="l"/><text x="24" y="152" class="s label">请把四个目的地做成真正的同级导航。</text><rect x="24" y="174" width="316" height="1" class="l"/><text x="24" y="212" class="t label">我会保留对话内容，只调整导航和布局。</text><rect x="24" y="239" width="316" height="70" rx="12" fill="#222226"/><circle cx="43" cy="259" r="4" fill="#30d158"/><text x="56" y="264" class="s label">读取导航与路由约定</text><text x="40" y="289" class="m meta">已完成</text><text x="24" y="348" class="t label">对话区的工作仍在继续</text><text x="24" y="380" class="s label">返回恢复原对话位置与列表筛选。</text><text x="24" y="413" class="s label">从项目进入时，返回那张项目封面。</text><rect x="22" y="448" width="324" height="89" rx="14" fill="#222226" stroke="#0a84ff" stroke-opacity=".7"/><circle cx="41" cy="471" r="4" fill="#ff9f0a"/><text x="54" y="476" class="t label">允许修改导航组件？</text><text x="38" y="502" class="m meta">通知 focus 只定位匹配 ID 的这一张</text><rect x="38" y="515" width="80" height="44" rx="8" fill="#0a84ff"/><text x="78" y="542" text-anchor="middle" font-size="12" fill="#fff">允许</text><text x="142" y="538" class="s label">拒绝</text><text x="22" y="583" class="s label">正在整理受影响的面</text><text x="22" y="616" class="m meta">返回不会中断正在进行的回答</text><path d="M0 659H390" class="l"/><rect x="16" y="676" width="358" height="49" rx="13" fill="#222226"/><text x="32" y="705" class="m label">继续提问…</text><text x="348" y="706" class="t label">↑</text><text x="20" y="750" class="m meta">对话 / 详情 · 无底栏，保留来路</text><rect x="20" y="771" width="350" height="40" rx="10" fill="#141416"/><text x="195" y="796" text-anchor="middle" class="s meta">四个 Tab 仅在各自区域根页显示</text><rect x="128" y="830" width="122" height="5" rx="3" class="m"/></svg>
