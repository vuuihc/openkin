<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Mac：设置与原分区</title><desc id="d">现有general、providers、agents、routing、advanced和新增operations按原URL分区；Agent运维在其中，字段不因换名删除。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#222226}.small{font-size:12px}.meta{font-size:11px}</style><rect width="1100" height="760" fill="#1a1a1c"/><rect width="200" height="760" fill="#141416"/><text x="26" y="49" font-size="22" font-weight="600" class="t">Kin</text><g class="s" font-size="14"><text x="30" y="109">▤  对话</text><text x="30" y="163">▱  项目</text><text x="30" y="217">◷  例行任务</text></g><rect x="14" y="245" width="171" height="44" rx="10" fill="#2c2c2e"/><text x="30" y="272" class="t" font-size="14">⚙  设置</text><text x="26" y="713" class="m meta">⌘K 搜索与命令</text><rect x="200" width="260" height="760" fill="#161618"/><path d="M200 0V760M460 0V760" stroke="#fff" stroke-opacity=".1"/><text x="224" y="54" font-size="20" font-weight="600" class="t">设置</text><rect x="216" y="96" width="228" height="67" rx="9" fill="#2c2c2e"/><text x="234" y="126" class="t small">通用 · general</text><text x="234" y="149" class="m meta">外观、帐户、通知</text><text x="234" y="208" class="s small">提供方 · providers</text><text x="234" y="257" class="s small">本地 Agent 与角色 · agents</text><text x="234" y="306" class="s small">Agent 运维 · operations</text><text x="234" y="355" class="s small">额度与路由 · routing</text><text x="234" y="404" class="s small">高级 · advanced</text><path d="M216 450H444" stroke="#fff" stroke-opacity=".1"/><text x="234" y="478" class="m meta">每个分区书写自己的 ?tab=。</text><text x="234" y="511" class="m meta">从手机进入，分区有回根页。</text><text x="510" y="64" font-size="28" font-weight="600" class="t">通用</text><text x="510" y="98" class="m small">/settings?tab=general · 原有字段</text><path d="M510 129H1050" stroke="#fff" stroke-opacity=".1"/><text 