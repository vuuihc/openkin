<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Mac：粘性上下文与桌面浮层</title><desc id="d">展示对话详情连续性和桌面运行配置选择器，不用手机底面板。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#222226}.small{font-size:12px}.meta{font-size:11px}</style><rect width="1100" height="760" fill="#1a1a1c"/><rect width="256" height="760" fill="#141416"/><text x="26" y="49" font-size="22" font-weight="600" class="t">Kin</text><rect x="16" y="82" width="223" height="44" rx="10" fill="#2c2c2e"/><text x="34" y="109" class="t" font-size="14">▤  对话</text><g class="s" font-size="14"><text x="34" y="164">▱  项目</text><text x="34" y="217">◷  例行任务</text><text x="34" y="270">⚙  设置</text></g><rect x="256" width="304" height="760" fill="#161618"/><path d="M256 0V760M560 0V760" stroke="#fff" stroke-opacity=".1"/><text x="280" y="49" font-size="19" font-weight="600" class="t">对话</text><rect x="276" y="74" width="264" height="36" rx="9" class="b"/><text x="293" y="96" class="m small">⌕  搜索对话</text><text x="280" y="145" class="m small">全部 · 待处理 · 已归档</text><text x="280" y="198" class="s small">本机 · 控制台</text><text x="282" y="237" class="t small">完善移动端的导航结构</text><text x="282" y="261" class="m meta">正在运行</text><rect x="276" y="302" width="265" height="178" rx="12" class="b"/><text x="295" y="334" class="t small">离开这个对话后</text><text x="295" y="370" class="m small">流式回答、未发送草稿、</text><text x="295" y="399" class="m small">滚动位置和审批仍在。</text><text x="295" y="447" class="s small">回来时仍是同一工作现场。</text><text x="588" y="46" font-size="19" font-weight="600" class="t">运行配置</text><text x="588" y="81" class="s small">把「选一小组中的一个」放在贴靠浮层。</text><text x="588" y="153" class="m small">Agent</text><rect x="696" y="126" width="327" height="40" rx="9" class="b"/><text x="712" y="151" class="t small">默认 Agent</text><text x="1000" y="151" class="m small">⌄</text><rect x="691" y="174" width="337" height="165" rx="12" fill="#2c2c2e" stroke="#ffffff" stroke-opacity=".14"/><rect x="702" y="184" width="315" height="40" rx="8" fill="#3a3a3c"/><text x="716" y="210" class="t small">默认 Agent &#160; ✓</text><text x="716" y="253" class="s small">本机上的可用 Agent</text><path d="M703 275H1016" stroke="#ffffff" stroke-opacity=".09"/><text x="716" y="306" class="s small">管理 Agent →</text><text x="594" y="389" class="m small">权限</text><rect x="696" y="362" width="327" height="40" rx="9" class="b"/><text x="712" y="387" class="t small">每次询问</text><text x="1000" y="387" class="m small">⌄</text><text x="588" y="479" class="m meta">不在 Mac 上弹 iPhone 式底部面板。</text><text x="588" y="534" class="s small">Escape 先关闭当前浮层。</text><text x="588" y="566" class="s small">IME 中确认不会偷偷提交表单。</text><text x="588" y="598" class="s small">关闭后焦点归还触发按钮，背后不响应快捷键。</text><rect x="584" y="651" width="480" height="42" rx="10" class="b"/><text x="824" y="677" text-anchor="middle" class="m meta">一侧列表，一侧工作 · 外壳稳定</text></svg>
