<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="t d"><title id="t">四区导航与状态保留行为板</title><desc id="d">区域的根、各自的栈、系统返回、冷启动和状态保留统一；断线与空态不变更导航结构。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#1a1a1c}.c{fill:#222226}.e{fill:#2c2c2e}.a{fill:#0a84ff}.label{font-size:18px}.body{font-size:16px}.meta{font-size:14px}</style><rect width="1600" height="980" fill="#0e0e10"/><text x="40" y="59" font-size="28" class="t">一整棵树，四个区域</text><text x="40" y="97" class="m body">区域切换只换内容；详情总是归属于其中一区。Mac 用双栏表达同一棵树。</text><g><rect x="40" y="137" width="350" height="276" rx="18" class="c"/><text x="65" y="183" font-size="26" class="t">对话</text><text x="65" y="225" class="s body">根：所有对话 / 设备范围</text><text x="65" y="266" class="s body">范围：全部 · 待处理 · 已归档</text><rect x="61" y="294" width="306" height="44" rx="10" fill="#0a84ff" fill-opacity=".17"/><text x="79" y="322" class="t body">子栈：对话详情 / 新建 / diff</text><text x="65" y="377" class="m meta">唯一对话列表；批准与通知回归此处。</text><rect x="430" y="137" width="350" height="276" rx="18" class="c"/><text x="455" y="183" font-size="26" class="t">项目</text><text x="455" y="225" class="s body">根：项目集合 / 搜索 / 设备范围</text><rect x="451" y="265" width="306" height="44" rx="10" class="e"/><text x="469" y="294" class="t body">子栈：项目封面</text><text x="455" y="354" class="m meta">封面仅有最近活动，不复制对话列表。</text><rect x="820" y="137" width="350" height="276" rx="18" class="c"/><text x="845" y="183" font-size="26" class="t">例行任务</text><text x="845" y="225" class="s body">根：机器范围 / 任务列表</text><rect x="841" y="265" width="306" height="44" rx="10" class="e"/><text x="859" y="294" class="t body">子栈：编辑 / 远程运行</text><text x="845" y="354" class="m meta">机器归例程数据源，不是第五个区域。</text><rect x="1210" y="137" width="350" height="276" rx="18" class="c"/><text x="1235" y="183" font-size="26" class="t">设置</text><text x="1235" y="225" class="s body">根：运行 / 环境 / 帐户</text><rect x="1231" y="265" width="306" height="44" rx="10" class="e"/><text x="1249" y="294" class="t body">子栈：Agent 运维 / 通用…</text><text x="1235" y="354" class="m meta">Agent 能力保留，入口归位；旧深链可达。</text></g><path d="M390 275H430M780 275H820M1170 275H1210" stroke="#0a84ff" stroke-width="2" stroke-dasharray="6 6"/><text x="40" y="470" font-size="24" class="t">动作合同</text><g><rect x="40" y="499" width="488" height="188" rx="16" class="b"/><text x="64" y="539" class="t label">切区</text><text x="64" y="578" class="s body">点 Tab / 侧栏入口 → 淡入轻移</text><text x="64" y="615" class="s body">每区保存筛选、选中、滚动、草稿</text><text x="64" y="651" class="m meta">不用横向滑动手势；不整页白屏。</text><rect x="556" y="499" width="488" height="188" rx="16" class="b"/><text x="580" y="539" class="t label">进详情 / 返回</text><text x="580" y="578" class="s body">根 → 子页面：方向对称的推进 / 返回</text><text x="580" y="615" class="s body">返回当前区父级，不是全局对话列表</text><text x="580" y="651" class="m meta">浮层优先关闭；离开保护只问一次。</text><rect x="1072" y="499" width="488" height="188" rx="16" class="b"/><text x="1096" y="539" class="t label">通知 / 冷启动</text><text x="1096" y="578" class="s body">通知照样打开那条对话的那张卡</text><text x="1096" y="615" class="s body">冷启动合成所属区域父级</text><text x="1096" y="651" class="m meta">浏览器 Back、页头、边缘手势同义。</text></g><text x="40" y="749" font-size="24" class="t">不能动的底线</text><g class="body"><rect x="40" y="774" width="1520" height="70" rx="13" class="c"/><text x="64" y="817" class="s">空：保留导航，下一步明确　 · 　加载：尚未可知，不假装为空　 · 　失败：就地重试</text><rect x="40" y="862" width="1520" height="70" rx="13" class="c"/><text x="64" y="905" class="s">断线：已有内容不清空　 · 　焦点：属于当前层　 · 　动效：遵循减少动态效果偏好</text></g></svg>
