<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Mac：例行任务</title><desc id="d">保留机器上下文，提供清晰列表和编辑面板而非堆叠的手机卡片。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#222226}.small{font-size:12px}.meta{font-size:11px}</style><rect width="1100" height="760" fill="#1a1a1c"/><rect width="200" height="760" fill="#141416"/><text x="26" y="49" font-size="22" font-weight="600" class="t">Kin</text><g class="s" font-size="14"><text x="30" y="109">▤  对话</text><text x="30" y="163">▱  项目</text><text x="30" y="270">⚙  设置</text></g><rect x="14" y="191" width="171" height="44" rx="10" fill="#2c2c2e"/><text x="30" y="218" class="t" font-size="14">◷  例行任务</text><text x="26" y="713" class="m meta">⌘K 搜索与命令</text><path d="M200 0V760" stroke="#fff" stroke-opacity=".1"/><text x="239" y="62" font-size="28" font-weight="600" class="t">例行任务</text><rect x="943" y="32" width="119" height="38" rx="9" fill="#0a84ff"/><text x="1003" y="56" text-anchor="middle" fill="#fff" class="small">＋ 新建任务</text><rect x="239" y="96" width="290" height="42" rx="10" class="b"/><circle cx="259" cy="117" r="3" fill="#30d158"/><text x="273" y="122" class="t small">工作室</text><text x="506" y="122" class="m small">⌄</text><text x="239" y="178" class="s small">4 个任务 · 下一次 09:00</text><text x="1035" y="178" text-anchor="end" class="m meta">未读运行 1</text><path d="M239 203H1037M239 241H1037M239 346H1037M239 451H1037M239 556H1037" stroke="#fff" stroke-opacity=".1"/><g class="m meta"><text x="251" y="228">任务</text><text x="670" y="228">计划</text><text x="817" y="228">上次运行</text></g><g class="t" font-size="14"><text x="251" y="273">每日工作摘要</text><text x="251" y="378">检查依赖更新</text><text x="251" y="483">整理工作记录</text></g><g class="s small"><text x="670" y="273">每天 09:00</text><text x="670" y="378">每周一 10:00</text><text x="670" y="483">每周五 18:00</text></g><cir