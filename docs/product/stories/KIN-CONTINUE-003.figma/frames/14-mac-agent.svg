<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Mac：设置中的Agent运维与桌面菜单</title><desc id="d">Agent能力不变，设置内二级分区明确，模型与权限使用桌面贴靠浮层。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#222226}.small{font-size:12px}.meta{font-size:11px}</style><rect width="1100" height="760" fill="#1a1a1c"/><rect width="200" height="760" fill="#141416"/><text x="26" y="49" font-size="22" font-weight="600" class="t">Kin</text><g class="s" font-size="14"><text x="30" y="109">▤  对话</text><text x="30" y="163">▱  项目</text><text x="30" y="217">◷  例行任务</text></g><rect x="14" y="245" width="171" height="44" rx="10" fill="#2c2c2e"/><text x="30" y="272" class="t" font-size="14">⚙  设置</text><rect x="200" width="253" height="760" fill="#161618"/><path d="M200 0V760M453 0V760" stroke="#fff" stroke-opacity=".1"/><text x="224" y="54" font-size="20" font-weight="600" class="t">设置</text><text x="224" y="104" class="m meta">运行</text><text x="230" y="139" class="s small">默认 Agent 与模型</text><text x="230" y="177" class="s small">权限与运行默认值</text><text x="224" y="225" class="m meta">环境</text><rect x="216" y="241" width="221" height="36" rx="8" fill="#2c2c2e"/><text x="230" y="265" class="t small">Agent 运维</text><text x="230" y="307" class="s small">设备与连接</text><text x="230" y="345" class="s small">通用</text><text x="224" y="399" class="m meta">帐户与数据</text><text x="230" y="435" class="s small">帐户</text><text x="230" y="473" class="s small">语言与外观</text><text x="492" y="64" font-size="28" font-weight="600" class="t">Agent 运维</text><rect x="919" y="32" width="133" height="37" rx="9" fill="#2c2c2e"/><text x="986" y="55" text-anchor="middle" class="t small">导入会话</text><text x="492" y="99" class="m small">已安装、可托管的 Agent；发现不自动接入。</text><g class="small"><rect x="492" y="126" width="77" height="32" rx="8" fill="#2c2c2e"/><text x="531" y="147" text-anchor="middle" class="t">Agent</text><text x="585" y="147" class="s">机器</text><text x="657" y="147" class="s">用量</text></g><path d="M492 196H1050M492 239H1050M492 329H1050M492 419H1050" stroke="#fff" stroke-opacity=".1"/><text x="507" y="220" class="m meta">名称</text><text x="756" y="220" class="m meta">机器 / 可用性</text><text x="927" y="220" class="m meta">配置</text><circle cx="518" cy="274" r="13" fill="#d97757"/><text x="546" y="280" font-size="15" class="t">Claude</text><text x="756" y="280" class="s small">本机 · 可用</text><rect x="901" y="256" width="133" height="35" rx="8" class="b"/><text x="919" y="279" class="s small">默认模型  ⌄</text><rect x="901" y="300" width="190" height="148" rx="12" fill="#2c2c2e" stroke="#ffffff" stroke-opacity=".14"/><rect x="912" y="311" width="168" height="34" rx="7" fill="#3a3a3c"/><text x="926" y="334" class="t small">自动 / 推荐</text><text x="926" y="371" class="s small">默认模型</text><text x="926" y="407" class="s small">更多模型…</text><text x="507" y="491" class="t small">模型数据与费用保留原读取来源。</text><text x="507" y="519" class="m meta">没有额外侧栏、底部 Sheet 或平级 Agent Tab。</text></svg>
