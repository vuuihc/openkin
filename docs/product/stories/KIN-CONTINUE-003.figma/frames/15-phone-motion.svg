<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">手机：克制的区域与页面转场</title><desc id="d">一级区域淡入轻移，二级推进返回；不走横向Tab滑动。使用箭头符号减少字体差异。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.label{font-size:12px}.meta{font-size:11px}</style><rect width="390" height="844" rx="26" fill="#0e0e10"/><text x="20" y="38" class="m meta">9:41</text><text x="20" y="90" font-size="28" font-weight="600" class="t">对话</text><rect x="175" y="62" width="175" height="34" rx="10" fill="#2c2c2e"/><text x="262" y="84" text-anchor="middle" class="s label">项目 · 例行 · 设置</text><rect x="20" y="130" width="350" height="80" rx="14" fill="#222226"/><text x="20" y="131" class="m label">01 / 一级区域</text><text x="35" y="168" font-size="17" class="t">对话 &#160; → &#160; 项目</text><text x="35" y="195" class="s meta">160–200ms · 淡入 + 8px 轻移</text><rect x="20" y="233" width="350" height="129" rx="14" fill="#1a1a1c"/><rect x="33" y="258" width="125" height="76" rx="9" fill="#222226"/><rect x="190" y="258" width="158" height="76" rx="9" fill="#2c2c2e"/><text x="42" y="281" class="m meta">列表</text><text x="202" y="281" class="m meta">详情</text><text x="55" y="312" font-size="15" class="s">‹ 返回</text><text x="237" y="312" font-size="15" class="t">当前项目</text><text x="20" y="234" class="m label">02 / 二级页面</text><text x="35" y="390" class="s meta">推进 220ms · 返回方向相反 · 详情隐藏底栏</text><rect x="45" y="112" width="300" height="397" rx="22" fill="none" stroke="#0a84ff" stroke-dasharray="6 5" stroke-opacity=".45"/><text x="20" y="541" class="m label">03 / 保留位置，不做整页重来</text><rect x="20" y="562" width="350" height="92" rx="14" fill="#1a1a1c"/><text x="37" y="599" class="t label">每个区域保存</text><text x="37" y="628" class="s label">筛选 · 选中 · 滚动 · 草稿</text><rect x="20" y="678" width="350" height="43" rx="10" fill="#222226"/><text x="37" y="705" class="s meta">减少动态效果：取消位移与推进动画</text><rect x="60" y="760" width="270" height="30" rx="8" fill="#141416"/><text x="195" y="780" text-anchor="middle" class="m meta">不用横向 Tab 滑动</text><rect x="134" y="830" width="122" height="5" rx="3" class="m"/></svg>
