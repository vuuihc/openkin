<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="t d"><title id="t">Mac：新建对话</title><desc id="d">Mac以列表旁的详情区显示新建表单，不用575px窄栏也不覆盖列表。</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.t{fill:#f5f5f7}.s{fill:#c7c7cc}.m{fill:#98989d}.b{fill:#222226}.small{font-size:12px}.meta{font-size:11px}</style></defs><rect width="1100" height="760" fill="#1a1a1c"/><rect width="256" height="760" fill="#141416"/><text x="26" y="49" font-size="22" font-weight="600" class="t">Kin</text><rect x="16" y="82" width="223" height="44" rx="10" fill="#2c2c2e"/><text x="34" y="109" class="t" font-size="14">▤  对话</text><g class="s" font-size="14"><text x="34" y="164">▱  项目</text><text x="34" y="217">◷  例行任务</text><text x="34" y="270">⚙  设置</text></g><text x="26" y="713" class="m meta">⌘K 搜索与命令</text><rect x="256" width="304" height="760" fill="#161618"/><path d="M256 0V760M560 0V760" stroke="#fff" stroke-opacity=".1"/><text x="280" y="49" font-size="19" font-weight="600" class="t">对话</text><rect x="276" y="74" width="264" height="36" rx="9" class="b"/><text x="293" y="96" class="m small">⌕  搜索对话</text><text x="280" y="159" class="m small">全部 · 待处理 · 已归档</text><text x="280" y="213" class="s small">本机 · 控制台</text><text x="282" y="251" class="t small">完善移动端的导航结构</text><text x="282" y="274" class="m meta">刚刚 · 正在运行</text><text x="282" y="318" class="t small">核对发布说明</text><text x="282" y="341" class="m meta">12 分钟前 · 待批准</text><text x="280" y="704" class="m meta">新建不会隐藏当前列表</text><text x="600" y="68" font-size="28" font-weight="600" class="t">开始一件事</text><text x="600" y="101" class="m" font-size="14">描述目标。所选运行配置随新建一起保留。</text><rect x="600" y="132" width="454" height="161" rx="14" class="b"/><text x="622" y="168" class="s" font-size="14">例如：检查手机上的导航返回行为</text><text x="622" y="198" class="m" font-size="14">并保留现有的搜索和筛选状态。</text><text x="1030" y="270" text-anchor="end" class="m meta">⌘ Enter 开始</text><rect x="600" y="315" width="454" height="63" rx="12" class="b"/><text x="620" y="341" class="m small">设备与项目</text><text x="620" y="364" class="t small">本机 / 控制台</text><text x="1034" y="353" class="m small">›</text><rect x="600" y="390" width="220" height="61" rx="12" class="b"/><text x="618" y="415" class="m small">Agent 与模型</text><text x="618" y="439" class="t small">默认 / 默认</text><rect x="834" y="390" width="220" height="61" rx="12" class="b"/><text x="852" y="415" class="m small">权限</text><text x="852" y="439" class="t small">每次询问</text><text x="600" y="499" class="m small">直接使用现有默认值，也可先完成这一段。</text><rect x="892" y="545" width="162" height="42" rx="10" fill="#0a84ff"/><text x="973" y="571" text-anchor="middle" fill="#fff" font-size="13">开始对话</text><text x="600" y="697" class="m meta">对话区 / 新建使用可用宽度，而不是一条窄栏</text></svg>
