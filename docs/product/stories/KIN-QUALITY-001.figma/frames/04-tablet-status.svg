<text x="298" y="136" font-size="12" fill="#1f1f1f">已经整理完。表格和结论保留在下面，状态展开不替换阅读。</text><rect x="292" y="692" width="516" height="270" rx="12" fill="#ffffff" stroke="#1f6feb"/>
