<text x="30" y="188" font-size="11.5" fill="#1a1a1a">标出需要我确认的三项。</text>
<rect x="16" y="218" width="358" height="96" rx="12" fill="#ffffff" stroke="#dddddd"/>
<text x="30" y="242" font-size="11" fill="#1a1a1a">读完了 3 个文件，先给出结论：</text>
<text x="30" y="262" font-size="11" fill="#3a3f47">1. 本周共 14 个改动，3 个需要确认；</text>
<text x="30" y="280" font-size="11" fill="#3a3f47">2. 发布说明已按模块分组；</text>
<text x="30" y="298" font-size="11" fill="#3a3f47">3. 截图归档还差最后一步。</text>
<text x="16" y="344" font-size="11.5" fill="#1a1a1a">第一项需要你确认：这次是否升 minor。</text>
<text x="16" y="366" font-size="11" fill="#6b6b6b">正文留在不透明表面上；玻璃从来不承担可读性。</text>

<rect x="16" y="402" width="358" height="88" rx="12" fill="#eef3ff" stroke="#1f6feb" stroke-dasharray="4 3"/>
<text x="30" y="426" font-size="12" font-weight="600" fill="#1f6feb">zen：底栏整体隐藏，不是变透明</text>
<text x="30" y="446" font-size="11" fill="#3a3f47">内容延伸到安全区，最后一行可直接读到手势区上沿；</text>
<text x="30" y="464" font-size="11" fill="#3a3f47">退出 zen 后底栏原位回来，区域、搜索与滚动都不变。</text>
<text x="30" y="482" font-size="11" fill="#3a3f47">zen 的开关沿用现有入口，底栏不新增按钮。</text>

<rect x="16" y="520" width="358" height="72" rx="12" fill="#f6f6f8"/>
<text x="30" y="546" font-size="11.5" fill="#1a1a1a">接下来我可以：</text>
<text x="30" y="568" font-size="11" fill="#3a3f47">把三项确认做成清单，或先生成草稿。</text>
<rect x="16" y="608" width="170" height="40" rx="10" fill="#ffffff" stroke="#dddddd"/>
