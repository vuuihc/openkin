<line x1="16" y1="690" x2="374" y2="690" stroke="#eeeeee" stroke-dasharray="4 4"/>
<text x="16" y="712" font-size="10.5" fill="#9a9a9f">这一带在默认态是悬浮玻璃底栏；zen 下不画、不占位。</text>
<text x="16" y="732" font-size="10.5" fill="#9a9a9f">底栏隐藏时 Tab 序也不含四个入口。</text>

