<text x="32" y="590" font-size="10" fill="#6b6b6b">三项都过才算一套；任何一项没结论都按不换处理。</text>

<rect x="16" y="630" width="358" height="76" rx="12" fill="#f6f6f8" stroke="#d5d5dd" stroke-dasharray="4 3"/>
<text x="30" y="654" font-size="11.5" font-weight="600" fill="#1a1a1a">状态只占头上一行</text>
<text x="30" y="672" font-size="10.5" fill="#555">进度不是控件，不进 Tab 序、不抢焦点；读屏只播报一次。</text>
<text x="30" y="690" font-size="10.5" fill="#555">核对期间翻列表、开对话、发消息都不受影响。</text>

