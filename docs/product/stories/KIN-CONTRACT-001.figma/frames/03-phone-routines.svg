<text x="26" y="263" font-size="10" fill="#1f6feb">看运行 ›</text>
<rect x="12" y="288" width="366" height="76" rx="12" fill="#ffffff" stroke="#dcdcdc"/>
<text x="26" y="312" font-size="12" fill="#1a1a1a" font-weight="600">夜间归档</text><text x="366" y="312" font-size="10" fill="#8a8a8a" text-anchor="end">停</text>
<text x="26" y="332" font-size="10" fill="#6b6b6b">每天 23:30 · 已暂停</text>
<text x="26" y="351" font-size="10" fill="#1f6feb">看运行 ›</text>
<rect x="12" y="392" width="366" height="96" rx="12" fill="#f7f7f9" stroke="#e3e3e3"/>
<text x="26" y="416" font-size="10.5" fill="#333" font-weight="600">这一页不画运行列表</text>
<text x="26" y="436" font-size="10" fill="#555">「看运行」跳到对话列表，筛好这个例行任务，</text>
<text x="26" y="454" font-size="10" fill="#555">每次运行就是一条任务行，点开就是那次的详情。</text>
<text x="26" y="476" font-size="9" fill="#8a8a8a">运行不再同时出现在两个页面；失败也有同一个去处</text>
<line x1="14" y1="520" x2="376" y2="520" stroke="#efefef"/>
<text x="14" y="546" font-size="10" fill="#6b6b6b">空：写「还没有例行任务」+「新建」，不铺插画</text>
<text x="14" y="566" font-size="10" fill="#6b6b6b">慢：行骨架，保留 header 与「新建」</text>
<text x="14" y="586" font-size="10" fill="#6b6b6b">失败：一行原因 + 重试；表单保存失败保留输入</text>
<text x="14" y="606" font-size="10" fill="#6b6b6b">断线：清单可读，保存与启停禁用并说明原因</text>
<rect x="14" y="716" width="362" height="56" rx="16" fill="#ffffff" stroke="#d8d8d8"/>
<text x="59" y="749" font-size="10.5" fill="#444" text-anchor="middle">对话</text>
<text x="150" y="749" font-size="10.5" fill="#444" text-anchor="middle">Agents</text>
