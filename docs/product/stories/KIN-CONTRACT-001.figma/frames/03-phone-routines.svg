<text x="324" y="749" font-size="10.5" fill="#444" text-anchor="middle">设置</text>
<text x="16" y="800" font-size="9.5" fill="#8a8a8a">页面保留，内容变窄：例行任务的增删改查留在这里，运行不进来</text>
<text x="16" y="818" font-size="9.5" fill="#8a8a8a">「看运行」只跳一次列表并带筛选，返回回到这一页原来的行</text>
<text x="16" y="836" font-size="9.5" fill="#8a8a8a">编辑与启停都是整行 44 高；不用滑动手势做删除</text>
