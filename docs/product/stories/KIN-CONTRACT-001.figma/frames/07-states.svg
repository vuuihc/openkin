<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="620" fill="#fbfbfd"/><text x="16" y="22" font-size="12" fill="#555">KIN-CONTRACT-001 · 状态板 1200×620</text>
<text x="1184" y="22" font-size="10" fill="#8a8a8a" text-anchor="end">状态不是新面：都在同一个 shell 里说一句话</text><line x1="0" y1="34" x2="1200" y2="34" stroke="#e0e0e0"/>
<rect x="16" y="52" width="382" height="250" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="34" y="80" font-size="12" fill="#1a1a1a" font-weight="600">空 · 列表 / 项目封面</text>
<line x1="34" y1="92" x2="380" y2="92" stroke="#efefef"/>
<text x="34" y="116" font-size="10.5" fill="#333">「还没有对话」+ 一个「新对话」</text>
<text x="34" y="138" font-size="10.5" fill="#333">项目封面空：「还没有工作说明」+「写一段」</text>
<text x="34" y="164" font-size="10" fill="#6b6b6b">不铺整页插画；不把搜索框藏掉</text>
<text x="34" y="190" font-size="10" fill="#6b6b6b">空状态里唯一的动作是主按钮，其余是文字</text>
<rect x="34" y="212" width="346" height="70" rx="10" fill="#f7f7f9" stroke="#e3e3e3"/>
<text x="48" y="236" font-size="10" fill="#333">还没有对话</text>
<rect x="48" y="248" width="90" height="26" rx="7" fill="#1f6feb"/><text x="93" y="265" font-size="9" fill="#ffffff" text-anchor="middle">新对话</text>
<rect x="410" y="52" width="382" height="250" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="428" y="80" font-size="12" fill="#1a1a1a" font-weight="600">加载 · 只局部</text>
<line x1="428" y1="92" x2="774" y2="92" stroke="#efefef"/>
<text x="428" y="116" font-size="10.5" fill="#333">列表首屏：行骨架，保留 header 与搜索</text>
<text x="428" y="138" font-size="10.5" fill="#333">对话：已有的内容不动，只给局部等待</text>
<text x="428" y="164" font-size="10" fill="#6b6b6b">禁止整页骨架（F1：消息不许消失）</text>
<text x="428" y="190" font-size="10" fill="#6b6b6b">超过 8 秒补一句「还在读取」，不换面</text>
<rect x="428" y="212" width="346" height="70" rx="10" fill="#f7f7f9" stroke="#e3e3e3"/>
<rect x="442" y="226" width="318" height="12" rx="4" fill="#e6e6ea"/><rect x="442" y="248" width="240" height="12" rx="4" fill="#e6e6ea"/>
<text x="442" y="276" font-size="8.5" fill="#8a8a8a">行骨架，不整页</text>
<rect x="804" y="52" width="380" height="250" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="822" y="80" font-size="12" fill="#1a1a1a" font-weight="600">失败 / 断线</text>
<line x1="822" y1="92" x2="1166" y2="92" stroke="#efefef"/>
<text x="822" y="116" font-size="10.5" fill="#333">失败：一行原因 + 重试，内容保留</text>
<text x="822" y="138" font-size="10.5" fill="#333">断线：一条 transient 说明，草稿不丢</text>
<text x="822" y="164" font-size="10" fill="#6b6b6b">不弹模态、不跳设置页；说明自己会消失</text>
<text x="822" y="190" font-size="10" fill="#6b6b6b">离线设备的行不可展开，点一次说明原因</text>
<rect x="822" y="212" width="344" height="70" rx="10" fill="#fff1f0" stroke="#f0c2bd"/>
<text x="836" y="236" font-size="10" fill="#7a3b34">连不上这台设备 · 正在重试</text>
<text x="836" y="258" font-size="9" fill="#7a3b34">草稿与已读内容仍在本机，不会重复发送</text>
<rect x="16" y="328" width="580" height="264" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="34" y="356" font-size="12" fill="#1a1a1a" font-weight="600">锁定 · 能力还没搬完的旧路径</text>
<line x1="34" y1="368" x2="580" y2="368" stroke="#efefef"/>
<text x="34" y="392" font-size="10.5" fill="#333">旧路径仍可用，退场表写「等哪条故事」；</text>
<text x="34" y="414" font-size="10.5" fill="#333">清单测试不允许把它的能力提前删掉。</text>
<text x="34" y="440" font-size="10" fill="#6b6b6b">例：/routines 在 R-routine-tool 合入前保持原样，</text>
<text x="34" y="458" font-size="10" fill="#6b6b6b">同一时间 routine card 的测试必须已经绿。</text>
<rect x="34" y="480" width="546" height="92" rx="10" fill="#f7f7f9" stroke="#e3e3e3"/>
<text x="48" y="504" font-size="10" fill="#333">退场表一行：/routines → routine 工具 + RoutineCard</text>
<text x="48" y="524" font-size="10" fill="#555">负责：R-routine-tool（未合入前保留页面）</text>
<text x="48" y="544" font-size="9" fill="#8a8a8a">清单测试读这张表；「负责」为空 → 不许删</text>
<rect x="620" y="328" width="564" height="264" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="638" y="356" font-size="12" fill="#1a1a1a" font-weight="600">键盘与焦点 · 每个面各一条</text>
<line x1="638" y1="368" x2="1166" y2="368" stroke="#efefef"/>
<text x="638" y="392" font-size="10.5" fill="#333">列表：Tab 到搜索，↑↓ 选行，Enter 打开，Esc 清空</text>
<text x="638" y="414" font-size="10.5" fill="#333">对话：composer 是唯一输入路径；Esc 关面板并还焦点</text>
<text x="638" y="436" font-size="10.5" fill="#333">设置：tab 之间 ←→；sheet 关闭回触发按钮</text>
<text x="638" y="458" font-size="10.5" fill="#333">项目封面：编辑入口在「⋯」，Esc 回「⋯」</text>
<text x="638" y="486" font-size="10" fill="#6b6b6b">旧路径重定向后，焦点落在目标面的第一个可操作元素，</text>
<text x="638" y="504" font-size="10" fill="#6b6b6b">不停在被重定向的地址上。</text>
<text x="638" y="538" font-size="10" fill="#8a8a8a">离开再回来：搜索、滚动、展开、草稿、面板开关各自复原；</text>
<text x="638" y="556" font-size="10" fill="#8a8a8a">重定向不写历史，返回不会回到旧路径。</text>
</g>
</svg>
