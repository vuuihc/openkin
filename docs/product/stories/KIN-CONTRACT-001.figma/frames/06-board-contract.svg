<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="880" fill="#fbfbfd"/><text x="16" y="22" font-size="12" fill="#555">KIN-CONTRACT-001 · 契约板 1200×880 · 15 条路由 → 4 个页面 + 一张退场表</text>
<text x="1184" y="22" font-size="10" fill="#8a8a8a" text-anchor="end">owner 2026-11-22 原话定的四条</text><line x1="0" y1="34" x2="1200" y2="34" stroke="#e0e0e0"/>
<rect x="16" y="50" width="520" height="800" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="34" y="80" font-size="13" fill="#1a1a1a" font-weight="600">现在 · 15 条 Route（ui/src/App.tsx）</text>
<text x="34" y="102" font-size="9.5" fill="#8a8a8a">4 条已是 redirect；真页面约 10 个</text>
<line x1="34" y1="112" x2="518" y2="112" stroke="#efefef"/>
<g font-size="10.5" fill="#333">
<text x="34" y="136">/</text><text x="300" y="136" fill="#8a8a8a">入口，落到哪由 StartRoute 决定</text>
<text x="34" y="162">/new</text><text x="300" y="162" fill="#8a8a8a">新对话草稿（任务详情的草稿态）</text>
<text x="34" y="188">/sessions</text><text x="300" y="188" fill="#8a8a8a">列表：设备 → 项目 → 对话</text>
<text x="34" y="214">/inbox</text><text x="300" y="214" fill="#8a8a8a">redirect → /sessions</text>
<text x="34" y="240">/approvals</text><text x="300" y="240" fill="#8a8a8a">redirect → /sessions</text>
<text x="34" y="266">/tasks/:id</text><text x="300" y="266" fill="#8a8a8a">任务详情（TaskSessionHost 渲染）</text>
<text x="34" y="292">/projects</text><text x="300" y="292" fill="#8a8a8a">项目集合页（与列表层级重复）</text>
<text x="34" y="318">/projects/:id</text><text x="300" y="318" fill="#8a8a8a">项目封面 + 工作说明</text>
<text x="34" y="344">/agents</text><text x="300" y="344" fill="#8a8a8a">redirect → /settings?tab=operations</text>
<text x="34" y="370">/routines</text><text x="300" y="370" fill="#8a8a8a">例行清单 + 倒序运行 feed（同一页）</text>
<text x="34" y="396">/machines/:device/tasks/:id</text><text x="300" y="396" fill="#8a8a8a">远端节点的任务</text>
<text x="34" y="422">/usage</text><text x="300" y="422" fill="#8a8a8a">redirect → /settings?tab=operations</text>
<text x="34" y="448">/settings</text><text x="300" y="448" fill="#8a8a8a">6 个 tab，含半成品 agents 安装检测</text>
<text x="34" y="474">/agent-sessions/:id</text><text x="300" y="474" fill="#8a8a8a">Agent 会话详情页</text>
<text x="34" y="500">*</text><text x="300" y="500" fill="#8a8a8a">redirect → /new</text>
<text x="34" y="526" fill="#8a8a8a">design-system</text><text x="300" y="526" fill="#8a8a8a">仅 dev build，生产没有</text>
</g>
<line x1="34" y1="544" x2="518" y2="544" stroke="#efefef"/>
<text x="34" y="572" font-size="11" fill="#b42318" font-weight="600">三个具体缺口</text>
<text x="34" y="594" font-size="10" fill="#7a3b34">① 例行页面把「例行任务」和「运行」放在一起，同一个运行</text>
<text x="34" y="612" font-size="10" fill="#7a3b34">在列表和例行页各出现一次；</text>
<text x="34" y="634" font-size="10" fill="#7a3b34">② 项目的工作说明只存在独立封面页里，列表看不到；</text>
<text x="34" y="656" font-size="10" fill="#7a3b34">③ 设置的 agents tab 是半成品（装没装说不准），</text>
<text x="34" y="674" font-size="10" fill="#7a3b34">可用与不可用混在一起。</text>
<text x="34" y="702" font-size="10" fill="#6b6b6b">问题不在数量，在没有边界：每加一个面，手机底栏就多</text>
<text x="34" y="720" font-size="10" fill="#6b6b6b">一个入口、验收就多一屏，十个面各好一半。</text>
<text x="34" y="752" font-size="10" fill="#6b6b6b">已做：#547 删 1,090 行死代码 + removed-surfaces 常驻。</text>
<text x="34" y="790" font-size="9.5" fill="#8a8a8a">本条不删页面：只冻结目标、顺序与检查器；删除一行一条 PR。</text>
<text x="34" y="812" font-size="9.5" fill="#8a8a8a">例外面：/ 与 * 是入口 redirect，不算页面。</text>
<rect x="560" y="50" width="624" height="330" rx="14" fill="#ffffff" stroke="#93b8f5"/>
<text x="578" y="80" font-size="13" fill="#1f6feb" font-weight="600">之后 · 4 个页面（owner 2026-11-22 原话）</text>
<line x1="578" y1="92" x2="1166" y2="92" stroke="#dbe7fb"/>
<g font-size="11" fill="#1a1a1a">
<text x="578" y="118" font-weight="600">1 · /sessions</text><text x="760" y="118" fill="#555">设备 → 项目 → 任务列表；运行就是任务行，带例行任务名</text>
<text x="578" y="146" font-weight="600">2 · /tasks/:id</text><text x="760" y="146" fill="#555">任务详情 + composer；文件/diff/PR 是同一路由内的面板</text>
<text x="578" y="174" font-weight="600">3 · /routines</text><text x="760" y="174" fill="#555">例行任务清单与增删改查；不含运行列表</text>
<text x="578" y="202" font-weight="600">4 · /settings</text><text x="760" y="202" fill="#555">general · operations · providers · routing · advanced</text>
</g>
<line x1="578" y1="218" x2="1166" y2="218" stroke="#efefef"/>
<text x="578" y="244" font-size="10" fill="#555">/new 是 2 的草稿态（同一 shell），不是第 5 个页面；</text>
<text x="578" y="262" font-size="10" fill="#555">手机底栏仍是 4 个入口（对话 / Agents / 例行 / 设置），</text>
<text x="578" y="280" font-size="10" fill="#555">Agents 落到设置的 operations tab，已签底栏故事不改。</text>
<text x="578" y="308" font-size="10" fill="#555">项目不再是页面：项目行展开读工作说明，编辑走「⋯」。</text>
<text x="578" y="326" font-size="10" fill="#555">设置只删 agents tab；其它 5 个 tab 与 provider 凭据位置不动。</text>
<text x="578" y="352" font-size="9.5" fill="#8a8a8a">删除顺序：能力先在新位置可读，旧路径后删；清单测试挡住新增。</text>
<rect x="560" y="396" width="624" height="454" rx="14" fill="#ffffff" stroke="#dcdcdc"/>
<text x="578" y="426" font-size="13" fill="#1a1a1a" font-weight="600">退场表 · 每条旧路径都有落点与负责人</text>
<line x1="578" y1="438" x2="1166" y2="438" stroke="#efefef"/>
<g font-size="10" fill="#333">
<text x="578" y="462">/inbox、/approvals</text><text x="740" y="462">→ /sessions</text><text x="1166" y="462" text-anchor="end" fill="#8a8a8a">已落地</text>
<text x="578" y="488">/agents</text><text x="740" y="488">→ /settings?tab=operations</text><text x="1166" y="488" text-anchor="end" fill="#8a8a8a">已落地</text>
<text x="578" y="514">/usage</text><text x="740" y="514">→ /settings?tab=operations（用量界面不动）</text><text x="1166" y="514" text-anchor="end" fill="#8a8a8a">已落地</text>
<text x="578" y="540">/routines 的运行 feed</text><text x="740" y="540">→ /sessions 的任务行 + 「看运行」筛选</text><text x="1166" y="540" text-anchor="end" fill="#8a8a8a">本条</text>
<text x="578" y="566">/projects</text><text x="740" y="566">→ /sessions 的项目层级</text><text x="1166" y="566" text-anchor="end" fill="#8a8a8a">R-delete-pages</text>
<text x="578" y="592">/projects/:id</text><text x="740" y="592">→ 项目行展开读工作说明（只读）</text><text x="1166" y="592" text-anchor="end" fill="#8a8a8a">R-delete-pages</text>
<text x="578" y="618">/agent-sessions/:id</text><text x="740" y="618">→ /tasks/:id 的会话动作表</text><text x="1166" y="618" text-anchor="end" fill="#8a8a8a">R-agent-status</text>
<text x="578" y="644">/machines/:device/tasks/:id</text><text x="740" y="644">→ /tasks/:id?device=</text><text x="1166" y="644" text-anchor="end" fill="#8a8a8a">本条</text>
<text x="578" y="670">Settings 的 agents tab</text><text x="740" y="670">→ 删除；安装检测重做后由新 story 回来</text><text x="1166" y="670" text-anchor="end" fill="#8a8a8a">本条</text>
<text x="578" y="696">design-system</text><text x="740" y="696">→ 仅 dev；生产路由清单不含</text><text x="1166" y="696" text-anchor="end" fill="#8a8a8a">本条</text>
</g>
<line x1="578" y1="712" x2="1166" y2="712" stroke="#efefef"/>
<text x="578" y="738" font-size="10" fill="#6b6b6b">规则：能力没搬完，旧路径不删；「负责」为空的行，</text>
<text x="578" y="756" font-size="10" fill="#6b6b6b">清单测试不允许把它从契约里去掉。</text>
<text x="578" y="782" font-size="10" fill="#6b6b6b">清单测试：App.tsx 的每条 path 必须在「4 个页面」、/new</text>
<text x="578" y="800" font-size="10" fill="#6b6b6b">或退场表里；多一条、少一条都红，并打印 KIN-CONTRACT-001。</text>
<text x="578" y="826" font-size="9.5" fill="#8a8a8a">设置 tab 集合、/routines 不拉运行，也由同一套测试断言。</text>
</g>
</svg>
