<svg xmlns="http://www.w3.org/2000/svg" width="480" height="620" viewBox="0 0 480 620" font-family="-apple-system, sans-serif">
  <rect width="480" height="620" fill="#1e1e22"/>
  <text x="240" y="24" fill="#9a9aa2" font-size="12" text-anchor="middle">Mac · 更新状态板 · KIN-SETTINGS-002</text>
  <g>
    <rect x="20" y="40" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="34" y="62" fill="#8a8a92" font-size="11">检查中</text>
    <text x="34" y="86" fill="#dcdce2" font-size="13">正在检查…</text>
    <text x="34" y="108" fill="#6a6a72" font-size="10">disabled · 结果未回</text>
  </g>
  <g>
    <rect x="250" y="40" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="264" y="62" fill="#8a8a92" font-size="11">已是最新</text>
    <text x="264" y="86" fill="#dcdce2" font-size="13">已是最新（0.3.2）</text>
    <text x="264" y="108" fill="#6a6a72" font-size="10">disabled</text>
  </g>
  <g>
    <rect x="20" y="140" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="34" y="162" fill="#8a8a92" font-size="11">发现新版</text>
    <text x="34" y="186" fill="#8ab4f8" font-size="13">下载 0.4.0…</text>
    <text x="34" y="208" fill="#6a6a72" font-size="10">click → 下载到临时目录</text>
  </g>
  <g>
    <rect x="250" y="140" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="264" y="162" fill="#8a8a92" font-size="11">下载中</text>
    <text x="264" y="186" fill="#dcdce2" font-size="13">下载中… 62%</text>
    <text x="264" y="208" fill="#6a6a72" font-size="10">disabled · 按字节计</text>
  </g>
  <g>
    <rect x="20" y="240" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="34" y="262" fill="#8a8a92" font-size="11">已下载</text>
    <text x="34" y="284" fill="#8ab4f8" font-size="13">安装 0.4.0（已下载）</text>
    <text x="34" y="302" fill="#8ab4f8" font-size="11">删除已下载的安装包</text>
    <text x="34" y="318" fill="#6a6a72" font-size="10">click → open dmg + 确认退出</text>
  </g>
  <g>
    <rect x="250" y="240" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="264" y="262" fill="#8a8a92" font-size="11">检查失败</text>
    <text x="264" y="284" fill="#e08080" font-size="12">更新检查失败：GitHub API 403</text>
    <text x="264" y="308" fill="#8ab4f8" font-size="12">重试检查…</text>
  </g>
  <g>
    <rect x="20" y="340" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="34" y="362" fill="#8a8a92" font-size="11">开发构建</text>
    <text x="34" y="386" fill="#dcdce2" font-size="13">菜单同默认</text>
    <text x="34" y="408" fill="#6a6a72" font-size="10">点击 → 通知“开发构建不检查更新”</text>
  </g>
  <g>
    <rect x="250" y="340" width="210" height="88" rx="8" fill="#2a2a30" stroke="#4a4a52"/>
    <text x="264" y="362" fill="#8a8a92" font-size="11">通知 · 已下载</text>
    <text x="264" y="384" fill="#dcdce2" font-size="12">Kin 0.4.0 已下载</text>
    <text x="264" y="402" fill="#dcdce2" font-size="11">点击安装：拖入 Applications</text>
    <text x="264" y="420" fill="#6a6a72" font-size="10">点通知 = 安装动作</text>
  </g>
  <g>
    <rect x="20" y="440" width="440" height="56" rx="8" fill="#2a2a30" stroke="#5a5a64"/>
    <text x="34" y="462" fill="#8a8a92" font-size="11">确认弹窗（安装首次点击后）</text>
    <text x="34" y="482" fill="#dcdce2" font-size="12">Kin 0.4.0 已下载 — 要退出以安装吗？　[稍后] [退出并打开]</text>
  </g>
  <text x="240" y="524" fill="#9a9aa2" font-size="11" text-anchor="middle">流程：检查 → 发现 → 下载（进度） → 已下载 → open dmg → 确认 → 拖装 → 重开</text>
  <text x="240" y="546" fill="#6a6a72" font-size="10" text-anchor="middle">未签名 app 不能自替换：诚实的终点是挂载 dmg + 拖装覆盖；稍后 → 「打开已下载的 X」可再点</text>
  <text x="240" y="572" fill="#8a8a92" font-size="10" text-anchor="middle">断线：GitHub 不可达 → “检查失败” 通知 + 菜单恢复；open 失败 → “安装包打不开”</text>
  <text x="240" y="592" fill="#8a8a92" font-size="10" text-anchor="middle">离开再回来：已下载项保留至重启或「删除已下载的安装包」；键盘：确认弹窗 Tab + Esc=稍后</text>
</svg>
