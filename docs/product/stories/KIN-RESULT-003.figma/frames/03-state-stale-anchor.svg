<text x="796" y="486" class="tiny muted">原块头与引用文本一并保留</text>

<text x="780" y="540" class="small muted">本轮 3 条评论 · 1 条锚点失效</text>
<rect x="780" y="556" width="680" height="52" rx="10" class="primary"/>
<text x="1120" y="588" text-anchor="middle" class="label" fill="#fff">发送 3 条评论</text>
<text x="780" y="636" class="tiny muted">发送走现有后续消息路径：一条短说明 + 每条一段（文件、块头、引用行、自己的话）</text>

<rect x="780" y="660" width="680" height="120" rx="10" fill="#1a1d21" stroke-dasharray="6 5"/>
<text x="796" y="688" class="small">发送之后</text>
<text x="796" y="712" class="tiny muted">托盘清空并显示「已发回对话 · 3 条」；对话里只多一条普通用户消息</text>
<text x="796" y="732" class="tiny muted">行上留一个灰点，点开能看到那条消息（D6，待签）</text>
<text x="796" y="752" class="tiny muted">已发出的内容不会因为本地删除而改变；刷新后托盘不复活</text>

<rect y="830" width="1500" height="30" fill="#181b1e"/>
<text x="18" y="850" class="small muted">该行已变化 = 文件里找不到引用行 · 评论仍保留 · 行号变化不算失效 · 颜色之外还有文字</text>
