<text x="56" y="410" class="tiny" fill="#ff8a80">块头还在，但引用行「hint,」已不在这段里</text>
<text x="56" y="434" class="tiny muted">文件里的其他行向右挪了 1 行，评论仍指向原块头</text>
<text x="56" y="462" class="tiny muted">行出现时自动恢复指向同一行；不会"猜"到最近的相似行</text>
<text x="56" y="486" class="tiny muted">文件被整个删掉时同样保留，不弹确认、不清空托盘</text>
<text x="56" y="510" class="tiny muted">读屏读出「该行已变化」，不只靠颜色</text>

<rect x="470" y="124" width="250" height="250" rx="10" fill="#1d2125" stroke="#b42318"/>
