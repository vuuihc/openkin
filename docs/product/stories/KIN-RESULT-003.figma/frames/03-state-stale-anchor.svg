<text x="40" y="82" class="title">A · 引用行不在了：保留并标出来</text>
<text x="40" y="104" class="small muted">不静默丢弃，也不改指向最近的一行；行号变化不算失效</text>

<rect x="40" y="124" width="410" height="400" rx="10" fill="#171a1d"/>
