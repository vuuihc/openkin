<text x="486" y="354" class="tiny muted">删除 · 复制原文</text>

<rect x="470" y="392" width="250" height="132" rx="10" fill="#1a1d21"/>
<text x="486" y="418" class="small">行号变了 → 仍有效</text>
<text x="486" y="440" class="tiny muted">按块头 + 引用行找，不按行号</text>
<text x="486" y="470" class="small" fill="#ff8a80">引用行没了 → 该行已变化</text>
<text x="486" y="492" class="tiny muted">保留原文；可删、可复制</text>
<text x="486" y="512" class="tiny muted">不做模糊匹配，避免挂错行</text>

<rect x="40" y="556" width="680" height="80" rx="10" fill="#1a1d21"/>
<text x="56" y="584" class="small">「该行已变化」只在找不到引用行时出现。</text>
<text x="56" y="608" class="tiny muted">内容相同、行号不同 → 仍然有效，标记跟着行走；不做模糊匹配，避免挂错行。</text>

<rect x="40" y="660" width="680" height="120" rx="10" fill="#1a1d21"/>
<text x="56" y="688" class="small">空 / 加载 / 失败 / 断线</text>
<text x="56" y="712" class="tiny muted">本轮没有评论 → 托盘不出现，不是空面板</text>
<text x="56" y="732" class="tiny muted">diff 加载或失败 → 行上没有入口，说明原因并可重试</text>
<text x="56" y="752" class="tiny muted">断线 → 已加载的行仍可评论，评论只在本机，不显示成已发送</text>

<rect x="760" y="48" width="720" height="770" rx="14" fill="#16191c"/>
<text x="780" y="82" class="title">B · 托盘：一组评论一次发回</text>
<text x="780" y="104" class="small muted">两条有效、一条失效；发送前逐条可跳回、改、删</text>

