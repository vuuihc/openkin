<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="800" height="900" fill="#fbfbfd"/>

<text x="20" y="18" font-size="11" fill="#6b6b6b">底部入口的形态 · 同一套返回规则 · 390 宽的手机屏，状态板</text>

<g>
<rect x="20" y="30" width="380" height="400" rx="20" fill="#ffffff" stroke="#dddddd"/>
<text x="36" y="56" font-size="10.5" fill="#1f6feb">01 · 归档</text>
<text x="384" y="56" font-size="10.5" fill="#6b6b6b" text-anchor="end">同一页的范围</text>
<text x="36" y="90" font-size="18" font-weight="600" fill="#1a1a1a">对话</text>
<rect x="36" y="104" width="348" height="40" rx="11" fill="#f6f6f8"/>
<text x="50" y="128" font-size="11.5" fill="#6b6b6b">搜索对话…</text>
<rect x="36" y="156" width="348" height="32" rx="10" fill="#eef3ff"/>
<text x="50" y="176" font-size="10.5" fill="#1f6feb">已归档 · 3 段对话</text>
<text x="370" y="176" font-size="10.5" fill="#1f6feb" text-anchor="end">清除</text>
<rect x="36" y="200" width="348" height="48" rx="11" fill="#ffffff"/>
<text x="50" y="220" font-size="11.5" font-weight="600" fill="#1a1a1a">旧的发布说明</text>
<text x="50" y="237" font-size="10" fill="#6b6b6b">alpha · 上周</text>
<rect x="36" y="256" width="348" height="48" rx="11" fill="#ffffff"/>
<text x="50" y="276" font-size="11.5" font-weight="600" fill="#1a1a1a">迁移草稿</text>
<text x="50" y="293" font-size="10" fill="#6b6b6b">gamma · 上周</text>
<text x="36" y="340" font-size="10.5" fill="#6b6b6b">归档不换页：同一份列表换一个范围，</text>
<text x="36" y="356" font-size="10.5" fill="#6b6b6b">离开再回来仍是归档，直到点「清除」。</text>
<text x="36" y="390" font-size="10.5" fill="#999">底部四个入口始终在；这一页没有抽屉。</text>
</g>

<g>
<rect x="400" y="30" width="380" height="400" rx="20" fill="#ffffff" stroke="#dddddd"/>
<text x="416" y="56" font-size="10.5" fill="#1f6feb">02 · Agent 运维（导入在这里）</text>
<text x="764" y="56" font-size="10.5" fill="#6b6b6b" text-anchor="end">整页推出</text>
<text x="416" y="88" font-size="18" fill="#1f6feb">‹</text>
<text x="436" y="88" font-size="15" font-weight="600" fill="#1a1a1a">Agent 运维</text>
<rect x="416" y="104" width="348" height="38" rx="11" fill="#1f6feb"/>
<text x="590" y="128" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">↧  导入会话</text>
<rect x="416" y="154" width="348" height="52" rx="11" fill="#f6f6f8"/>
<text x="430" y="175" font-size="11.5" font-weight="600" fill="#1a1a1a">Claude Code</text>
<text x="430" y="192" font-size="10" fill="#6b6b6b">已连接 · 12 段会话</text>
<rect x="416" y="216" width="348" height="52" rx="11" fill="#ffffff" stroke="#eeeeee"/>
<text x="430" y="237" font-size="11.5" font-weight="600" fill="#1a1a1a">Codex</text>
<text x="430" y="254" font-size="10" fill="#6b6b6b">已连接 · 8 段会话</text>
<rect x="416" y="278" width="348" height="52" rx="11" fill="#ffffff" stroke="#eeeeee"/>
<text x="430" y="299" font-size="11.5" font-weight="600" fill="#1a1a1a">Gemini CLI</text>
<text x="430" y="316" font-size="10" fill="#6b6b6b">已连接 · 3 段会话</text>
<text x="416" y="354" font-size="10.5" fill="#6b6b6b">导入是这一页页头的动作；选完留在这一页，</text>
<text x="416" y="370" font-size="10.5" fill="#6b6b6b">下一次回列表就能看到新会话。</text>
<text x="416" y="390" font-size="10.5" fill="#999">列表页没有导入入口；它不是第二个导航面。</text>
</g>

<g>
<rect x="20" y="450" width="380" height="400" rx="20" fill="#ffffff" stroke="#dddddd"/>
<text x="36" y="476" font-size="10.5" fill="#1f6feb">03 · 例行任务</text>
<text x="384" y="476" font-size="10.5" fill="#6b6b6b" text-anchor="end">整页推出</text>
<text x="36" y="510" font-size="18" fill="#1f6feb">‹</text>
<text x="56" y="510" font-size="15" font-weight="600" fill="#1a1a1a">例行任务</text>
<text x="36" y="540" font-size="10.5" fill="#6b6b6b">本机 · 在线</text>
<rect x="36" y="552" width="348" height="64" rx="12" fill="#f6f6f8"/>
<text x="50" y="574" font-size="11.5" font-weight="600" fill="#1a1a1a">每日教训复盘</text>
<text x="50" y="592" font-size="10" fill="#6b6b6b">每天 07:30 · 上次成功</text>
<text x="370" y="580" font-size="10.5" fill="#1f6feb" text-anchor="end">运行</text>
<rect x="36" y="626" width="348" height="64" rx="12" fill="#ffffff" stroke="#eeeeee"/>
<text x="50" y="648" font-size="11.5" font-weight="600" fill="#1a1a1a">周五整理发布说明</text>
<text x="50" y="666" font-size="10" fill="#6b6b6b">每周五 17:00 · 等待中</text>
<text x="36" y="720" font-size="10.5" fill="#6b6b6b">页头返回、系统返回、左缘右滑：</text>
<text x="36" y="736" font-size="10.5" fill="#6b6b6b">一步回到列表，焦点回到「例行」入口。</text>
<text x="36" y="770" font-size="10.5" fill="#999">没有 dock；目的地不再互相切换。</text>
</g>

<g>
<rect x="400" y="450" width="380" height="400" rx="20" fill="#ffffff" stroke="#dddddd"/>
<text x="416" y="476" font-size="10.5" fill="#1f6feb">04 · 设置（Agent 运维同骨架）</text>
<text x="764" y="476" font-size="10.5" fill="#6b6b6b" text-anchor="end">整页推出</text>
<text x="416" y="510" font-size="18" fill="#1f6feb">‹</text>
<text x="436" y="510" font-size="15" font-weight="600" fill="#1a1a1a">设置</text>
<rect x="416" y="528" width="348" height="44" rx="11" fill="#f6f6f8"/>
<text x="430" y="555" font-size="11.5" fill="#1a1a1a">通用</text>
<rect x="416" y="578" width="348" height="44" rx="11" fill="#ffffff" stroke="#eeeeee"/>
<text x="430" y="605" font-size="11.5" fill="#1a1a1a">外观</text>
<rect x="416" y="628" width="348" height="44" rx="11" fill="#ffffff" stroke="#eeeeee"/>
<text x="430" y="655" font-size="11.5" fill="#1a1a1a">通知</text>
<text x="416" y="720" font-size="10.5" fill="#6b6b6b">设置是最后一个目的地，不是第五个面。</text>
<text x="416" y="736" font-size="10.5" fill="#6b6b6b">Esc 只关设置；返回落回列表，焦点回到入口。</text>
<text x="416" y="770" font-size="10.5" fill="#999">Agent 运维、设置、例行任务共用同一副页头。</text>
</g>

<text x="20" y="884" font-size="11" fill="#6b6b6b">所有目的地都从列表页推出、回到列表页；唯一的列表和搜索始终在列表页上，不在任何弹出层里。</text>
<rect x="0.5" y="0.5" width="799" height="899" fill="none" stroke="#dddddd"/>
</g>
</svg>
