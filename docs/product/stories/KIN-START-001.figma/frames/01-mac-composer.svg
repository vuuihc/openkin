<text x="700" y="250" font-size="26" fill="#1a1a1a" font-weight="600" text-anchor="middle">想让 Kin 做什么？</text>
<text x="700" y="278" font-size="12" fill="#6b6b6b" text-anchor="middle">写一句，选好，开始；其余沿用上次的选择。</text>
<text x="700" y="306" font-size="11" fill="#999" text-anchor="middle">项目在卡上单独一条：先选机器，再选它上面的项目；换机器后 agent 列表跟着换。</text>
<text x="700" y="326" font-size="11" fill="#999" text-anchor="middle">开始后进入对话页：同一条底栏、同一个宽度；没有可用 agent、机器离线或断线时「开始」禁用并说明。</text>

