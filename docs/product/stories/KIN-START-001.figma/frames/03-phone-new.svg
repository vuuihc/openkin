<text x="68" y="76" font-size="11.5" fill="#6b6b6b">写 → 在哪儿跑 → 怎么跑 → 开始</text>

<text x="16" y="108" font-size="11.5" fill="#1f6feb" font-weight="600">① 写提示词</text>
