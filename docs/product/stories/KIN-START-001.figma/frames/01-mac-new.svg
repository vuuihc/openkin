<text x="12" y="21" font-size="12" fill="#555">Mac 1100×760 · 新建对话（KIN-START-001）</text>
<text x="1088" y="21" font-size="11" fill="#6b6b6b" text-anchor="end">居中输入卡：写 → 开始；项目在卡下</text>

<rect x="0" y="32" width="300" height="728" fill="#fbfbfb"/>
<line x1="300" y1="32" x2="300" y2="760" stroke="#e3e3e3"/>
<text x="24" y="62" font-size="18" fill="#1a1a1a" font-weight="600">K</text>
<rect x="20" y="84" width="260" height="34" rx="8" fill="#1f6feb"/>
<text x="150" y="106" font-size="12" fill="#ffffff" text-anchor="middle">＋ 新建对话</text>
<rect x="20" y="130" width="260" height="30" rx="8" fill="#ffffff" stroke="#dddddd"/>
<text x="32" y="150" font-size="11.5" fill="#999">搜索对话…</text>
<text x="20" y="190" font-size="11" fill="#6b6b6b">本机</text>
<rect x="12" y="198" width="276" height="28" rx="7" fill="#eef3ff"/>
<text x="24" y="217" font-size="12" fill="#1f6feb" font-weight="600">alpha</text>
<text x="44" y="243" font-size="11.5" fill="#444">对话 A</text>
<text x="44" y="269" font-size="11.5" fill="#444">对话 B</text>
<text x="24" y="299" font-size="11.5" fill="#444">beta</text>
<text x="20" y="736" font-size="11" fill="#6b6b6b">导入 · 归档 · 设置</text>

<text x="324" y="72" font-size="12" fill="#6b6b6b">新建对话 · 草稿自动保留</text>
<text x="700" y="186" font-size="26" fill="#1a1a1a" font-weight="600" text-anchor="middle">想让 Kin 做什么？</text>
<text x="700" y="214" font-size="12" fill="#6b6b6b" text-anchor="middle">写一句，选好，开始；其余沿用上次的选择。</text>

<rect x="380" y="238" width="640" height="180" rx="16" fill="#ffffff" stroke="#1f6feb"/>
<text x="404" y="274" font-size="13.5" fill="#555">把这周的发布说明整理成一页，</text>
<text x="404" y="298" font-size="13.5" fill="#555">标出需要我确认的三项。</text>
<text x="404" y="326" font-size="11" fill="#999">⌘Enter 开始；只有空白字符也算空，开始按钮不可点。</text>
<line x1="404" y1="352" x2="996" y2="352" stroke="#eeeeee"/>
<rect x="396" y="368" width="92" height="32" rx="16" fill="#f6f6f8" stroke="#dddddd"/>
<text x="442" y="389" font-size="11.5" fill="#1a1a1a" text-anchor="middle">只读 ▾</text>
<text x="900" y="389" font-size="12" fill="#1a1a1a" text-anchor="end">Claude Code · 默认模型 ▾</text>
<rect x="932" y="364" width="66" height="34" rx="17" fill="#1f6feb"/>
<text x="965" y="386" font-size="12" fill="#ffffff" text-anchor="middle">开始</text>

<rect x="380" y="436" width="640" height="42" rx="12" fill="#f6f6f8"/>
<path d="M400 451h11l4 4h9v12h-24z" fill="none" stroke="#6b6b6b" stroke-linejoin="round"/>
<text x="424" y="462" font-size="12.5" fill="#1a1a1a" font-weight="600">本机 · alpha</text>
<text x="1000" y="461" font-size="12" fill="#1f6feb" text-anchor="end">更换 ▾</text>

<text x="700" y="510" font-size="11" fill="#6b6b6b" text-anchor="middle">项目在卡下单独一条：先选机器，再选它上面的项目；换机器后 agent 列表跟着换。</text>
<text x="700" y="532" font-size="11" fill="#999" text-anchor="middle">没有可用 agent、机器离线或断线时，「开始」禁用并就地说明原因；提示词不丢。</text>
<rect x="0.5" y="0.5" width="1099" height="759" fill="none" rx="10" stroke="#bbbbbb"/>
