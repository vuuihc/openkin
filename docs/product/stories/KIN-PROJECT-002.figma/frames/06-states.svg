<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="1600" height="900" fill="#f4f4f6"/><text x="30" y="42" font-size="20" fill="#1a1a1a" font-weight="600">工作目录 · 状态板（KIN-PROJECT-002）</text><text x="30" y="66" font-size="12" fill="#666">只画当前 API 能产生的状态：没有对已保存 root 的文件系统检查，所以没有「目录不存在」。</text>
<text x="1570" y="42" font-size="11" fill="#888" text-anchor="end">Mac / 手机共用同一套文案；形状按各自的面呈现</text><!-- 1 没有目录 --><rect x="30" y="92" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/>
<text x="52" y="126" font-size="14" fill="#1a1a1a" font-weight="600">1 · 没有目录</text><rect x="52" y="148" width="456" height="180" rx="10" fill="#ffffff" stroke="#c4c4c4"/><text x="68" y="176" font-size="13" fill="#1a1a1a" font-weight="600">工作目录</text>
<circle cx="492" cy="171" r="14" fill="#fbfbfb" stroke="#bbbbbb"/><text x="492" y="175" font-size="12" fill="#999" text-anchor="middle">＋</text><text x="68" y="212" font-size="12.5" fill="#555">这个项目还没有目录。</text>
<rect x="68" y="232" width="112" height="40" rx="10" fill="#1f6feb"/><text x="124" y="257" font-size="12" fill="#ffffff" text-anchor="middle">添加目录</text><text x="68" y="300" font-size="11" fill="#888">「新建对话」此刻禁用，原因写在按钮旁。</text>
<text x="52" y="356" font-size="11.5" fill="#666">说清下一步：添加一个目录就能开始。</text><text x="52" y="380" font-size="11.5" fill="#666">不画一排 0，也不假装目录是空的。</text><!-- 2 一个目录 -->
<rect x="550" y="92" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/><text x="572" y="126" font-size="14" fill="#1a1a1a" font-weight="600">2 · 一个目录</text><rect x="572" y="148" width="456" height="150" rx="10" fill="#ffffff" stroke="#c4c4c4"/>
<text x="588" y="176" font-size="13" fill="#1a1a1a" font-weight="600">工作目录</text><rect x="956" y="160" width="54" height="28" rx="10" fill="#ffffff" stroke="#1f6feb"/><text x="983" y="179" font-size="11" fill="#1f6feb" text-anchor="middle">编辑</text>
<text x="588" y="196" font-size="11" fill="#6b6b6b">新对话默认落在这个目录。</text><rect x="588" y="210" width="424" height="42" rx="7" fill="#eef2ff" stroke="#c9d9ff"/><text x="602" y="236" font-size="12" fill="#1a1a1a">/work/alpha</text>
<rect x="946" y="220" width="46" height="20" rx="10" fill="#eef2ff" stroke="#1f6feb"/><text x="969" y="234" font-size="10" fill="#1f6feb" text-anchor="middle">默认</text><text x="572" y="332" font-size="11.5" fill="#666">只有一个目录时仍显示「默认」；</text>
<text x="572" y="356" font-size="11.5" fill="#666">不出现排序说明，也没有拖拽手柄。</text><text x="572" y="380" font-size="11.5" fill="#666">「新建对话」直接带这个 cwd（KIN-PROJECT-001 D4）。</text><!-- 3 保存中 -->
<rect x="1070" y="92" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/><text x="1092" y="126" font-size="14" fill="#1a1a1a" font-weight="600">3 · 保存中</text><rect x="1092" y="148" width="456" height="220" rx="10" fill="#ffffff" stroke="#bdbdbd"/>
<text x="1108" y="176" font-size="13" fill="#1a1a1a" font-weight="600">工作目录</text><rect x="1108" y="190" width="424" height="42" rx="7" fill="#f7f7f8" stroke="#e3e3e3"/><text x="1122" y="216" font-size="12" fill="#777">/work/alpha</text>
<rect x="1108" y="238" width="424" height="42" rx="7" fill="#f7f7f8" stroke="#e3e3e3"/><text x="1122" y="264" font-size="12" fill="#777">/work/alpha-config</text><rect x="1388" y="300" width="144" height="44" rx="11" fill="#c9d9ff"/>
<circle cx="1410" cy="322" r="7" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="30 12"/><text x="1466" y="327" font-size="12" fill="#1f6feb" text-anchor="middle">保存中…</text><text x="1092" y="400" font-size="11.5" fill="#666">按钮禁用，草稿和焦点留在浮层里；</text>
<text x="1092" y="424" font-size="11.5" fill="#666">慢时写「仍在保存…」，不静默回滚。</text><text x="1092" y="448" font-size="11.5" fill="#666">封面不提前变，保存成功才更新。</text><!-- 4 保存失败 -->
<rect x="30" y="492" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/><text x="52" y="526" font-size="14" fill="#1a1a1a" font-weight="600">4 · 保存失败</text><rect x="52" y="548" width="456" height="250" rx="10" fill="#ffffff" stroke="#bdbdbd"/>
<text x="68" y="576" font-size="13" fill="#1a1a1a" font-weight="600">工作目录</text><rect x="68" y="590" width="424" height="40" rx="8" fill="#fff1f0" stroke="#b42318"/><text x="82" y="615" font-size="11.5" fill="#b42318">保存失败：网络中断，列表没有改变。</text>
<text x="478" y="615" font-size="11.5" fill="#b42318" text-anchor="end">重试</text><rect x="68" y="642" width="424" height="42" rx="7" fill="#eef2ff" stroke="#c9d9ff"/><text x="82" y="668" font-size="12" fill="#1a1a1a">/work/alpha-config</text>
<text x="68" y="712" font-size="11.5" fill="#666">草稿保留（包括新加的目录和默认位置）。</text><text x="68" y="736" font-size="11.5" fill="#666">原因 + 重试 + 焦点回到「保存」。</text><text x="68" y="760" font-size="11.5" fill="#666">403 / 离线：说明原因，禁用保存。</text>
<!-- 5 离线 / 只读 --><rect x="550" y="492" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/><text x="572" y="526" font-size="14" fill="#1a1a1a" font-weight="600">5 · 离线 / 只读</text>
<rect x="572" y="548" width="456" height="220" rx="10" fill="#ffffff" stroke="#c4c4c4"/><rect x="572" y="548" width="456" height="36" rx="10" fill="#f7f7f8"/><text x="588" y="571" font-size="11" fill="#666">离线 · 显示上次结果（2 分钟前）</text>
<text x="588" y="606" font-size="13" fill="#1a1a1a" font-weight="600">工作目录</text><rect x="956" y="590" width="54" height="28" rx="10" fill="#f2f2f4" stroke="#d4d4d8"/><text x="983" y="609" font-size="11" fill="#999" text-anchor="middle">编辑</text>
<rect x="588" y="624" width="424" height="42" rx="7" fill="#f7f7f8" stroke="#e3e3e3"/><text x="602" y="650" font-size="12" fill="#666">/work/alpha</text><rect x="946" y="634" width="46" height="20" rx="10" fill="#f7f7f8" stroke="#d4d4d8"/>
<text x="969" y="648" font-size="10" fill="#999" text-anchor="middle">默认</text><text x="572" y="712" font-size="11.5" fill="#666">编辑入口禁用，原因可见：「离线，恢复后</text><text x="572" y="736" font-size="11.5" fill="#666">才能修改目录」。路径仍可读、可复制。</text>
<text x="572" y="760" font-size="11.5" fill="#666">不把旧列表说成刚读到的。</text><!-- 6 未保存修改 --><rect x="1070" y="492" width="500" height="376" rx="14" fill="#ffffff" stroke="#c4c4c4"/>
<text x="1092" y="526" font-size="14" fill="#1a1a1a" font-weight="600">6 · 关闭前有未保存修改</text><rect x="1092" y="548" width="456" height="120" rx="10" fill="#f7f7f8" stroke="#d4d4d8"/><text x="1320" y="586" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="600">放弃这些修改？</text>
<text x="1320" y="608" font-size="11" fill="#666" text-anchor="middle">新增、移除和默认位置都还没保存。</text><rect x="1112" y="622" width="200" height="34" rx="9" fill="#ffffff" stroke="#bbbbbb"/><text x="1212" y="644" font-size="11.5" fill="#444" text-anchor="middle">继续编辑</text>
<rect x="1328" y="622" width="200" height="34" rx="9" fill="#b42318"/><text x="1428" y="644" font-size="11.5" fill="#ffffff" text-anchor="middle">放弃修改</text><text x="1092" y="712" font-size="11.5" fill="#666">Esc 等同「继续编辑」，焦点回到浮层。</text>
<text x="1092" y="736" font-size="11.5" fill="#666">点浮层外也走这一问，不直接丢弃。</text><text x="1092" y="760" font-size="11.5" fill="#666">保存成功后关闭不再问。</text><text x="30" y="892" font-size="11" fill="#888">状态板 1600×900 · 线框，无真实路径 / 主机名 / 设备 id；占位路径只用于说明形状。</text>
</g>
</svg>
