<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="390" height="844" fill="#ffffff" rx="18"/><!-- 后面压暗的封面 --><rect width="390" height="200" fill="#e9e9ed"/>
<text x="20" y="26" font-size="11" fill="#8a8a90">9:41</text><text x="20" y="100" font-size="21" fill="#b9b9c0" font-weight="600">alpha</text><text x="20" y="126" font-size="11" fill="#b9b9c0">封面留在后面，滚动位置不动</text>
<!-- 底部 sheet --><rect x="0" y="152" width="390" height="692" rx="18" fill="#ffffff" stroke="#c4c4c4"/><rect x="171" y="164" width="48" height="5" rx="2.5" fill="#d4d4d8"/>
<text x="20" y="200" font-size="17" fill="#1a1a1a" font-weight="600">工作目录</text><text x="370" y="200" font-size="16" fill="#888" text-anchor="end">×</text><text x="20" y="222" font-size="11" fill="#6b6b6b">新对话默认落在第一个目录。</text>
<!-- 第 1 行（默认） --><rect x="16" y="238" width="358" height="76" rx="10" fill="#eef2ff" stroke="#c9d9ff"/><text x="30" y="264" font-size="12.5" fill="#1a1a1a" font-weight="600">/work/alpha</text>
<rect x="30" y="274" width="46" height="20" rx="10" fill="#eef2ff" stroke="#1f6feb"/><text x="53" y="288" font-size="10" fill="#1f6feb" text-anchor="middle">默认</text><rect x="278" y="258" width="82" height="44" rx="10" fill="#ffffff" stroke="#e3a6a0"/>
<text x="319" y="285" font-size="11.5" fill="#b42318" text-anchor="middle">移除</text><!-- 第 2 行 --><rect x="16" y="322" width="358" height="76" rx="10" fill="#ffffff" stroke="#e3e3e3"/>
<text x="30" y="348" font-size="12.5" fill="#1a1a1a" font-weight="600">/work/alpha-config</text><text x="30" y="368" font-size="10.5" fill="#777">部署配置</text><rect x="186" y="342" width="84" height="44" rx="10" fill="#ffffff" stroke="#1f6feb"/>
<text x="228" y="369" font-size="11" fill="#1f6feb" text-anchor="middle">设为默认</text><rect x="278" y="342" width="82" height="44" rx="10" fill="#ffffff" stroke="#e3a6a0"/><text x="319" y="369" font-size="11.5" fill="#b42318" text-anchor="middle">移除</text>
<!-- 第 3 行（长路径换行） --><rect x="16" y="406" width="358" height="90" rx="10" fill="#ffffff" stroke="#e3e3e3"/><text x="30" y="432" font-size="12.5" fill="#1a1a1a" font-weight="600">/work/shared-library-</text>
<text x="30" y="450" font-size="12.5" fill="#1a1a1a" font-weight="600">with-a-long-name</text><rect x="186" y="432" width="84" height="44" rx="10" fill="#ffffff" stroke="#1f6feb"/><text x="228" y="459" font-size="11" fill="#1f6feb" text-anchor="middle">设为默认</text>
<rect x="278" y="432" width="82" height="44" rx="10" fill="#ffffff" stroke="#e3a6a0"/><text x="319" y="459" font-size="11.5" fill="#b42318" text-anchor="middle">移除</text><!-- 添加目录 -->
<rect x="16" y="508" width="358" height="52" rx="10" fill="#fbfbfb" stroke="#bbbbbb" stroke-dasharray="5 4"/><text x="195" y="540" font-size="13" fill="#1f6feb" text-anchor="middle">＋ 添加目录</text><text x="20" y="588" font-size="11" fill="#6b6b6b">选择器与新建对话共用：机器 → 目录。</text>
<text x="20" y="608" font-size="11" fill="#6b6b6b">选到重复目录时就地说「这个目录已经在列表里」。</text><text x="20" y="632" font-size="11" fill="#6b6b6b">「设为默认」= 移到第一位；其余顺序不变。</text><text x="20" y="656" font-size="11" fill="#8a4c46">移除时行内说明：那个目录下的对话不再出现在</text>
<text x="20" y="676" font-size="11" fill="#8a4c46">这个项目下，仍在会话列表里，不删对话。</text><!-- 底部操作 --><line x1="0" y1="724" x2="390" y2="724" stroke="#e3e3e3"/>
<rect x="16" y="744" width="170" height="48" rx="12" fill="#ffffff" stroke="#bbbbbb"/><text x="101" y="774" font-size="13" fill="#444" text-anchor="middle">取消</text><rect x="204" y="744" width="170" height="48" rx="12" fill="#1f6feb"/>
<text x="289" y="774" font-size="13" fill="#ffffff" text-anchor="middle">保存</text><text x="195" y="818" font-size="10" fill="#888" text-anchor="middle">每个可点区域 ≥ 44px；保存按钮不被键盘遮住</text>
</g>
</svg>
