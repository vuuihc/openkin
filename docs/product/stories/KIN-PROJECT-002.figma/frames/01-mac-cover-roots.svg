<text x="374" y="572" font-size="11.5" fill="#888">概览其余部分：两周热力图与只读例行任务（KIN-PROJECT-001），本故事不改。</text><text x="374" y="600" font-size="11.5" fill="#888">工作目录块只读时：路径可读、可复制；编辑入口在块标题右端。</text><text x="374" y="628" font-size="11.5" fill="#888">路径过长时中间省略，聚焦或悬停可看全；不出现行内拖拽手柄。</text>
<text x="374" y="656" font-size="11.5" fill="#888">顺序 = 保存顺序；「默认」永远是列表第一项。</text>
