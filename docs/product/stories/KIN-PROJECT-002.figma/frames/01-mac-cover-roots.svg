<text x="374" y="166" font-size="11.5" fill="#6b6b6b">新对话默认落在第一个目录；这几个目录共同组成这个项目。</text><rect x="374" y="180" width="692" height="38" rx="7" fill="#eef2ff" stroke="#c9d9ff"/><text x="388" y="204" font-size="12.5" fill="#1f6feb" font-weight="600">1</text>
