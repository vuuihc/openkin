<line x1="260" y1="466" x2="1084" y2="466" stroke="#e3e3e3"/>
<text x="276" y="486" font-size="13" fill="#1a1a1a" font-weight="600">Claude Code</text>
<text x="276" y="502" font-size="10.5" fill="#8a8a92">这台机器的 Claude Code · 可列出会话</text>
<rect x="978" y="474" width="90" height="28" rx="7" fill="#ffffff" stroke="#c9c9cf"/>
<text x="1023" y="492" font-size="11.5" fill="#1a1a1a" text-anchor="middle">导入</text>
<line x1="260" y1="514" x2="1084" y2="514" stroke="#f0f0f2"/>
<text x="276" y="534" font-size="13" fill="#1a1a1a" font-weight="600">Codex</text>
<text x="276" y="550" font-size="10.5" fill="#8a8a92">这台机器的 Codex · 可列出会话</text>
<rect x="978" y="522" width="90" height="28" rx="7" fill="#ffffff" stroke="#c9c9cf"/>
<text x="1023" y="540" font-size="11.5" fill="#1a1a1a" text-anchor="middle">导入</text>
<text x="276" y="580" font-size="10" fill="#999">不改源历史 · 不自动重复 · 一次导入进行中时，页面与侧栏的其余导入按钮一起禁用</text>

<!-- group 3: roles -->
<rect x="260" y="608" width="824" height="132" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="282" cy="632" r="9" fill="#eef3ff"/>
<text x="282" y="636" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">3</text>
<text x="300" y="637" font-size="15" fill="#1a1a1a" font-weight="600">角色默认</text>
<text x="300" y="653" font-size="11.5" fill="#6b6b6b">保存后在新对话里用，不改变安装</text>
<rect x="958" y="616" width="110" height="32" rx="8" fill="#ffffff" stroke="#c9c9cf"/>
<text x="1013" y="637" font-size="12" fill="#1a1a1a" text-anchor="middle">添加角色</text>
<line x1="260" y1="668" x2="1084" y2="668" stroke="#e3e3e3"/>
<text x="276" y="690" font-size="13" fill="#1a1a1a" font-weight="600">安全审阅</text>
<text x="380" y="690" font-size="11.5" fill="#6b6b6b">以安全工程师的角度审阅这段改动，先列出攻击面…</text>
<text x="1010" y="690" font-size="10.5" fill="#1f6feb" text-anchor="end">编辑</text>
<text x="1052" y="690" font-size="10.5" fill="#b42318" text-anchor="end">删除</text>
<text x="276" y="716" font-size="10" fill="#999">同一 daemon 的设备共享；设置在 agent_roles</text>
<rect x="948" y="700" width="120" height="28" rx="7" fill="#ffffff" stroke="#c9c9cf"/>
<text x="1008" y="718" font-size="10.5" fill="#1a1a1a" text-anchor="middle">保存会话设置</text>
<text x="260" y="754" font-size="10" fill="#8a8a92">三组各自只做自己的事：探测不改目录，导入不改安装与角色，角色不探测也不导入。</text>
</g>
</svg>
