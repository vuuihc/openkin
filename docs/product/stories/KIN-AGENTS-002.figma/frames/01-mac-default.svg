<text x="820" y="379" font-size="10" fill="#999">上次检测</text>
<text x="956" y="368" font-size="10" fill="#8a8a92">没有导入按钮</text>
<text x="276" y="390" font-size="9.5" fill="#999">探测只读；行内导入按钮的无障碍名是「导入（provider 名）的会话」</text>

<!-- group 2: import -->
<rect x="260" y="406" width="824" height="190" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="282" cy="430" r="9" fill="#eef3ff"/>
<text x="282" y="434" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
<text x="300" y="435" font-size="15" fill="#1a1a1a" font-weight="600">导入会话</text>
<text x="300" y="451" font-size="11.5" fill="#6b6b6b">只在按下时发生，只写会话索引</text>
<rect x="948" y="414" width="120" height="32" rx="8" fill="#ffffff" stroke="#c9c9cf"/>
