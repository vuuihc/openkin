<text x="820" y="279" font-size="10" fill="#999">上次检测</text>
<line x1="260" y1="290" x2="1084" y2="290" stroke="#f0f0f2"/>

<circle cx="280" cy="310" r="4" fill="#d08a00"/>
<text x="292" y="314" font-size="13" fill="#1a1a1a" font-weight="600">Codex</text>
<text x="292" y="329" font-size="10.5" fill="#8a8a92">codex</text>
<text x="470" y="314" font-size="12" fill="#b26a00">需要登录</text>
<text x="470" y="329" font-size="10.5" fill="#8a8a92">0.9.4</text>
<rect x="600" y="302" width="52" height="18" rx="4" fill="#fff" stroke="#e3e3e3"/>
