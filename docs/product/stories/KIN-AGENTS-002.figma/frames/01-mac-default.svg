<line x1="260" y1="340" x2="1084" y2="340" stroke="#f0f0f2"/>

<circle cx="280" cy="360" r="4" fill="#9a9aa2"/>
<text x="292" y="364" font-size="13" fill="#1a1a1a" font-weight="600">Gemini CLI</text>
<text x="292" y="379" font-size="10.5" fill="#8a8a92">gemini-cli</text>
<text x="470" y="364" font-size="12" fill="#6b6b6b">未检测到</text>
<text x="470" y="379" font-size="10.5" fill="#8a8a92">未安装</text>
<rect x="600" y="352" width="104" height="18" rx="4" fill="#fff" stroke="#f0b27a"/>
<text x="652" y="365" font-size="10" fill="#b26a00" text-anchor="middle">可列出 · 不支持</text>
