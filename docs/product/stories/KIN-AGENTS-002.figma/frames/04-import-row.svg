<text x="604" y="393" font-size="10.5" fill="#6b6b6b">只在按下时发生，只写会话索引</text>
<rect x="580" y="404" width="488" height="30" rx="8" fill="#fff8ea" stroke="#f0d9a8"/>
<text x="592" y="423" font-size="10.5" fill="#8a5a00">离线 · 显示上次结果 14:02，不假装是新数据</text>
<text x="584" y="462" font-size="12.5" fill="#1a1a1a" font-weight="600">Claude Code</text>
<text x="584" y="478" font-size="10.5" fill="#8a8a92">这台机器的 Claude Code · 可列出会话</text>
<rect x="966" y="450" width="102" height="28" rx="7" fill="#f0f0f0"/>
<text x="1017" y="468" font-size="9.5" fill="#999" text-anchor="middle">离线，连上再导入</text>
<line x1="564" y1="494" x2="1084" y2="494" stroke="#f0f0f2"/>
<text x="584" y="520" font-size="12.5" fill="#1a1a1a" font-weight="600">安全审阅（角色）</text>
<text x="584" y="536" font-size="10.5" fill="#8a8a92">只读；编辑器仍能看到已保存的值</text>
<text x="584" y="572" font-size="10" fill="#999">三组都标离线：探测与导入禁用并写原因，角色只读（合同 :40、:117）。</text>
<text x="584" y="592" font-size="10" fill="#1f6feb">断线保留上次结果并标时间；不把整页变空。</text>

<!-- E: partial failure -->
<rect x="16" y="640" width="520" height="280" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="38" cy="664" r="9" fill="#eef3ff"/>
<text x="38" y="668" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
<text x="56" y="669" font-size="14" fill="#1a1a1a" font-weight="600">导入会话</text>
<text x="56" y="685" font-size="10.5" fill="#6b6b6b">只在按下时发生，只写会话索引</text>
<line x1="16" y1="700" x2="536" y2="700" stroke="#e3e3e3"/>
<rect x="32" y="712" width="488" height="56" rx="8" fill="#fff8ea" stroke="#f0d9a8"/>
<text x="44" y="730" font-size="11" fill="#8a5a00">已索引 12 个会话；2 项未同步</text>
<text x="44" y="746" font-size="9.5" fill="#8a6a30">Codex · 需要登录；Gemini CLI · 不支持列出会话</text>
<text x="504" y="736" font-size="10.5" fill="#1f6feb" text-anchor="end">重试</text>
<text x="36" y="794" font-size="10" fill="#999">部分失败点名来源与原因；已索引的会话保留。</text>
<text x="36" y="814" font-size="10" fill="#999">导入失败不删已有索引，也不清空列表（合同 :84、:152）。</text>
<text x="36" y="840" font-size="10" fill="#1f6feb">失败只说导入组；角色编辑器仍可用。</text>

