<text x="584" y="846" font-size="10" fill="#999">组底按钮禁用并写原因；不是把整组藏起来。</text>
<text x="584" y="866" font-size="10" fill="#1f6feb">角色组在同一个 tab 底部，照样能新增与保存（合同 :51）。</text>

<text x="16" y="952" font-size="10" fill="#8a8a92">状态来源：合同 KIN-AGENTS-002.md:51（能力缺失/无 provider）、:73（离线）、:83（导入中/部分失败）、:84（失败保留索引）、:151（其余按钮禁用）。</text>
</g>
