<rect x="438" y="424" width="82" height="28" rx="7" fill="#f0f0f0"/>
<text x="479" y="442" font-size="10.5" fill="#999" text-anchor="middle">导入中…</text>
<line x1="16" y1="466" x2="536" y2="466" stroke="#f0f0f2"/>
<text x="36" y="492" font-size="12.5" fill="#1a1a1a" font-weight="600">Codex</text>
<text x="36" y="508" font-size="10.5" fill="#8a8a92">等这次导入结束</text>
<rect x="438" y="480" width="82" height="28" rx="7" fill="#f0f0f0"/>
<text x="479" y="498" font-size="10.5" fill="#bbb" text-anchor="middle">导入</text>
<rect x="36" y="528" width="130" height="30" rx="8" fill="#f0f0f0"/>
<text x="101" y="547" font-size="10.5" fill="#999" text-anchor="middle">立即导入会话</text>
<text x="36" y="584" font-size="10" fill="#999">一次导入进行中时，页面与侧栏的其余导入按钮一起禁用。</text>
<text x="36" y="604" font-size="10" fill="#1f6feb">进行中的按钮禁用但保持焦点；完成后焦点回到触发按钮（合同 :85）。</text>

<!-- D: offline -->
<rect x="564" y="348" width="520" height="280" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="586" cy="372" r="9" fill="#eef3ff"/>
<text x="586" y="376" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
