<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="1100" height="980" fill="#ffffff" rx="16"/>
<rect width="1100" height="34" fill="#f6f6f8" rx="16"/>
<rect y="20" width="1100" height="14" fill="#f6f6f8"/>
<text x="16" y="22" font-size="11" fill="#555">状态板 · 导入会话组 · 1100×980</text>
<text x="1084" y="22" font-size="11" fill="#777" text-anchor="end">按钮出现 / 不存在 / 禁用，各有各的理由</text>

<!-- A: capability missing -->
<rect x="16" y="56" width="520" height="280" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="38" cy="80" r="9" fill="#eef3ff"/>
<text x="38" y="84" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
<text x="56" y="85" font-size="14" fill="#1a1a1a" font-weight="600">导入会话</text>
<text x="56" y="101" font-size="10.5" fill="#6b6b6b">只在按下时发生，只写会话索引</text>
<line x1="16" y1="116" x2="536" y2="116" stroke="#e3e3e3"/>
<text x="36" y="144" font-size="12.5" fill="#1a1a1a" font-weight="600">Gemini CLI</text>
<text x="36" y="160" font-size="10.5" fill="#8a8a92">这台机器的 Gemini CLI · 未检测到</text>
<rect x="36" y="170" width="104" height="18" rx="4" fill="#fff" stroke="#f0b27a"/>
<text x="88" y="183" font-size="10" fill="#b26a00" text-anchor="middle">可列出 · 不支持</text>
<text x="516" y="150" font-size="11" fill="#b42318" text-anchor="end">不支持列出会话</text>
<text x="516" y="166" font-size="9.5" fill="#8a8a92" text-anchor="end">原因：适配器未提供 session_list</text>
<text x="36" y="214" font-size="10" fill="#999">按钮不存在，而不是灰着不解释——灰按钮会被读成「等一下就能按」。</text>
<text x="36" y="234" font-size="10" fill="#999">这一行仍在状态组里，说明它为什么不能导入。</text>
<text x="36" y="260" font-size="10" fill="#1f6feb">合同 :51「能力不支持时该行没有导入按钮并写原因」</text>

<!-- B: importable -->
<rect x="564" y="56" width="520" height="280" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="586" cy="80" r="9" fill="#eef3ff"/>
<text x="586" y="84" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
<text x="604" y="85" font-size="14" fill="#1a1a1a" font-weight="600">导入会话</text>
<text x="604" y="101" font-size="10.5" fill="#6b6b6b">只在按下时发生，只写会话索引</text>
<line x1="564" y1="116" x2="1084" y2="116" stroke="#e3e3e3"/>
<text x="584" y="144" font-size="12.5" fill="#1a1a1a" font-weight="600">Claude Code</text>
<text x="584" y="160" font-size="10.5" fill="#8a8a92">这台机器的 Claude Code · 可列出会话</text>
<rect x="986" y="132" width="82" height="28" rx="7" fill="#ffffff" stroke="#c9c9cf"/>
<text x="1027" y="150" font-size="11" fill="#1a1a1a" text-anchor="middle">导入</text>
<text x="584" y="184" font-size="9.5" fill="#999">无障碍名：导入（Claude Code）的会话</text>
<line x1="564" y1="196" x2="1084" y2="196" stroke="#f0f0f2"/>
<rect x="584" y="208" width="130" height="30" rx="8" fill="#ffffff" stroke="#c9c9cf"/>
<text x="649" y="227" font-size="10.5" fill="#1a1a1a" text-anchor="middle">立即导入会话</text>
<text x="726" y="227" font-size="9.5" fill="#8a8a92">所有已配对机器，不只是本机</text>
<text x="584" y="258" font-size="10" fill="#999">行内「导入」只请求这一台机器的这个 provider。</text>
<text x="584" y="276" font-size="10" fill="#1f6feb">按下即确认，没有第二步对话框；Esc 不触发导入（合同 :74）。</text>

<!-- C: importing -->
<rect x="16" y="348" width="520" height="280" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
<circle cx="38" cy="372" r="9" fill="#eef3ff"/>
<text x="38" y="376" font-size="11" fill="#1f6feb" font-weight="600" text-anchor="middle">2</text>
