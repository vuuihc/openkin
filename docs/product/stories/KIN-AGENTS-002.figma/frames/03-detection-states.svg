<text x="36" y="330" font-size="10" fill="#999">按钮禁用但保留焦点；探测不发导入请求</text>
<text x="36" y="356" font-size="10" fill="#1f6feb">完成后：状态、原因、能力与「上次检测」一起更新</text>

