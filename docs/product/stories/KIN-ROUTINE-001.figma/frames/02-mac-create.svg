<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
<g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif">
<rect width="1100" height="760" fill="#ffffff" rx="10"/>
<rect width="1100" height="32" fill="#f0f0f0" rx="10"/>
<rect y="10" width="1100" height="22" fill="#f0f0f0"/>
<line x1="0" y1="32" x2="1100" y2="32" stroke="#dddddd"/>
<text x="12" y="21" font-size="12" fill="#555">Mac 1100×760 · 例行任务 · 新建 / 编辑（KIN-ROUTINE-001）</text>
<text x="1088" y="21" font-size="11" fill="#6b6b6b" text-anchor="end">表单就地展开，不跳页</text>

<rect x="0" y="32" width="72" height="728" fill="#fbfbfb"/>
<line x1="72" y1="32" x2="72" y2="760" stroke="#e3e3e3"/>
<text x="24" y="60" font-size="18" fill="#1a1a1a" font-weight="600">K</text>

<text x="100" y="72" font-size="20" fill="#1a1a1a" font-weight="600">例行任务</text>
<text x="100" y="94" font-size="12" fill="#6b6b6b">属于机器的调度；Hub 只负责转发</text>
<rect x="806" y="58" width="88" height="30" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="850" y="78" font-size="12" fill="#444" text-anchor="middle">取消</text>
<rect x="904" y="58" width="124" height="30" rx="8" fill="#1f6feb"/>
<text x="966" y="78" font-size="12" fill="#ffffff" text-anchor="middle">保存</text>

<text x="100" y="128" font-size="12" fill="#6b6b6b">机器</text>
<rect x="144" y="110" width="220" height="30" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="158" y="130" font-size="12" fill="#1a1a1a">另一台机器 ▾</text>
<text x="380" y="130" font-size="11.5" fill="#6b6b6b">目录、agent、模型都来自这台机器</text>

<rect x="100" y="158" width="928" height="542" rx="10" fill="#ffffff" stroke="#c4c4c4"/>
<text x="116" y="184" font-size="14" fill="#1a1a1a" font-weight="600">新建例行任务</text>

<text x="116" y="216" font-size="11.5" fill="#6b6b6b">标题</text>
<rect x="116" y="226" width="896" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="130" y="248" font-size="12.5" fill="#1a1a1a">每天整理笔记</text>

<text x="116" y="286" font-size="11.5" fill="#6b6b6b">提示词</text>
<rect x="116" y="296" width="896" height="96" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="130" y="320" font-size="12.5" fill="#555">把这周新增的笔记按主题整理，列出需要我确认的三条。</text>
<text x="130" y="342" font-size="11.5" fill="#999">每次到点都会用这段提示词开一段新对话；不覆盖上一轮的上下文。</text>

<text x="116" y="422" font-size="11.5" fill="#6b6b6b">调度</text>
<rect x="116" y="432" width="190" height="34" rx="8" fill="#eef2ff" stroke="#1f6feb"/>
<text x="211" y="454" font-size="12.5" fill="#1f6feb" text-anchor="middle">每天 ▾</text>
<rect x="318" y="432" width="120" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="378" y="454" font-size="12.5" fill="#1a1a1a" text-anchor="middle">09:00</text>
<text x="456" y="454" font-size="11.5" fill="#6b6b6b">本机时区 · 下一次：明天 09:00</text>
<text x="116" y="490" font-size="11.5" fill="#b42318">过去的时间、空规则会就地报错并挡住保存。</text>

<text x="116" y="528" font-size="11.5" fill="#6b6b6b">目录</text>
<rect x="116" y="538" width="420" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="130" y="560" font-size="12.5" fill="#1a1a1a">/work/alpha ▾</text>
<text x="548" y="560" font-size="11.5" fill="#6b6b6b">列出这台机器上的最近目录</text>

<text x="116" y="606" font-size="11.5" fill="#6b6b6b">agent · 模型 · 权限</text>
<rect x="116" y="616" width="290" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="130" y="638" font-size="12.5" fill="#1a1a1a">Claude Code ▾</text>
<rect x="418" y="616" width="290" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="432" y="638" font-size="12.5" fill="#1a1a1a">默认模型 ▾</text>
<rect x="720" y="616" width="290" height="34" rx="8" fill="#ffffff" stroke="#bbbbbb"/>
<text x="734" y="638" font-size="12.5" fill="#1a1a1a">只读 ▾</text>

<text x="116" y="680" font-size="11.5" fill="#6b6b6b">目录 / 模型加载失败：给重试，不清空已填；离线时表单只读并说明。</text>
<rect x="0.5" y="0.5" width="1099" height="759" fill="none" rx="10" stroke="#bbbbbb"/>
</g>
</svg>
