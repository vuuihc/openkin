<text x="374" y="632" font-size="11.5" fill="#555">对话 A · 2 小时前</text>
<text x="374" y="654" font-size="11" fill="#777">只放最近一段对话的入口。</text>
<rect x="374" y="672" width="96" height="24" rx="12" fill="#eef2ff" stroke="#1f6feb"/>
<text x="422" y="688" font-size="11" fill="#1f6feb" text-anchor="middle">新建对话</text>
<text x="374" y="718" font-size="10.5" fill="#999">顺序：摘要 → 工作方式 → 最近活动；页面不出现 tab。</text>
