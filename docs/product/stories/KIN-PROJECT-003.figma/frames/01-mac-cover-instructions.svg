<rect x="470" y="78" width="72" height="24" rx="12" fill="#eef2ff" stroke="#1f6feb"/><text x="506" y="94" font-size="11.5" fill="#1f6feb" text-anchor="middle">ship ▾</text>
<!-- 左栏：一句话摘要 -->
