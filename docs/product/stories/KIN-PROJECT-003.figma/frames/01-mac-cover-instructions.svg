<text x="374" y="144" font-size="14" fill="#1a1a1a" font-weight="600">一句话摘要</text>
<rect x="738" y="130" width="46" height="22" rx="11" fill="#ffffff" stroke="#bbbbbb"/><text x="761" y="145" font-size="10.5" fill="#444" text-anchor="middle">编辑</text>
<text x="374" y="168" font-size="12" fill="#555">这个项目是什么、现在做到哪（Current Focus）。</text>
