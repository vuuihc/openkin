<text x="374" y="212" font-size="11" fill="#999">North Star 不在这里显示；摘要是当前主线。</text>
<!-- 左栏：工作方式块 -->
<rect x="358" y="234" width="440" height="330" rx="10" fill="#ffffff" stroke="#1f6feb"/>
<text x="374" y="260" font-size="14" fill="#1a1a1a" font-weight="600">工作方式</text>
<rect x="682" y="240" width="100" height="40" rx="10" fill="#eef2ff" stroke="#1f6feb"/>
<text x="732" y="265" font-size="12" fill="#1f6feb" text-anchor="middle">让 Kin 改…</text>
<text x="374" y="300" font-size="11.5" fill="#6b6b6b">新对话开始时，Kin 会收到这段。</text>
<rect x="374" y="310" width="408" height="190" rx="8" fill="#fbfbfb" stroke="#e3e3e3"/>
<text x="388" y="334" font-size="12" fill="#1a1a1a">- 动手前先读 docs/ 与 CONTEXT.md。</text>
<text x="388" y="358" font-size="12" fill="#1a1a1a">- 跑 make test；不要手改 web/dist 里的生成文件。</text>
<text x="388" y="382" font-size="12" fill="#1a1a1a">- 新代码先写失败的测试，再让它变绿。</text>
<text x="388" y="406" font-size="12" fill="#1a1a1a">- 提交用 Conventional Commits；一个改动一个提交。</text>
<text x="388" y="430" font-size="12" fill="#1a1a1a">- 不确定时先问，不要猜产品决定。</text>
<text x="388" y="460" font-size="11" fill="#6b6b6b">（示意文案：这是用户写在这一节里的原文。）</text>
<text x="388" y="484" font-size="11" fill="#999">正文按段落显示，不折叠、不内嵌滚动。</text>
<text x="374" y="526" font-size="11.5" fill="#1f6feb">脚注：新对话会收到这段原文。</text>
<text x="374" y="550" font-size="10.5" fill="#888">只读：没有编辑框、没有保存按钮；右上角是唯一入口。</text>
<!-- 左栏：最近活动 -->
<rect x="358" y="580" width="440" height="150" rx="10" fill="#ffffff" stroke="#c4c4c4"/>
