<text x="834" y="404" font-size="11.5" fill="#555">只读并链到 /routines（KIN-ROUTINE-001）。</text>
<rect x="818" y="520" width="264" height="210" rx="10" fill="#fbfbfb" stroke="#e3e3e3" stroke-dasharray="4 4"/>
<text x="834" y="546" font-size="11" fill="#888">工作方式块属于 KIN-PROJECT-003：</text>
<text x="834" y="568" font-size="11" fill="#888">只读原文 + 对话式修改。</text>
<text x="834" y="594" font-size="11" fill="#888">不改：schema、endpoint、tab、路由、</text>
<text x="834" y="616" font-size="11" fill="#888">第二个编辑器。</text>
<text x="834" y="642" font-size="11" fill="#888">读屏：块是标题为「工作方式」的 region。</text>
<text x="834" y="668" font-size="11" fill="#888">Tab 顺序：摘要编辑 → 让 Kin 改 → 最近活动。</text>
<text x="834" y="694" font-size="11" fill="#888">截断、空、失败、离线见状态板。</text>
