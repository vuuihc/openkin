<text x="374" y="320" font-size="12" font-weight="600" fill="#1f6feb">How to work here:</text>
<text x="374" y="344" font-size="12" fill="#1a1a1a">- 动手前先读 docs/ 与 CONTEXT.md。</text>
<text x="374" y="366" font-size="12" fill="#1a1a1a">- 跑 make test；不要手改 web/dist 里的生成文件。</text>
<text x="374" y="388" font-size="12" fill="#1a1a1a">- 新代码先写失败的测试，再让它变绿。</text>
<text x="374" y="410" font-size="12" fill="#1a1a1a">- 提交用 Conventional Commits；一个改动一个提交。</text>
<text x="374" y="432" font-size="12" fill="#1a1a1a">- 不确定时先问，不要猜产品决定。</text>
<text x="374" y="456" font-size="11" fill="#999">（超过 400 字时到这里为止，并带省略号；与封面脚的截断说明一致。）</text>
