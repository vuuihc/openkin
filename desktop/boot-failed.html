<!doctype html>
<!--
  The desktop shell's failure surface, loaded by `MainWindow.showBootFailure()`
  after the recovery retry gives up.

  Deliberately still and self-contained: one state line and one action line,
  no motion (a terminal state must not look like progress), and no external
  URL, so the page paints even though the daemon never answered. The shell
  passes the sentences as query parameters (`failureCopy()` in
  `desktop/src/boot-failure.ts`, one of four fixed strings, never the raw
  handshake text); the zh-Hans fallback is written into the markup so a
  missing parameter can never leave a blank window. `scripts/build.mjs` copies
  it verbatim next to the bundled main process.

  Colours are the console's dark-scheme literals because this page has no
  stylesheet (TASTE 11): --kin-page, --kin-text, --kin-muted-rgb, --kin-hairline.
-->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Kin</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0e0e10;
        color: #f5f5f7;
      }
      .kin-failure {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        box-sizing: border-box;
        text-align: center;
        user-select: none;
        cursor: default;
      }
      .kin-failure-state {
        width: 100%;
        max-width: 30em;
        font: 500 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .kin-failure-action {
        width: 100%;
        max-width: 30em;
        color: rgb(152 152 157);
        font: 400 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .kin-failure-hairline {
        width: 32px;
        height: 1px;
        background: rgba(255, 255, 255, 0.14);
      }
    </style>
  </head>
  <body>
    <div class="kin-failure">
      <div class="kin-failure-hairline"></div>
      <p class="kin-failure-state" id="kin-failure-state">Kin 守护进程没有启动。</p>
      <p class="kin-failure-action" id="kin-failure-action">
        重启 Kin，或在菜单栏的 Kin 菜单里点 Start daemon。
      </p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var lang = params.get("lang");
        var state = params.get("state");
        var action = params.get("action");
        var stateEl = document.getElementById("kin-failure-state");
        var actionEl = document.getElementById("kin-failure-action");
        if (lang === "en" || lang === "zh-Hans") {
          document.documentElement.lang = lang;
        }
        if (state && stateEl) stateEl.textContent = state;
        if (action && actionEl) actionEl.textContent = action;
      })();
    </script>
  </body>
</html>
