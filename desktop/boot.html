<!doctype html>
<!--
  The desktop shell's boot surface, loaded by `MainWindow.showBoot()` before
  the daemon answers and replaced in place by the console.

  Deliberately wordless and self-contained: no text means no i18n debt and
  nothing stale to translate, and no external URL means the page paints even
  when the daemon is not up yet. `scripts/build.mjs` copies it verbatim next to
  the bundled main process.

  The wait is the iOS activity indicator the owner asked for on 2026-11-19
  (D13): twelve spokes ticking in `steps(12, end)`. The console's splash in
  `ui/index.html` draws the same wheel, so the handover to the console has
  nothing to flash.
-->
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    />
    <title>Kin</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0e0e10;
      }
      .kin-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: default;
      }
      /* The launch wheel: `IosSpinner.tsx` at size 32 — spokes 8% wide, 25%
         tall, their centres 32% of the size out from the middle. The tick is
         twelve discrete steps; a smooth sweep loses the iOS read. */
      .kin-ios-spinner {
        position: relative;
        width: 32px;
        height: 32px;
        animation: kin-ios-spin 1s steps(12, end) infinite;
      }
      .kin-ios-spoke {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.56px;
        height: 8px;
        border-radius: 9999px;
        /* --kin-muted-rgb in `ui/src/design/theme.css`; no token layer here. */
        background: rgb(152 152 157);
      }
      @keyframes kin-ios-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Still, but present: the wheel is what says "waiting", not its motion. */
        .kin-ios-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="kin-boot" aria-hidden="true">
      <div class="kin-ios-spinner">
        <span
          class="kin-ios-spoke"
          style="opacity: 1; transform: translate(-50%, -50%) rotate(0deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.9227; transform: translate(-50%, -50%) rotate(30deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.8455; transform: translate(-50%, -50%) rotate(60deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.7682; transform: translate(-50%, -50%) rotate(90deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.6909; transform: translate(-50%, -50%) rotate(120deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.6136; transform: translate(-50%, -50%) rotate(150deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.5364; transform: translate(-50%, -50%) rotate(180deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.4591; transform: translate(-50%, -50%) rotate(210deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.3818; transform: translate(-50%, -50%) rotate(240deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.3045; transform: translate(-50%, -50%) rotate(270deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.2273; transform: translate(-50%, -50%) rotate(300deg) translateY(-10.24px)"
        ></span>
        <span
          class="kin-ios-spoke"
          style="opacity: 0.15; transform: translate(-50%, -50%) rotate(330deg) translateY(-10.24px)"
        ></span>
      </div>
    </div>
  </body>
</html>
