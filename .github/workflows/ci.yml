name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # tsnet (M3) requires Go ≥ 1.23.1
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install + typecheck + unit tests + build
        working-directory: ui
        run: |
          npm install
          npm run check:api
          npx tsc --noEmit
          npm test
          npx vite build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Stream observability guard (execplan continuous guard)
        if: ${{ vars.KIN_STREAM_HEALTH_DB != '' }}
        env:
          KIN_DB: ${{ vars.KIN_STREAM_HEALTH_DB }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sqlite3
          ./scripts/stream-health-check.sh
