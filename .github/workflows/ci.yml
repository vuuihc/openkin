name: ci

on:
  push:
    # `branches` alone would silently drop tag refs, which ran this workflow
    # before the push filter existed. `release.yml` builds `v*` tags, and they
    # keep the same CI gate here.
    branches: [main]
    tags: ["v*"]
  pull_request:

# One in-flight run per ref. A newer push (or a synchronize on the PR) cancels
# the superseded run so it does not finish red and email again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A markdown-only diff outside ui/, web/ and mobile-rn/ cannot break a
  # compile or a boot, and it can only break a test when a suite names the
  # file — so the *.md arm below keeps a doc as code when a test CI runs
  # mentions its path or basename. That mirrors the local merge gate's docs
  # scope (scripts/check.sh's job_doc_refs greps ui test files, *_test.go and
  # *_test.py for the same two strings and fails closed on a hit) without a
  # static list that would rot as suites move. AGENTS.md/CLAUDE.md stay code
  # unconditionally because their own rules pin test contents. Skipping build,
  # smoke and desktop for a docs-only diff turns ~7 min of CI into seconds;
  # their SKIPPED conclusions read as green to merge.sh's ci()
  # (rsi/runtime/merge.sh treats SKIPPED like SUCCESS). The classifier fails
  # safe: an unusable base, an unreadable diff or an empty list means code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      rn: ${{ steps.classify.outputs.rn }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two answers, mirroring rsi/runtime/gate.sh's scopes:
      #   code — Go/UI/desktop/journeys can be affected: run build, smoke,
      #          desktop and journeys.
      #   rn   — mobile-rn can be affected (its own files, or ui/src, which it
      #          imports through ../../../ui/src and @ui/*): run mobile-rn.
      # rsi/** is the loop's own code; nothing CI runs reads it unless a test
      # names the path, and the local merge gate's shell-test owns it. Markdown
      # is the same unless a test names it. Fails safe: an unusable base, an
      # unreadable diff or an empty list means code=true and rn=true.
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true; rn=true
          base="$BASE_SHA"
          # named_by_test <path>: a test CI runs names the path or its
          # basename (ui vitest, Go, Python suites).
          named_by_test() {
            local b="${1##*/}"
            grep -rlF --include='*.test.*' --exclude-dir=node_modules \
                 -e "$1" -e "$b" ui >/dev/null 2>&1 ||
            grep -rlF --include='*_test.go' --include='*_test.py' \
                 --include='*.test.py' --exclude-dir=.git \
                 --exclude-dir=node_modules -e "$1" -e "$b" . >/dev/null 2>&1
          }
          # named_by_rn_test <path>: a mobile-rn jest suite names it.
          named_by_rn_test() {
            grep -rlF --include='*.test.*' --exclude-dir=node_modules \
                 -e "$1" -e "${1##*/}" mobile-rn >/dev/null 2>&1
          }
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            # --no-renames keeps the old path in the list: a rename out of a
            # non-markdown file (git mv tool.sh docs/tool.md) is still code.
            files="$(git diff --no-renames --name-only "$base"...HEAD 2>/dev/null)" || files=""
            if [ -n "$files" ]; then
              code=false; rn=false
              while IFS= read -r p; do
                [ -z "$p" ] && continue
                case "$p" in
                  mobile-rn/*.md) named_by_rn_test "$p" && rn=true ;;
                  mobile-rn/*) rn=true ;;
                  ui/*) code=true; rn=true ;;
                  web/*|AGENTS.md|*/AGENTS.md|CLAUDE.md|*/CLAUDE.md) code=true ;;
                  rsi/*|*.md) named_by_test "$p" && code=true ;;
                  *) code=true ;;
                esac
              done <<<"$files"
            fi
          fi
          echo "classified ${base:-none} as code=$code rn=$rn"
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "rn=$rn" >>"$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files format check diffs against the PR's base SHA.
          # The default shallow checkout does not contain that commit (or
          # HEAD^), so the check would silently skip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # internal/workspace's tests create throwaway repositories and assert the
      # integration branch is "main". A runner's `git init` defaults to
      # "master", so every one of them failed here while passing on a developer
      # machine whose global config says main.
      - name: Default new repositories to main
        run: git config --global init.defaultBranch main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install + format + typecheck + unit tests + build
        working-directory: ui
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm ci
          # The tree predates this check: a repo-wide `prettier --check` fails
          # on 55 files, and because it ran first, lint/tsc/tests never ran.
          # Check only the files this change touches, so new code stays
          # formatted without a repo-wide reformat that would collide with
          # every open worktree.
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping the changed-files format check"
          else
            mapfile -t changed < <(git diff --relative --name-only --diff-filter=ACMR "$base"...HEAD -- .)
            if [ ${#changed[@]} -eq 0 ]; then
              echo "no changed UI files"
            else
              printf 'checking %d changed UI file(s)\n' "${#changed[@]}"
              npx prettier --check --ignore-unknown "${changed[@]}"
            fi
          fi
          npm run lint
          npm run check:api
          npx tsc --noEmit
          npm test
          npx vite build

      # The inventory baseline is checked in, so CI enforces the same ratchet as
      # `scripts/check.sh`. Tests first: a guard whose negative cases never run
      # is a guard nobody has seen fail.
      - name: UI inventory ratchet
        run: |
          python3 -B scripts/check-ui-inventory.test.py
          python3 -B scripts/check-ui-inventory.py

      # The added-file bans are off in the tree-wide lint. This base block is
      # separate from the format step's `BASE_SHA`: PRs use their base, default
      # pushes their previous tip, feature pushes nothing (cumulative).
      - name: Added-file UI lint guard
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export UI_LINT_BASE="$(
            # BEGIN ui-lint-base
            if [ -n "$PR_BASE_SHA" ]; then
              printf '%s' "$PR_BASE_SHA"
            elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
              printf '%s' "$EVENT_BEFORE"
            fi
            # END ui-lint-base
          )"
          python3 -B -m unittest scripts/ui_lint_guard_test.py
          ./scripts/ui-lint-guard.sh

      # The smoke job boots the real binary against this build. It is uploaded
      # rather than rebuilt there so the console the daemon serves in the smoke
      # test is the same one this job's typecheck, tests and budget measured.
      - name: Upload the built console
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      # The build above is what this measures. It reads the files index.html
      # names — the entry chunk and the stylesheet — rather than the source, so
      # a dependency that quietly joins the first screen is a number here and
      # not a surprise on a phone.
      - name: Console first-screen budget
        run: ./scripts/check-bundle-budget.sh

      - name: Relay test + syntax check
        working-directory: relay
        run: |
          npm test
          npm run build

      - name: Go vet
        run: go vet ./...

      # _devhub's leading underscore is what keeps it out of ./... , so vet and
      # test above never see it. It still has to compile: it is the fixture the
      # Hub's browser flows are checked against, and a package that only breaks
      # when somebody tries to use it is worse than no fixture.
      - name: Go build (dev hub fixture)
        run: go build -o /dev/null ./_devhub

      - name: Go test
        run: go test ./...

      - name: Stream observability guard (execplan continuous guard)
        if: ${{ vars.KIN_STREAM_HEALTH_DB != '' }}
        env:
          KIN_DB: ${{ vars.KIN_STREAM_HEALTH_DB }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sqlite3
          ./scripts/stream-health-check.sh

  # The build job proves the packages compile and their tests pass. This job
  # proves the product starts: it boots cmd/kin against a throwaway state
  # directory, waits for /api/health, serves the console built above, reads and
  # writes through the authenticated API, and restarts on the same database.
  # Nothing else in CI executes the real binary, so a bad flag, a broken embed,
  # or a migration that only fails on a real database used to reach a user.
  smoke:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.code == 'true'
    # The script bounds every request and every wait; this is the backstop for
    # the one thing it cannot bound — a hung process the shell itself is stuck
    # waiting on. GitHub's default is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Boot the daemon
        env:
          KIN_SMOKE_REQUIRE_ASSETS: "1"
        run: ./scripts/smoke.sh

  # The floor for the desktop shell, not a test suite: nothing in CI compiled
  # these ~2,800 lines, so a change that only broke the Electron main process
  # was found by launching it. `--ignore-scripts` skips electron-builder's
  # postinstall, which downloads an Electron binary that neither `tsc` nor
  # esbuild reads; the package's own type definitions are what typecheck needs.
  desktop:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop shell typecheck + tests + bundle
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

  # The journey harness is what keeps every walk screenshot and every
  # `--walk-once` red proof honest: scripts/journeys_seed.py creates the
  # lived-in state, and scripts/journeys_fake_agent/claude is what stops a walk
  # from launching a real model CLI. Their suites are hermetic (a local
  # http.server stub and real shell scripts), but they cost ~49 s + ~17 s —
  # running them in scripts/check.sh would grow the local gate's p50 by ~25 %
  # on every change, so they run here instead. rsi/runtime/tests/test-wiring.sh
  # carries the other half of the bargain: allow_unwired_py() requires both
  # paths to be named in this file, so deleting this job turns that test red
  # instead of silently retiring the two suites.
  journeys:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Backstop only: the suites bound their own waits and sleeps.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # -B: the seed test imports the seed module, and CI should not leave
      # __pycache__ in the tree it just checked out.
      - name: Journey seed + fake-agent suites
        run: |
          python3 -B scripts/journeys_seed_test.py
          python3 -B scripts/journeys_fake_agent_test.py

  # ADR 0036 §4's light gate in a clean checkout: the local merge gate runs it
  # on a warm machine, and before this job no CI step compiled mobile-rn at all
  # while RN-only PRs paid for the Go/UI build.
  mobile-rn:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rn == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # mobile-rn imports ui/src (../../../ui/src, @ui/*), so its tsc read the
      # console's types; without ui/node_modules the fresh-clone tsc fails on
      # 'zustand' and implicit-any before a single mobile-rn file is checked.
      # --ignore-scripts: the console's compile does not run here, so the
      # postinstall steps the build job needs are not this job's cost.
      - name: UI install (types only, for mobile-rn's ui/src imports)
        working-directory: ui
        run: npm ci --ignore-scripts

      - name: Typecheck + jest
        working-directory: mobile-rn
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx tsc --noEmit
          npx jest --ci
