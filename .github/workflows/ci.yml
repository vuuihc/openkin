name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-files format check diffs against the PR's base SHA.
          # The default shallow checkout does not contain that commit (or
          # HEAD^), so the check would silently skip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # internal/workspace's tests create throwaway repositories and assert the
      # integration branch is "main". A runner's `git init` defaults to
      # "master", so every one of them failed here while passing on a developer
      # machine whose global config says main.
      - name: Default new repositories to main
        run: git config --global init.defaultBranch main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install + format + typecheck + unit tests + build
        working-directory: ui
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm ci
          # The tree predates this check: a repo-wide `prettier --check` fails
          # on 55 files, and because it ran first, lint/tsc/tests never ran.
          # Check only the files this change touches, so new code stays
          # formatted without a repo-wide reformat that would collide with
          # every open worktree.
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "no base commit; skipping the changed-files format check"
          else
            mapfile -t changed < <(git diff --relative --name-only --diff-filter=ACMR "$base"...HEAD -- .)
            if [ ${#changed[@]} -eq 0 ]; then
              echo "no changed UI files"
            else
              printf 'checking %d changed UI file(s)\n' "${#changed[@]}"
              npx prettier --check --ignore-unknown "${changed[@]}"
            fi
          fi
          npm run lint
          npm run check:api
          npx tsc --noEmit
          npm test
          npx vite build

      # The smoke job boots the real binary against this build. It is uploaded
      # rather than rebuilt there so the console the daemon serves in the smoke
      # test is the same one this job's typecheck, tests and budget measured.
      - name: Upload the built console
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      # The build above is what this measures. It reads the files index.html
      # names — the entry chunk and the stylesheet — rather than the source, so
      # a dependency that quietly joins the first screen is a number here and
      # not a surprise on a phone.
      - name: Console first-screen budget
        run: ./scripts/check-bundle-budget.sh

      - name: Relay test + syntax check
        working-directory: relay
        run: |
          npm test
          npm run build

      - name: Go vet
        run: go vet ./...

      # _devhub's leading underscore is what keeps it out of ./... , so vet and
      # test above never see it. It still has to compile: it is the fixture the
      # Hub's browser flows are checked against, and a package that only breaks
      # when somebody tries to use it is worse than no fixture.
      - name: Go build (dev hub fixture)
        run: go build -o /dev/null ./_devhub

      - name: Go test
        run: go test ./...

      - name: Stream observability guard (execplan continuous guard)
        if: ${{ vars.KIN_STREAM_HEALTH_DB != '' }}
        env:
          KIN_DB: ${{ vars.KIN_STREAM_HEALTH_DB }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y sqlite3
          ./scripts/stream-health-check.sh

  # The build job proves the packages compile and their tests pass. This job
  # proves the product starts: it boots cmd/kin against a throwaway state
  # directory, waits for /api/health, serves the console built above, reads and
  # writes through the authenticated API, and restarts on the same database.
  # Nothing else in CI executes the real binary, so a bad flag, a broken embed,
  # or a migration that only fails on a real database used to reach a user.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    # The script bounds every request and every wait; this is the backstop for
    # the one thing it cannot bound — a hung process the shell itself is stuck
    # waiting on. GitHub's default is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Boot the daemon
        env:
          KIN_SMOKE_REQUIRE_ASSETS: "1"
        run: ./scripts/smoke.sh

  # The floor for the desktop shell, not a test suite: nothing in CI compiled
  # these ~2,800 lines, so a change that only broke the Electron main process
  # was found by launching it. `--ignore-scripts` skips electron-builder's
  # postinstall, which downloads an Electron binary that neither `tsc` nor
  # esbuild reads; the package's own type definitions are what typecheck needs.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop shell typecheck + tests + bundle
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build
