        - $ref: "#/components/schemas/UserQuestionUpdateMessage"
    PullRequestObservation:
      type: object
      additionalProperties: false
      description: >-
        One cached reading of a (repository, branch) pair on GitHub. Everything
        below observed_at was true when it was read and may be false now;
        everything from attempted_at describes the most recent query, which may
        be newer than the answer above it.
      required:
        - repo
        - head_branch
        - task_id
        - attempted_at
      properties:
        repo:
          type: string
          description: Canonical github.com/owner/name, lowercased.
        head_branch:
          type: string
        task_id:
          type: string
        number:
          type: integer
          description: >-
            Absent when a successful query found no pull request for the
            branch. Also absent when no query has ever succeeded, which
            observed_at distinguishes.
        url:
          type: string
        title:
          type: string
        state:
          type: string
          enum: [open, closed, merged]
        is_draft:
          type: boolean
        base_branch:
          type: string
        head_oid:
          type: string
          description: >-
            The head commit the remote reported. Differing from the local HEAD
            means the pull request is behind the workspace.
        ci_state:
          type: string
          enum: [none, pending, success, failure]
        ci_summary:
          type: string
          description: JSON string of check counts and failing check names.
        source:
          type: string
          enum: [gh, anonymous]
          description: >-
            Which reader answered. An anonymous read cannot see private
            repositories, so the two are not interchangeable.
        comments_seen:
          type: integer
          description: Highest comment id already handed to the session.
        observed_at:
          type: integer
          description: Unix milliseconds of the last successful query.
        attempted_at:
          type: integer
          description: Unix milliseconds of the last query, successful or not.
        last_error:
          type: string
          description: Why the last query failed. Empty exactly when it succeeded.
    GHStatus:
      type: object
      additionalProperties: false
      required: [available]
      description: >-
        Whether the GitHub CLI is usable, so the console can explain an
        anonymous read instead of silently degrading.
      properties:
        available:
          type: boolean
        detail:
          type: string
    TaskPullRequestSnapshot:
      type: object
      additionalProperties: false
      required: [gh]
      properties:
        observations:
          type: array
          description: One entry per workspace generation branch, newest first.
          items:
            $ref: "#/components/schemas/PullRequestObservation"
        repo:
          type: string
        branch:
          type: string
        gh:
          $ref: "#/components/schemas/GHStatus"
        notice:
          type: string
          description: One sentence explaining a degraded read, or empty.
    PublishReport:
      type: object
      additionalProperties: false
      required: [task_id]
      description: >-
        What one publish did. Every field below the task is what the machine
        said, including when it said no: blocked names why nothing was pushed,
        in the machine's vocabulary, and the console acts on default_branch —
        the one refusal with a way out — while reading the rest as reason.
      properties:
        task_id:
          type: string
        repo:
          type: string
          description: Canonical github.com/owner/name, as the machine's checkout reports it.
        branch:
          type: string
        pushed:
          type: boolean
          description: >-
            The branch is on the remote. Can be true with no pull request: a
            push that landed and a gh that then failed is exactly that.
        number:
          type: integer
        url:
          type: string
        blocked:
          type: string
          enum:
            - not_a_checkout
            - no_github_remote
            - detached_head
            - default_branch
            - uncommitted_changes
            - no_gh
        reason:
          type: string
          description: The machine's own sentence, shown to the person as it stands.
    SessionShareState:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
        created_at:
          type: integer
          description: Unix milliseconds the live link was minted. Absent when none is.
        expires_at:
          type: integer
          description: Unix milliseconds it stops working; 0 or absent means until revoked.
    SessionShareCreated:
      type: object
      required: [token, created_at]
      properties:
        token:
          type: string
          description: >-
            The link's secret. Returned exactly once, at creation; the daemon
            keeps only its digest.
        created_at:
          type: integer
        expires_at:
          type: integer
    PublicShareView:
      type: object
      required: [title, messages]
      properties:
        title:
          type: string
        agent:
          type: string
        status:
          type: string
        created_at:
          type: integer
        truncated:
          type: boolean
          description: >-
            The conversation is longer than the share carries; only the most
            recent messages are present.
        messages:
          type: array
          items:
            type: object
            required: [role, text]
            properties:
              role:
                type: string
                enum: [user, assistant]
              text:
                type: string
              speaker:
                type: string
                description: >-
                  Who answered, when it was not the task's own agent — a worker
                  in a team session. Absent means the agent named at the top.
              ts:
                type: integer
