          type: string
        exit_code:
          type:
            - integer
            - "null"
        tokens_in:
          type: integer
        tokens_out:
          type: integer
        cost_usd:
          type:
            - number
            - "null"
        created_at:
          type: integer
        started_at:
          type:
            - integer
            - "null"
        finished_at:
          type:
            - integer
            - "null"
        project_id:
          type:
            - string
            - "null"
        workspace_mode:
          type:
            - string
            - "null"
        workspace_source_root:
          type:
            - string
            - "null"
        workspace_root:
          type:
            - string
            - "null"
        execution_cwd:
          type:
            - string
            - "null"
        workspace_scope:
          type:
            - string
            - "null"
        workspace_base_oid:
          type:
            - string
            - "null"
        workspace_branch:
          type:
            - string
            - "null"
          description: >-
            For a task with a workspace lifecycle, the branch its current
            generation runs on. For a session that runs on another machine, the
            branch that machine reported for its checkout — the same column,
            because both answer "which branch is this session's work on".
        workspace_repo:
          type:
            - string
            - "null"
          description: >-
            The repository a session that runs on another machine was recorded
            on, canonical (host/owner/name, no transport, no credentials), as
            that machine reported it when the session started. Empty for a task
            that runs here, whose repository is derived from its workspace
            generation when a pull request is looked up.
        workspace_policy:
          type:
            - string
            - "null"
        current_workspace_id:
          type:
            - string
            - "null"
        executing_device_id:
          type: string
          description: >-
            The device that runs every turn of this task. Empty means the daemon
            that stores it; a device id means the turn is dispatched to that
            machine, which executes it with its own agents and its own filesystem.
        event_epoch:
          type: integer
        hub_seq:
          type:
            - integer
            - "null"
          description: Position in the global change feed; null only for rows written before the cursor existed.
        routine_id:
          type: string
        routine_noteworthy:
          type: boolean
        routine_tldr:
          type: string
        routine_unread:
          type: boolean
        archived_at:
          type: integer
          description: >-
            When this conversation was put away, in epoch milliseconds. Absent
            or 0 means it is in the list. Archiving is per conversation: it
            hides this row and leaves every other chat in the same project
            alone.
        dispatch: {}
    TaskLimitWait:
