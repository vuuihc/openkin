        The Hub's account state, served unauthenticated. A standalone daemon
        has no account system and answers with an empty `providers` list; a
        client then keeps using its device token. Never includes an email, a
        user id, or whether a claim code exists beyond `claimable`.
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/auth/bootstrap:
    post:
      operationId: bootstrapAccount
      security: []
      description: |
        Claim the Hub's owner account with the one-time bootstrap code. Sets the
        `kin_session` cookie on success. Rate limited; a refusal is reported
        through the same indistinguishable error shape.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEnrollRequest"
      responses:
        "200":
          description: Owner account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly `kin_session` cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid or expired code, or an unusable email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Accounts are not enabled on this daemon
        "429":
          description: Too many attempts from this client
  /api/auth/join:
    post:
      operationId: joinAccount
      security: []
      description: |
        Create a member account from an invitation code. The role is decided by
        the route, never by the request body. Sets the `kin_session` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEnrollRequest"
      responses:
        "200":
          description: Member account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          description: Invalid or expired invitation, or an unusable email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Accounts are not enabled on this daemon
        "429":
          description: Too many attempts from this client
  /api/auth/login:
    post:
      operationId: loginAccount
      security: []
      description: Sign in with email and password. Sets the `kin_session` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
        "404":
          description: Accounts are not enabled on this daemon
        "429":
          description: Too many attempts from this client
  /api/auth/logout:
    post:
      operationId: logoutAccount
      security: []
      description: |
        End the session named by the `kin_session` cookie and clear it. Answers
        success even when no session was presented, so a client can always
        finish signing out.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
  /api/auth/me:
    get:
      operationId: getAuthMe
      security:
        - sessionCookie: []
      description: The account behind the `kin_session` cookie.
      responses:
        "200":
          description: Signed-in account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401":
          description: No valid session cookie
  /api/auth/oidc/start:
    get:
      operationId: startOIDCSignIn
      security: []
      description: |
        Begin an OIDC sign-in by redirecting to the identity provider. When the
        caller already has a valid session cookie, the flow links the provider
        identity to that account instead of signing in.
      parameters:
        - in: query
          name: return_to
          required: false
          schema:
            type: string
          description: Same-origin path to return to after the callback.
      responses:
        "302":
          description: Redirect to the identity provider
        "404":
          description: No identity provider is configured
  /api/auth/oidc/callback:
    get:
      operationId: completeOIDCSignIn
      security: []
      description: |
        Complete an OIDC sign-in or link. Always redirects into the console: on
        success with `auth_notice` (`signed-in` or `linked`), on failure with
        `auth_error` and `auth_error_code` query parameters.
      parameters:
        - in: query
          name: code
          required: false
          schema:
            type: string
        - in: query
          name: state
          required: false
          schema:
            type: string
        - in: query
          name: error
          required: false
          schema:
            type: string
          description: Provider-supplied error, passed through to the console.
      responses:
        "302":
          description: Redirect back into the console
        "404":
          description: No identity provider is configured
  /api/agents:
    get:
      operationId: listAgents
      description: |
        Agent runtimes this machine can start. A caller that does not act for
        the holder receives the catalogue with `binary` blanked.
      responses:
        "200":
          description: Agent catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentInfo"
  /api/agents/management:
    get:
      operationId: listAgentManagement
      description: Install, version, and sign-in metadata for known agents, cached. Holder only.
      parameters:
        - in: query
          name: refresh
          required: false
          schema:
            type: string
            enum: ["1"]
          description: Bypass the cache and probe again.
      responses:
        "200":
          description: Per-agent management metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentManagementInfo"
  /api/agents/smoke:
    post:
      operationId: smokeAgents
      description: |
        Run a headless smoke turn against installed generic CLI agents. Operator
        only. Answers 503 when smoke probing is not wired on this daemon.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSmokeRequest"
      responses:
        "200":
          description: One result per probed agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSmokeResponse"
        "503":
          description: Smoke probing is unavailable
  /api/artifacts:
    get:
      operationId: listArtifacts
      description: Artifacts, newest first. Holder only.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [proposed, saved, archived]
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Artifacts, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
    post:
      operationId: createArtifact
      description: |
        Store an artifact body on disk and its metadata in the database. The
        on-disk path is server-generated; a client never supplies one. Operator
        only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactCreateRequest"
      responses:
        "201":
          description: Created artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Invalid kind or invalid JSON
        "413":
          description: Artifact content exceeds the server's size limit
        "503":
          description: Artifacts are not configured
  /api/artifacts/{id}:
    get:
      operationId: getArtifact
      description: Artifact metadata. Holder only.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "404":
          description: Not found
  /api/artifacts/{id}/content:
    get:
      operationId: getArtifactContent
      description: |
        The artifact body as `text/plain; charset=utf-8`. Stored HTML is never
        served as `text/html`; the console sandboxes it for display. Holder only.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact body
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Artifact or its file is missing
        "503":
          description: Artifacts are not configured
  /api/artifacts/{id}/status:
    post:
      operationId: setArtifactStatus
      description: Move an artifact between proposed, saved, and archived. Operator only.
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactStatusRequest"
      responses:
        "200":
          description: Updated artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "400":
          description: Invalid status
        "404":
          description: Not found
  /api/git/branches:
    get:
      operationId: listGitBranches
      description: |
        Local branches for one working directory. `device` names the machine
        the directory is on: omitted, empty, or `self` is this daemon; anything
        else is forwarded to that machine. A non-git directory answers
        `is_git: false` with a reason rather than an error. Holder only.
      parameters:
        - in: query
          name: cwd
          required: true
          schema:
            type: string
        - in: query
          name: device
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Branch listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitBranchStatus"
        "400":
          description: Missing cwd, or the directory was refused
        "409":
          description: The named machine is offline
        "500":
          description: The machine answered in a shape this Hub could not read
        "501":
          description: The machine's build does not understand this question
        "503":
          description: This Hub cannot ask machines questions, or the local workspace is unavailable
        "504":
          description: The named machine did not answer in time
  /api/git/checkout:
    post:
      operationId: checkoutGitBranch
      description: |
        Check out a branch in a working directory. `device` selects the machine
        whose checkout moves. Holder only on the route; moving a checkout on
        this daemon itself is operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitCheckoutRequest"
      responses:
        "200":
          description: The directory and its current branch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitCheckoutResponse"
        "400":
          description: Invalid request, or the machine refused the question
        "403":
          description: Moving a checkout on this daemon requires the operator
        "409":
          description: The named machine is offline, or the local checkout has uncommitted changes
        "500":
          description: The machine answered in a shape this Hub could not read
        "501":
          description: The machine's build does not understand this question
        "503":
          description: This Hub cannot ask machines questions, or the local workspace or git is unavailable
        "504":
          description: The named machine did not answer in time
  /api/machines:
    get:
      operationId: listMachines
      description: |
        Machines work can be sent to. Revoked machines and devices that never
        dialled in as a node are omitted rather than reported. A subset of the
        operator-only device list: what a picker needs and no more. Holder only.
      responses:
        "200":
          description: Machines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Machine"
  /api/machines/{device}/dirs:
    get:
      operationId: listMachineDirs
      description: |
        Directories inside one path on one machine. `{device}` is a machine id,
        the literal `self`, or a paired device. Holder only.
      parameters:
        - $ref: "#/components/parameters/DeviceRef"
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: Absolute path on that machine. Empty asks for its roots.
      responses:
        "200":
          description: One directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineDirs"
        "400":
          description: Invalid path, or the machine refused the question
        "409":
          description: The machine is offline
        "500":
          description: The machine answered in a shape this Hub could not read
        "501":
          description: The machine's build does not understand this question
        "503":
          description: This Hub cannot ask machines questions
        "504":
          description: The machine did not answer in time
  /api/machines/{device}/repo/branches:
    get:
      operationId: listMachineRepoBranches
      description: |
        Branches one repository has on one machine, without cloning it here.
        The answer names the clone URL the machine understood, which is what
        `repo/prepare` must be asked for next.
      parameters:
        - $ref: "#/components/parameters/DeviceRef"
        - in: query
          name: repo
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRepoBranches"
        "400":
          description: Invalid repository, or the machine refused the question
        "409":
          description: The machine is offline
        "500":
          description: The machine answered in a shape this Hub could not read
        "501":
          description: The machine's build does not understand this question
        "503":
          description: This Hub cannot ask machines questions
        "504":
          description: The machine did not answer in time
  /api/machines/{device}/repo/prepare:
    post:
      operationId: prepareMachineRepo
      description: |
        Make one repository available on one machine and answer where it now
        is. The destination is chosen by the machine inside its own roots; the
        request carries no path.
      parameters:
        - $ref: "#/components/parameters/DeviceRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineRepoPrepareRequest"
      responses:
        "200":
          description: Where the repository is on that machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineRepoPrepareResult"
        "400":
          description: Invalid repository, or the machine refused the question
        "409":
          description: The machine is offline
        "500":
          description: The machine answered in a shape this Hub could not read
        "501":
          description: The machine's build does not understand this question
        "503":
          description: This Hub cannot ask machines questions
        "504":
          description: The machine did not answer in time
  /api/notify/test:
    post:
      operationId: testNotify
      description: Send a test notification through every configured channel. Operator only.
      responses:
        "200":
          description: One result per channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTestResponse"
  /api/projects:
    get:
      operationId: listProjects
      description: Projects. Holder only.
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            default: active
          description: Project status, or `all`.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "503":
          description: Projects are not configured
    post:
      operationId: createProject
      description: Create a project with a generated one-pager. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid JSON, mode, or missing name and roots
        "503":
          description: Projects are not configured
  /api/projects/ensure:
    post:
      operationId: ensureProject
      description: |
        Return the project rooted at `path`, creating one when none matches.
        Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectEnsureRequest"
      responses:
        "200":
          description: The existing project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: A project was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Missing path or invalid mode
        "503":
          description: Projects are not configured
  /api/projects/by-root:
    get:
      operationId: findProjectByRoot
      description: |
        Find the project whose roots contain `path`. The answer carries the
        project under `project` and flattens its fields at the top level for
        older clients. Holder only.
      parameters:
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching project and one-pager summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectByRoot"
        "400":
          description: Missing path
        "404":
          description: No project contains that path
        "503":
          description: Projects are not configured
  /api/projects/{id}:
    get:
      operationId: getProject
      description: Project. Holder only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
        "503":
          description: Projects are not configured
    patch:
      operationId: patchProject
      description: Update project fields. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPatchRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid JSON or mode
        "404":
          description: Not found
  /api/projects/{id}/artifacts:
    get:
      operationId: listProjectArtifacts
      description: Artifacts linked to this project. Holder only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: status
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Artifacts linked to this project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artifact"
        "404":
          description: Project not found
        "503":
          description: Projects are not configured
  /api/projects/{id}/one-pager:
    get:
      operationId: getOnePager
      description: One-pager markdown and a parsed summary. Holder only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: One-pager markdown and a parsed summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnePager"
        "404":
          description: Project or one-pager file not found
        "503":
          description: Projects are not configured
    put:
      operationId: putOnePager
      description: Replace the one-pager markdown. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnePagerUpdateRequest"
      responses:
        "200":
          description: Stored markdown and the file's modification time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnePagerUpdateResponse"
        "404":
          description: Project not found
        "409":
          description: The one-pager changed since `updated_at`; the body carries the current value
        "503":
          description: Projects are not configured
  /api/projects/{id}/pulse:
    get:
      operationId: getProjectPulse
      description: Project pulse. Holder only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: window_days
          required: false
          schema:
            type: integer
            minimum: 1
            default: 90
      responses:
        "200":
          description: Project pulse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPulse"
        "404":
          description: Project not found
        "503":
          description: Projects are not configured
  /api/projects/{id}/pulse/refresh:
    post:
      operationId: refreshProjectPulse
      description: |
        Rebuild the pulse and merge its managed block into the one-pager.
        Content outside the `kin:auto` markers is preserved. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPulseRefreshRequest"
      responses:
        "200":
          description: The rebuilt pulse and the merged markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPulseRefreshResponse"
        "404":
          description: Project not found
        "503":
          description: Projects are not configured
  /api/projects/{id}/tasks:
    get:
      operationId: listProjectTasks
      description: Tasks linked to this project, or run in one of its roots. Holder only.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Tasks linked to this project, or run in one of its roots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "404":
          description: Project not found
        "503":
          description: Projects are not configured
  /api/providers:
    get:
      operationId: listProviders
      description: Registered model providers and the active one. Operator only.
      responses:
        "200":
          description: Provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
    post:
      operationId: createProvider
      description: |
        Add a provider entry. When no provider is active yet the new entry
        becomes active, unless `active` says otherwise. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderWriteRequest"
      responses:
        "201":
          description: Updated provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "400":
          description: Invalid JSON or provider fields
  /api/providers/models:
    post:
      operationId: listProviderModels
      description: |
        Discover the models a provider endpoint serves. Accepts either a saved
        entry (`id`) or unsaved form values. An omitted or masked `api_key` on a
        saved entry reuses the stored secret. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderModelsRequest"
      responses:
        "200":
          description: Model ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModelsResponse"
        "400":
          description: Invalid JSON or provider fields
        "502":
          description: The provider endpoint could not be read
  /api/providers/{id}:
    put:
      operationId: updateProvider
      description: |
        Update a provider entry. An omitted or masked `api_key` keeps the stored
        secret; `clear_api_key` removes it explicitly. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderWriteRequest"
      responses:
        "200":
          description: Updated provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "400":
          description: Invalid JSON or provider fields
    delete:
      operationId: deleteProvider
      description: Remove a provider entry. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Updated provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "400":
          description: Missing provider id
  /api/providers/{id}/activate:
    post:
      operationId: activateProvider
      description: Make one provider entry the active one. Operator only.
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      responses:
        "200":
          description: Updated provider registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersResponse"
        "400":
          description: Unknown provider id
  /api/push/config:
    get:
      operationId: getPushConfig
      description: The VAPID public key browsers subscribe with. Operator only.
      responses:
        "200":
          description: Push configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushConfig"
        "503":
          description: Push is not available on this daemon
  /api/push/subscribe:
    post:
      operationId: subscribePush
      description: Register one browser push subscription. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "201":
          description: The stored subscription id (the original one on a re-subscribe)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscribeResponse"
        "400":
          description: Invalid or missing subscription fields
        "503":
          description: Push is not available on this daemon
    delete:
      operationId: unsubscribePush
      description: |
        Remove a browser push subscription by endpoint. The endpoint may also be
        sent as an `endpoint` query parameter. Operator only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "204":
          description: Removed
        "400":
          description: Missing endpoint
        "503":
          description: Push is not available on this daemon
  /api/push/test:
    post:
      operationId: testPush
      description: Deliver one test message to every registered browser. Operator only.
      responses:
        "200":
          description: One result per channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotifyTestResponse"
        "503":
          description: Push is not available on this daemon
  /api/recent-cwds:
    get:
      operationId: listRecentCwds
      description: Recently used working directories, most recent first. Holder only.
      responses:
        "200":
          description: Recent absolute paths
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/routines:
    get:
      operationId: listRoutines
      description: |
        Routine definitions, newest first. A request with none of `page`,
        `cursor`, or `q` receives the legacy bare array, except that `runs=1`
        always receives the page object with a `runs` feed. Holder only.
      parameters:
        - in: query
          name: project_id
          required: false
          schema:
            type: string
        - in: query
          name: enabled
          required: false
          schema:
            type: boolean
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
          description: Case-insensitive match on title and prompt.
        - in: query
          name: page
          required: false
          schema:
            type: string
        - in: query
          name: runs
          required: false
          schema:
            type: string
            enum: ["1"]
        - in: query
          name: runs_limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: Routine page, or a bare array for a legacy request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RoutinePage"
                  - type: array
                    items:
                      $ref: "#/components/schemas/Routine"
    post:
      operationId: createRoutine
      description: Create a routine. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutineCreateRequest"
      responses:
        "201":
          description: Created routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "400":
          description: Invalid JSON or schedule
  /api/routines/mark-all-read:
    post:
      operationId: markAllRoutineRunsRead
      description: Mark every unread routine run read. Operator only.
      responses:
        "200":
          description: How many runs were marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineMarkAllReadResponse"
  /api/routines/preview:
    post:
      operationId: previewRoutine
      description: |
        Resolve a wall-clock recurrence rule to its next run. Reads no state, so
        a holder token may ask.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutinePreviewRequest"
      responses:
        "200":
          description: The next occurrence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutinePreviewResponse"
        "400":
          description: Invalid or missing recurrence, or no future occurrence
  /api/routines/runs/{taskID}/read:
    post:
      operationId: markRoutineRunRead
      description: |
        Mark one routine run read and publish its task update. Answers the task,
        or `{"ok":"true"}` when the task row has already gone.
      parameters:
        - $ref: "#/components/parameters/RoutineRunTaskId"
      responses:
        "200":
          description: The task, or an ok marker
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Task"
                  - type: object
                    required: [ok]
                    properties:
                      ok:
                        type: string
        "404":
          description: No such routine run
  /api/routines/unread-count:
    get:
      operationId: getRoutineUnreadCount
      description: Unread routine runs. Holder only.
      responses:
        "200":
          description: Unread routine runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutineUnreadCount"
  /api/routines/{id}:
    get:
      operationId: getRoutine
      description: Routine. Holder only.
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      responses:
        "200":
          description: Routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "404":
          description: Not found
    patch:
      operationId: patchRoutine
      description: Update routine fields. Operator only.
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutinePatchRequest"
      responses:
        "200":
          description: Updated routine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Routine"
        "400":
          description: Invalid JSON or schedule
        "404":
          description: Not found
    delete:
      operationId: deleteRoutine
      description: Delete a routine. Operator only.
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: The routine has a dispatch in progress
  /api/routines/{id}/run-now:
    post:
      operationId: runRoutineNow
      description: Start one run of a routine immediately. Operator only.
      parameters:
        - $ref: "#/components/parameters/RoutineId"
      responses:
        "201":
          description: The task the run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: The scheduler could not start the run
        "404":
          description: Not found
        "409":
          description: The routine is already running
        "503":
          description: The routine scheduler is unavailable
  /api/routing/defaults:
    get:
      operationId: getRoutingDefaults
      description: Routing defaults. Holder only.
      responses:
        "200":
          description: Routing defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingDefaults"
    put:
      operationId: putRoutingDefaults
      description: Replace routing defaults. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingDefaults"
      responses:
        "200":
          description: Stored defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingDefaults"
        "400":
          description: Invalid JSON or defaults
  /api/routing/options:
    get:
      operationId: getRoutingOptions
      description: Everything a dispatch picker offers, plus the current defaults. Holder only.
      responses:
        "200":
          description: Routing options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingOptions"
  /api/routing/preview:
    get:
      operationId: getRoutingPreview
      description: |
        Resolve a dispatch selection to the phases it would run. Auto mode
        requires a team; manual mode requires an agent, a provider, and a
        model. Holder only.
      parameters:
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [auto, manual]
            default: auto
        - in: query
          name: team
          required: false
          schema:
            type: string
        - in: query
          name: objective
          required: false
          schema:
            type: string
        - in: query
          name: agent
          required: false
          schema:
            type: string
        - in: query
          name: provider
          required: false
          schema:
            type: string
        - in: query
          name: model
          required: false
          schema:
            type: string
        - in: query
          name: prompt
          required: false
          schema:
            type: string
          description: Classified locally for the quality floor; never sent to a provider.
        - in: query
          name: routine
          required: false
          schema:
            type: string
            enum: ["1", "true"]
      responses:
        "200":
          description: Resolved preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingPreview"
        "400":
          description: Unknown team, or an incomplete manual selection
  /api/routing/profiles:
    get:
      operationId: getRoutingProfiles
      description: Team profiles. Holder only.
      responses:
        "200":
          description: Team profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingTeamProfileList"
    put:
      operationId: putRoutingProfiles
      description: Replace team profiles. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingTeamProfileList"
      responses:
        "200":
          description: Stored team profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingTeamProfileList"
        "400":
          description: Invalid JSON or profiles
  /api/routing/provider-profiles:
    get:
      operationId: getProviderProfiles
      description: Provider profiles. Holder only.
      responses:
        "200":
          description: Provider profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingProviderProfileList"
    put:
      operationId: putProviderProfiles
      description: Replace provider profiles. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoutingProviderProfileList"
      responses:
        "200":
          description: Stored provider profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingProviderProfileList"
        "400":
          description: Invalid JSON or profiles
  /api/search/transcript:
    get:
      operationId: searchTranscript
      description: |
        Search what was actually said in the library's conversations. Scoped
        like the task list, so one account cannot read another's transcripts.
        An empty query is refused rather than answered with everything.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            maxLength: 200
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: Matching messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptSearchResponse"
        "400":
          description: Missing, too long, or non-printable query, or invalid limit
        "503":
          description: Store unavailable
        "504":
          description: The search ran out of its budget
  /api/tasks/{taskId}/fork:
    post:
      operationId: forkTask
      description: |
        Branch a new task from a transcript prefix. `from_seq` keeps everything
        up to and including that event; 0 copies the whole transcript. A
        `prompt` is appended and run on the forked task.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForkRequest"
      responses:
        "201":
          description: The new task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid JSON or from_seq
        "404":
          description: Task not found
        "409":
          description: No checkpoint is available for that point
  /api/tasks/{taskId}/limit/continue:
    post:
      operationId: limitContinue
      description: |
        Resolve a provider rate-limit stop. `wait` waits for the quota to reset,
        `continue` resumes immediately, `switch` moves the task to another agent
        (`agent` required), and `dismiss` closes the limit notice.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitContinueRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid action or missing agent
        "404":
          description: Task not found
        "409":
          description: The task is not in a state this action applies to
  /api/tasks/{taskId}/retry:
    post:
      operationId: retryTask
      description: |
        Rewind a terminal task to a user turn and run it again, under the same
        task id. `from_seq` names the event to rewind to; 0 uses the last user
        turn. `restore_files` restores the workspace checkpoint when available.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid JSON, from_seq, or an unusable retry
        "404":
          description: Task not found
        "409":
          description: Task is not terminal, or its workspace cannot be restored
  /api/tasks/{taskId}/source/changes:
    get:
      operationId: getTaskSourceChanges
      description: |
        Uncommitted changes in a task's checkout, including untracked files.
        A task that runs on another machine is answered by that machine.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceChangesResponse"
        "400":
          description: The task has no readable checkout
        "404":
          description: Task not found
        "409":
          description: The workspace is on another machine that is offline, or its location cannot be resolved
        "500":
          description: The task could not be read, or the machine's answer could not be decoded
        "501":
          description: The machine's build does not support this query
        "503":
          description: Workspace manager or machine channel unavailable
        "504":
          description: The machine did not answer in time
  /api/tasks/{taskId}/source/file:
    get:
      operationId: readTaskSourceFile
      description: |
        One file from a task's checkout. `raw=1` returns the bytes and
        `download=1` returns them as an attachment; both require the file to be
        on this machine.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: raw
          required: false
          schema:
            type: string
            enum: ["1"]
        - in: query
          name: download
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: File text, or raw bytes for raw/download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileResponse"
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing path or an unreadable file
        "403":
          description: Path escapes the workspace scope
        "404":
          description: Task not found
        "409":
          description: The workspace is on another machine that is offline, or its location cannot be resolved
        "500":
          description: The task could not be read, or the machine's answer could not be decoded
        "501":
          description: Raw preview or download requested for a remote workspace, or the machine's build does not support the query
        "503":
          description: Workspace manager or machine channel unavailable
        "504":
          description: The machine did not answer in time
  /api/tasks/{taskId}/source/files:
    get:
      operationId: searchTaskSourceFiles
      description: File-name search inside a task's checkout, bounded for the composer's mention menu.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching repository-relative paths
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFilesResponse"
        "400":
          description: Missing, too long, or non-printable query
        "404":
          description: Task not found
        "409":
          description: The workspace is on another machine that is offline, or its location cannot be resolved
        "500":
          description: The task could not be read, or the machine's answer could not be decoded
        "501":
          description: The machine's build does not support this query
        "503":
          description: Workspace manager or machine channel unavailable
        "504":
          description: The machine did not answer in time
  /api/tasks/{taskId}/source/tree:
    get:
      operationId: listTaskSourceTree
      description: One level of a task's checkout.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: Repository-relative directory; defaults to the workspace scope.
      responses:
        "200":
          description: Directory entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceTreeResponse"
        "400":
          description: The task has no readable checkout
        "403":
          description: Path escapes the workspace scope
        "404":
          description: Task not found
        "409":
          description: The workspace is on another machine that is offline, or its location cannot be resolved
        "500":
          description: The task could not be read, or the machine's answer could not be decoded
        "501":
          description: The machine's build does not support this query
        "503":
          description: Workspace manager or machine channel unavailable
        "504":
          description: The machine did not answer in time
  /api/tasks/{taskId}/usage:
    get:
      operationId: getTaskUsage
      description: Token, cache, and cost totals for one task, plus the model's context window.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskUsageResponse"
        "404":
          description: Task not found
  /api/tasks/{taskId}/workspace/file:
    get:
      operationId: readTaskWorkspaceFile
      description: |
        Read a file from a task's workspace. The route delegates to the current
        workspace generation when one exists; otherwise it reads the checkout
        directly. A task that runs on another machine is answered by it.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFileResponse"
        "400":
          description: Missing path or an unreadable file
        "404":
          description: File not found
        "413":
          description: File is too large to read
    put:
      operationId: writeTaskWorkspaceFile
      description: |
        Write a file in a task's workspace. Operator only. The route delegates
        to the current workspace generation when one exists.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceFileWriteRequest"
      responses:
        "200":
          description: The written file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFileResponse"
        "400":
          description: Invalid JSON, missing path, or a refused write
        "403":
          description: Path escapes the workspace scope
        "404":
          description: Task not found or not visible to this caller
        "409":
          description: No active writable workspace generation, the workspace is not writable, or the task runs on another machine
        "413":
          description: Request body too large
  /api/tasks/{taskId}/workspace/list:
    get:
      operationId: listTaskWorkspace
      description: One directory level in a task's workspace. Delegates to the current generation when one exists.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: path
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListResponse"
        "400":
          description: Invalid path or not a directory
        "404":
          description: Path not found
  /api/tasks/{taskId}/workspace/restore:
    post:
      operationId: restoreTaskWorkspace
      description: |
        Restore isolated task files to a checkpoint. `event_seq` 0 restores the
        initial state. Operator only.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceRestoreRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid JSON
        "404":
          description: Task not found, or no checkpoint for that event
        "409":
          description: Task is not terminal, or its files are not isolated
  /api/terminal/profiles:
    get:
      operationId: listTerminalProfiles
      description: Shell profiles available to this desktop. Loopback and operator only.
      responses:
        "200":
          description: Profiles and the default profile id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalProfilesResponse"
        "503":
          description: Terminal is unavailable
  /api/terminal/sessions:
    get:
      operationId: listTerminalSessions
      description: Terminal sessions on this desktop. Loopback and operator only.
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TerminalSession"
        "503":
          description: Terminal is unavailable
    post:
      operationId: createTerminalSession
      description: Start a terminal session. Loopback and operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TerminalSessionCreateRequest"
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalSession"
        "400":
          description: Unknown profile, invalid cwd, or invalid size
        "429":
          description: Session limit reached
        "503":
          description: Terminal is unavailable
  /api/terminal/sessions/{id}:
    delete:
      operationId: deleteTerminalSession
      description: |
        Close a terminal session. Removing a session that is already gone
        succeeds. Loopback and operator only.
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
      responses:
        "204":
          description: Closed
        "503":
          description: Terminal is unavailable
  /api/terminal/sessions/{id}/ws:
    get:
      operationId: attachTerminalSession
      description: |
        Upgrade to a WebSocket attached to one terminal session. Loopback and
        operator only; when an `Origin` header is present it must be a loopback
        origin. A session accepts one attachment at a time.

        Server binary frames are raw terminal output; server text frames are
        JSON: `{"type":"ready","session":...}`, `{"type":"exit","exit_code":N}`,
        or `{"type":"error","message":"..."}`. Client binary frames are
        keyboard input; client text frames are
        `{"type":"resize","cols":N,"rows":N}`. Because a WebSocket cannot set an
        Authorization header, the credential may be passed as `?token=`.
      parameters:
        - $ref: "#/components/parameters/TerminalSessionId"
      responses:
        "101":
          description: Switching Protocols
        "400":
          description: Not a WebSocket upgrade
        "403":
          description: Origin is not loopback, or the caller is not the operator
        "404":
          description: No such terminal session
        "409":
          description: Session is already attached to another client
        "503":
          description: Terminal is unavailable, or the session has closed
  /api/uploads:
    post:
      operationId: uploadFile
      description: |
        Upload one attachment as `multipart/form-data` with a `file` field, up
        to 20 MiB. Images and common text/binary types are accepted. Operator
        only.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Stored upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "400":
          description: Missing file field
        "413":
          description: File exceeds 20 MiB
        "503":
          description: Uploads are not configured
        "415":
          description: The file type is not accepted
  /api/usage/limits:
    get:
      operationId: getUsageLimits
      description: Today's spend and token usage per agent, against configured limits. Holder only.
      responses:
        "200":
          description: Per-agent limit status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentLimitStatus"
  /api/usage/summary:
    get:
      operationId: getUsageSummary
      description: Per-day, per-agent aggregates over a recent window. Holder only.
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 0
            default: 30
          description: Window length in days, inclusive of today. Capped at 366.
      responses:
        "200":
          description: Usage rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageRow"
        "400":
          description: Invalid days
  /api/uploads/{name}:
    get:
      operationId: serveUpload
      description: |
        Serve a stored upload by its stored filename. Holder only. The response
        is the file's bytes typed by extension, with a private one-hour cache.
      parameters:
        - $ref: "#/components/parameters/UploadName"
      responses:
        "200":
          description: The stored file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid filename
        "404":
          description: Not found
  /api/auth/invite:
    post:
      operationId: createInvitation
      description: |
        Mint a one-time invitation code for a new member. Operator only. The
        code is returned in plaintext exactly once; only its digest is stored.
      responses:
        "200":
          description: The invitation code and its expiry
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code:
                    type: string
                  expires_at:
                    type: integer
                    description: Expiry in unix milliseconds.
        "404":
          description: Accounts are not enabled on this daemon
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The master token from `~/.kin/token`, or a device token minted by the
        pairing exchange. Sent as `Authorization: Bearer <token>`.
    sessionCookie:
      type: apiKey
      in: cookie
      name: kin_session
      description: |
        Browser login session created by bootstrap, join, login, or the OIDC
        callback. HttpOnly, SameSite=Lax, Secure when the daemon serves TLS.
    tokenQuery:
      type: apiKey
      in: query
      name: token
      description: |
        The master or device token as a query parameter, for clients that
        cannot set an Authorization header. The relay Worker converts this to a
        Bearer header before forwarding.
    relayRoom:
      type: apiKey
      in: query
      name: room
      description: |
        Relay transport credential, validated and stripped by the Cloudflare
        Worker. Not a daemon credential; declared here so clients can describe
        the URL they build.
    relayKey:
      type: apiKey
      in: query
      name: key
      description: |
        Relay transport credential, validated and stripped by the Cloudflare
        Worker. Not a daemon credential.
