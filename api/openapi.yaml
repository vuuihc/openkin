openapi: 3.1.0
info:
  title: OpenKin Task Live-Resource Contract
  version: 0.1.0
  description: |
    Authoritative contract for the beta Web and iOS client surface, including
    task, approval, question, workspace, device-pairing, and live update APIs.
    Go handlers remain handwritten; TypeScript types are generated from this
    document. Relay requests add room and key query credentials.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Daemon liveness
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  bus_overflow:
                    type: integer
  /api/version:
    get:
      operationId: version
      responses:
        "200":
          description: Daemon version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
  /api/pairing/exchange:
    post:
      operationId: exchangePairingSecret
      parameters:
        - $ref: "#/components/parameters/RelayRoom"
        - $ref: "#/components/parameters/RelayKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingExchangeRequest"
      responses:
        "201":
          description: Scoped device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingExchangeResponse"
        "401":
          description: Expired, replayed, or invalid pairing secret
  /api/pairing/sessions:
    post:
      operationId: createPairingSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingSessionRequest"
      responses:
        "201":
          description: One-time pairing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSessionResponse"
  /api/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Device revoked
  /api/workers:
    get:
      operationId: listWorkers
      responses:
        "200":
          description: User-owned worker leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
  /api/workers/register:
    post:
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHello"
      responses:
        "201":
          description: Registered worker lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
  /api/workers/heartbeat:
    post:
      operationId: heartbeatWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeat"
      responses:
        "200":
          description: Renewed worker lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
  /api/workers/{workerId}/revoke:
    post:
      operationId: revokeWorker
      parameters:
        - in: path
          name: workerId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Worker lease revoked
  /api/agent-providers:
    get:
      operationId: listAgentProviders
      responses:
        "200":
          description: Local Agent discovery and session capability evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProvider"
  /api/agent-sessions:
    get:
      operationId: listAgentSessions
      parameters:
        - in: query
          name: agent
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: cwd
          schema:
            type: string
        - in: query
          name: linked
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Metadata-only index of provider-owned local sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSession"
  /api/agent-sessions/page:
    get:
      operationId: listAgentSessionsPage
      parameters:
        - in: query
          name: agent
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: cwd
          schema:
            type: string
        - in: query
          name: linked
          schema:
            type: boolean
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Cursor page of provider-owned local session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionListPage"
  /api/agent-sessions/{id}:
    get:
      operationId: getAgentSession
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: One indexed provider-owned local session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          description: Indexed session not found
  /api/agent-sessions/import:
    post:
      operationId: importAgentSessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionImportRequest"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionImportResponse"
  /api/agent-sessions/{id}/history:
    get:
      operationId: getAgentSessionHistory
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Provider history page read directly from the source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionHistoryPage"
        "404":
          description: Indexed session not found
        "501":
          description: Provider history is not supported
  /api/agent-sessions/{id}/attach:
    post:
      operationId: attachAgentSession
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionAttachRequest"
      responses:
        "200":
          description: Existing Kin task attached to the provider session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionAttachResponse"
        "201":
          description: New Kin task created and attached to the provider session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionAttachResponse"
        "409":
          description: Session, task, or provider cannot be attached
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Daemon settings and connection projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /api/relay/pairing:
    post:
      operationId: refreshRelayPairing
      responses:
        "200":
          description: Updated Relay pairing projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Relay is not configured or pairing could not be refreshed
        "401":
          description: Master authentication required
        "501":
          description: Relay runtime is unavailable
  /api/cloudflare/oauth/start:
    post:
      operationId: startCloudflareOAuth
      responses:
        "200":
          description: Cloudflare OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url:
                    type: string
        "401":
          description: Master authentication required
        "400":
          description: Cloudflare authorization could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/accounts:
    get:
      operationId: listCloudflareAccounts
      responses:
        "200":
          description: Cloudflare accounts available to the authorized user
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloudflareAccount"
        "400":
          description: Cloudflare accounts could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/zones:
    get:
      operationId: listCloudflareZones
      parameters:
        - in: query
          name: account_id
          schema:
            type: string
      responses:
        "200":
          description: Cloudflare zones available to the authorized user
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloudflareZone"
        "400":
          description: Cloudflare zones could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/relay/deploy:
    post:
      operationId: deployCloudflareRelay
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareRelayDeployRequest"
      responses:
        "200":
          description: Updated settings after Worker deployment and Relay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Cloudflare authorization, deployment, or Relay configuration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/relay/domain:
    post:
      operationId: bindCloudflareRelayDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareRelayDomainRequest"
      responses:
        "200":
          description: Updated settings after custom domain binding and Relay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Cloudflare authorization, domain binding, or Relay configuration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tasks:
    get:
      operationId: listTasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
      responses:
        "200":
          description: Task snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/browser/actions:
    post:
      operationId: runBrowserAction
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAction"
      responses:
        "200":
          description: Browser action completed
          content:
            application/json:
              schema:
                type: object
                required: [task_id, status]
                properties:
                  task_id:
                    type: string
                  status:
                    const: completed
        "409":
          description: Another browser action is already running for the task
        "400":
          description: Invalid action or worker failure
        "404":
          description: Task not found
        "503":
          description: Browser worker is not configured
  /api/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/limit-wait:
    get:
      operationId: getTaskLimitWait
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Durable quota wait state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLimitWait"
        "404":
          description: No active or historical quota wait
  /api/tasks/{taskId}/prompt:
    post:
      operationId: followUpTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Canceled task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/events:
    get:
      operationId: listTaskEvents
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: since_seq
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Ordered durable task events after the cursor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
  /api/tasks/{taskId}/workers:
    get:
      operationId: listTaskWorkerSteps
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - in: query
          name: execution_id
          schema:
            type: string
      responses:
        "200":
          description: Persisted multi-worker plan and latest step states
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkerStep"
  /api/approvals:
    get:
      operationId: listApprovals
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Approval snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"
  /api/approvals/{approvalId}/decision:
    post:
      operationId: decideApproval
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecisionRequest"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /api/user-questions:
    get:
      operationId: listUserQuestions
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: User-question snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserQuestion"
  /api/user-questions/{questionId}/answer:
    post:
      operationId: answerUserQuestion
      parameters:
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserQuestionResponse"
      responses:
        "200":
          description: Answered user question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserQuestion"
  /api/ws:
    get:
      operationId: subscribeLiveUpdates
      parameters:
        - $ref: "#/components/parameters/RelayRoom"
        - $ref: "#/components/parameters/RelayKey"
      description: |
        Upgrades to a WebSocket. Each text frame is exactly one WSMessage.
        Clients must reject frames that do not match the discriminated union.
      x-websocket-message:
        $ref: "#/components/schemas/WSMessage"
      responses:
        "101":
          description: Switching Protocols
  /api/tasks/{taskId}/workspaces:
    get:
      operationId: listTaskWorkspaces
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Workspace generations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /api/tasks/{taskId}/workspaces/{workspaceId}/tree:
    get:
      operationId: listWorkspaceTree
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: path
          schema:
            type: string
        - in: query
          name: depth
          schema:
            type: integer
      responses:
        "200":
          description: Workspace tree
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/tasks/{taskId}/workspaces/{workspaceId}/file:
    get:
      operationId: readWorkspaceFile
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workspace file
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/tasks/{taskId}/workspaces/{workspaceId}/diff:
    get:
      operationId: getWorkspaceDiff
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/WorkspaceId"
      responses:
        "200":
          description: Workspace diff
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/tasks/{taskId}/replay:
    post:
      operationId: replayTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayRequest"
      responses:
        "200":
          description: Inspect-only replay projection
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Forked or rerun task
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/evals/suites:
    get:
      operationId: listEvalSuites
      responses:
        "200":
          description: Available file-backed evaluation suites
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/evals/runs:
    get:
      operationId: listEvalRuns
      responses:
        "200":
          description: Evaluation runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvalRun"
    post:
      operationId: createEvalRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRunRequest"
      responses:
        "202":
          description: Evaluation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalRun"
  /api/evals/runs/{runId}:
    get:
      operationId: getEvalRun
      parameters:
        - in: path
          name: runId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evaluation run and deterministic results
          content:
            application/json:
              schema:
                type: object
                required: [run, results]
                properties:
                  run:
                    $ref: "#/components/schemas/EvalRun"
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvalResult"
  /api/evals/compare:
    post:
      operationId: compareEvalRuns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalCompareRequest"
      responses:
        "202":
          description: Comparison runs started
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvalRun"
  /api/evals/routines:
    post:
      operationId: createEvalRoutine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvalRoutineRequest"
      responses:
        "201":
          description: Saved routing regression Routine
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /.well-known/agent-card.json:
    get:
      operationId: getAgentCard
      responses:
        "200":
          description: Opt-in A2A capability card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCard"
  /a2a/v1/tasks:
    post:
      operationId: a2aCreateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/A2ATaskRequest"
      responses:
        "202":
          description: Delegated task accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2ATask"
  /a2a/v1/tasks/{taskId}:
    get:
      operationId: a2aGetTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Delegated task projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2ATask"
  /a2a/v1/tasks/{taskId}/events:
    get:
      operationId: a2aListTaskEvents
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Normalized durable events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskEvent"
  /a2a/v1/tasks/{taskId}/stream:
    get:
      operationId: a2aStreamTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Server-sent normalized progress events
          content:
            text/event-stream:
              schema:
                type: string
  /a2a/v1/tasks/{taskId}:cancel:
    post:
      operationId: a2aCancelTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Canceled task projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/A2ATask"
  /a2a/v1/tasks/{taskId}:message:
    post:
      operationId: a2aFollowUpTask
      parameters:
