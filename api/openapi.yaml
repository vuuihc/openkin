                additionalProperties: true
        "202":
          description: Forked or rerun task
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/tasks/{taskId}/pr:
    get:
      operationId: getTaskPullRequest
      description: >-
        Cached pull-request state for the task's current workspace branch. This
        is a cache read: it never queries GitHub, never waits on the network,
        and never writes, so it is safe to call as often as a screen renders.
        What it returns carries its own age; freshness comes from the background
        pass and from refreshing this task's pull request by hand. A task that
        is not on a GitHub repository, has no workspace, or whose checkout is
        gone returns 200 with an empty observation list, because having no pull
        request is a normal state and not an error.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pull-request snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPullRequestSnapshot"
        "502":
          description: The snapshot could not be assembled
        "503":
          description: GitHub integration is not configured
  /api/tasks/{taskId}/pr/refresh:
    post:
      operationId: refreshTaskPullRequest
      description: >-
        Query GitHub now and wait for the answer. The only route that spends
        rate limit, and the only one that touches the network: it is separate
        from the read so that reading can be granted to every caller while
        querying is granted to the callers who hold this machine — its owner and
        the devices paired to it. A paired phone is one of those: it has no
        terminal to run `gh` in, so refusing it here would leave the phone
        unable to ask about a branch nobody has looked at yet.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pull-request snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPullRequestSnapshot"
        "403":
          description: >-
            The caller may read pull-request state but not spend GitHub rate
            limit on demand; querying is limited to the node's owner and to the
            devices paired to it
        "502":
          description: The snapshot could not be assembled
        "503":
          description: GitHub integration is not configured
  /api/tasks/{taskId}/pr/publish:
    post:
      operationId: publishTaskPullRequest
      description: >-
        Push this session's branch and open its pull request, on the machine
        that holds the checkout. The Hub pushes nothing itself: it carries the
        words and records the answer, and that machine — with its own git, its
        own credentials, its own GitHub CLI — decides. It refuses a checkout
        that is not a GitHub repository, one on a detached HEAD, one on the
        repository's default branch, and one with uncommitted work, naming the
        files in the last case; only the default branch is a refusal with a way
        out (createTaskBranch).

        A session whose checkout this daemon holds is refused with 409 rather
        than served: a phone that can already reach this Hub can reach the
        directory, and pushing the operator's own checkout from a phone is a
        decision nobody has made.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title:
                  type: string
                  description: >-
                    One line, and required: `gh pr create` opens an editor
                    without one, and the machine has none. At most 256
                    characters, counted the way GitHub counts them, so a title
                    written in Chinese is not refused for its length in bytes.
                    A control character in it is a 400.
                body:
                  type: string
                  description: >-
                    Markdown, at most 32 KiB. Newlines are its substance and are
                    not refused. The bound is the query frame's rather than
                    GitHub's: these words travel inside one, where a byte can
                    cost six once encoded, so a larger body would be accepted
                    here and then refused by the frame with a sentence naming no
                    field.
      responses:
        "200":
          description: >-
            What the publish did, including a refusal: a blocked publish is an
            outcome of a question the caller asked, so it is answered rather
            than failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishReport"
        "400":
          description: >-
            The words cannot travel, or the machine refused the push. Both are
            the same answer because both are the same kind of news: nothing was
            published, and the reason is in the body.
        "403":
          description: >-
            The caller is neither the node's holder nor a device paired to it
        "404":
          description: No such task
        "409":
          description: >-
            This session runs on this daemon, so there is no other machine to
            ask, or the workspace it runs in is on that machine and this Hub
            cannot place it. The body carries a code — "session_runs_here" for
            the first — because the console draws its own sentence for that one
            and must not draw it for the other.
        "502":
          description: The machine published something the Hub could not write down
        "503":
          description: GitHub integration is not configured
  /api/tasks/{taskId}/branch:
    post:
      operationId: createTaskBranch
      description: >-
        Start this task's own branch (kin/task/<id>/g1) in the session's
        checkout, on the machine that holds it, and switch to it. It is the way
        out of a publish refused on the default branch, and it exists for
        nothing else: the branch is named by the Hub so that a phone cannot
        scatter one task's work across names it invented. Uncommitted work comes
        along, which is the point — it is what a person is publishing.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Where the checkout is now
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  cwd:
                    type: string
                  current:
                    type: string
                    description: The branch the checkout is on, read back after the switch.
        "400":
          description: >-
            The machine refused, in its own words — a branch of that name
            already exists, or the directory is not a checkout
        "403":
          description: >-
            The caller is neither the node's holder nor a device paired to it
        "404":
          description: No such task
        "409":
          description: >-
            This session runs on this daemon, so there is no other machine to
            ask, or the workspace it runs in is on that machine and this Hub
            cannot place it. The body carries a code — "session_runs_here" for
            the first — because the console draws its own sentence for that one
            and must not draw it for the other.
  /api/tasks/{taskId}/share:
    get:
      operationId: getTaskShare
      description: >-
        Whether this conversation currently has a readable link, and until when.
        It never returns the link itself: the daemon stores only a digest of the
        token, so the URL exists solely in the response that minted it. A link
        that was lost is replaced by creating another one, which closes the old.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Share state, carrying no secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionShareState"
        "404":
          description: No such task
    post:
      operationId: createTaskShare
      description: >-
        Mint a read-only link to this conversation and close any link it had.
        The response is the only time the token is returned; the page it opens
        carries the conversation's text messages and nothing else.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "201":
          description: The minted link's token, shown once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionShareCreated"
        "403":
          description: >-
            The caller does not hold this machine — a task owner without the
            node's own credential cannot publish or withdraw its link
        "404":
          description: No such task
    delete:
      operationId: revokeTaskShare
      description: >-
        Close this conversation's link now. Revoking a task with no link is not
        an error: the answer is zero links closed.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: How many links were closed
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
        "403":
          description: >-
            The caller does not hold this machine — a task owner without the
            node's own credential cannot publish or withdraw its link
        "404":
          description: No such task
