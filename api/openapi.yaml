      properties:
        id:
          type: string
        agent_id:
          type: string
        device_id:
          type: string
          description: Machine whose agent owns this session. Absent when the row
            predates the column; the daemon that owns the database attributes
            such a row to itself.
        external_ref:
          type: string
        title:
          type: string
        cwd:
          type: string
        project_id:
          type: string
        project_label:
          type: string
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        source_cursor:
          type: string
        content_digest:
          type: string
        first_seen_at:
          type: integer
        last_seen_at:
          type: integer
        updated_at:
          type: integer
        linked:
          type: boolean
    AgentSessionListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSession"
        next_cursor:
          type: string
    AgentSessionImportRequest:
      type: object
      properties:
        agents:
          type: array
          maxItems: 32
          items:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 500
          description: >-
            How many sessions one provider may contribute. The default is the
            maximum, and an out-of-range value is clamped to the nearest bound
            rather than refused — this is a ceiling on one import, not a
            parameter a caller can be wrong about.
        device_id:
          type: string
          description: >-
            The paired machine whose sessions to import. Omitted or this
            machine's own id imports this machine's catalogs; naming another
            machine asks it over its channel, and the rows are recorded under
            that machine because the session refs are namespaced by the machine
            that minted them.
    AgentSessionImportResponse:
      type: object
      required: [imported, providers]
      properties:
        imported:
          type: integer
        providers:
          type: object
          additionalProperties:
            type: integer
        errors:
          type: object
          additionalProperties:
            type: string
          description: >-
            Keyed by provider id, in the answering machine's own words. One
            provider that cannot be read does not stop the others from being
            imported. A console importing from several machines keys these by
            machine as well, because the same provider can fail on two of them
            for different reasons; this Hub does not, because every answer it
            returns here is one machine's.
        truncated:
          type: boolean
          description: >-
            A machine had more sessions than one import carries, so the rows
            indexed are the newest of them rather than all of them. Nothing
            failed: it is reported here rather than in errors so that a caller
            counting failures is not told that something did. Only a session
            listing read from another machine can set it — this machine's own
            scan has no way to tell "exactly this many" from "at most this
            many".
    AgentSessionAttachRequest:
      type: object
      properties:
        task_id:
          type: string
        prompt:
          type: string
        cwd:
          type: string
        title:
          type: string
        permission_mode:
          type: string
    AgentSessionAttachResponse:
      type: object
      required: [task, binding]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        binding:
          $ref: "#/components/schemas/TaskAgentSession"
    TaskAgentSession:
      type: object
      required: [id, task_id, agent_session_id, role, state, first_turn_seq, last_turn_seq, attached_at]
      properties:
        id:
          type: string
        task_id:
          type: string
        agent_session_id:
          type: string
        role:
          type: string
        state:
          type: string
        workspace_id:
          type: string
        first_turn_seq:
          type: integer
        last_turn_seq:
          type: integer
        attached_at:
          type: integer
        detached_at:
          type:
            - integer
            - "null"
        last_error:
          type: string
    AgentSessionHistoryItem:
      type: object
      required: [agent_id, external_ref, message_id, role, text, occurred_at, source_rev]
      properties:
        agent_id:
          type: string
        external_ref:
          type: string
        message_id:
          type: string
        kind:
          type: string
          enum: [message, tool_call, tool_result, reasoning]
        role:
          type: string
          enum: [user, assistant, tool]
        tool_name:
          type: string
        text:
          type: string
        occurred_at:
          type: integer
          description: >-
            When the message was recorded, in milliseconds since the Unix epoch.
            Zero means the provider does not record a time for it — a sentinel
            rather than a date, and the same one whether the session was read on
            this machine or on another one.
        source_rev:
          type: string
        truncated:
          type: boolean
          description: >-
            text is the beginning of a longer message: the machine that read the
            provider's record could not send all of it. The message looks
            finished either way, so a client that renders text without this has
            no way to tell a message that ended from one that was stopped.
    AgentSessionHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentSessionHistoryItem"
        next_cursor:
          type: string
        source_rev:
          type: string
        truncated:
          type: boolean
          description: >-
            This page is not the whole rest of the transcript, and there is no
            cursor to continue from: the machine holding the session could not
            send more than this in one answer. An empty next_cursor means both
            "the end" and "the machine stopped", and this is which one it is.
            Not an error — the page was read successfully and simply is not all
            of it.
