    FollowUpRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
        agent:
          type: string
        model:
          type: string
        permission_mode:
          type: string
        interrupt:
          type: boolean
          description: |
            Cut the running turn short and deliver this prompt next, instead of
            waiting for the turn to end. Opt-in: it discards the work in flight,
            and on that path pending approvals are denied and pending questions
            are answered on the user's behalf so the process can exit.
    QueuedPrompt:
      type: object
      required: [id, prompt, user_seq, queued_at]
      properties:
        id:
          type: integer
        prompt:
          type: string
        agent:
          type: string
        model:
          type: string
        permission_mode:
          type: string
        user_seq:
          type: integer
          description: |
            Seq of the message event written when this prompt was accepted. Zero
            when that write failed, in which case the delivery writes it. Always
            present: a client that cannot tell "no anchor" from "field absent"
            cannot decide what to mark as waiting.
        queued_at:
          type: integer
