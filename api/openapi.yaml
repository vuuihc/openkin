  /api/tasks/{taskId}/workspaces/{workspaceId}/file:
    get:
      operationId: readWorkspaceFile
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/WorkspaceId"
        - in: query
          name: path
          required: true
          schema:
            type: string
        - in: query
          name: side
          description: Which recorded side to read. Defaults to the one the state implies.
          schema:
            type: string
            enum: [live, base, final]
        - in: query
          name: raw
          description: |
            Answer with the file's bytes typed by extension, drawable in place
            only for an image type. Subject to a 4 MiB cap.
          schema:
            type: string
            enum: ["1"]
        - in: query
          name: download
          description: |
            Answer with the file's bytes as an attachment. A live file is
            streamed and uncapped; a recorded side is read from git under the
            4 MiB cap. Takes precedence over raw.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Workspace file, or its bytes when raw or download is set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            application/octet-stream:
              schema:
                type: string
                format: binary
    put:
      operationId: writeWorkspaceFile
      description: |
        Write a file into a writable workspace generation. Operator only. The
        path is validated against the generation's scope.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/WorkspaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceFileWriteRequest"
      responses:
        "200":
          description: The written file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceFileResponse"
        "400":
          description: Invalid JSON, missing path, or a refused write
        "403":
          description: Path escapes the workspace scope
        "404":
          description: Workspace not found for this task
        "409":
          description: The workspace is not writable
        "413":
          description: Request body too large
        "503":
          description: Workspace manager unavailable
  /api/tasks/{taskId}/workspaces/{workspaceId}/diff:
    get:
      operationId: getWorkspaceDiff
      parameters:
        - $ref: "#/components/parameters/TaskId"
