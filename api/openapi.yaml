          items:
            $ref: "#/components/schemas/WorkspaceListEntry"
        truncated:
          type: boolean
    WorkspaceFileResponse:
      type: object
      required: [root, path, size, truncated, content]
      properties:
        root:
          type: string
        path:
          type: string
        size:
          type: integer
          description: Full file size, before truncation.
        truncated:
          type: boolean
        content:
          type: string
    WorkspaceFileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
    WorkspaceRestoreRequest:
      type: object
      properties:
        event_seq:
          type: integer
          minimum: 0
          description: Checkpoint event seq; 0 restores the initial state.
    RetryRequest:
      type: object
      properties:
        from_seq:
          type: integer
          minimum: 0
          description: Event seq to rewind to; 0 uses the last user turn.
        restore_files:
          type: boolean
          description: Restore the workspace checkpoint when one exists.
    ForkRequest:
      type: object
      properties:
        from_seq:
          type: integer
          minimum: 0
          description: Last event seq to keep, inclusive; 0 copies the full transcript.
        prompt:
          type: string
          description: Appended as a new user message and run on the forked task.
        agent:
          type: string
    LimitContinueRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [wait, continue, switch, dismiss]
        agent:
          type: string
          description: Required for action=switch.
        reset_at:
          type: integer
          description: Overrides the detected reset time for action=wait, in unix seconds.
    Upload:
      type: object
      required: [id, name, mime, size, url, path]
      properties:
        id:
          type: string
          description: Stored filename, used in the URL.
        name:
          type: string
          description: Original client filename.
        mime:
          type: string
        size:
          type: integer
        url:
          type: string
          description: GET path that serves the stored file.
        path:
          type: string
          description: Absolute on-disk path, for agents that read files by path.
    TerminalProfile:
      type: object
      required: [id, name, executable, default]
      properties:
        id:
          type: string
        name:
          type: string
        executable:
          type: string
        default:
          type: boolean
    TerminalProfilesResponse:
      type: object
      required: [profiles, default_profile_id]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/TerminalProfile"
        default_profile_id:
          type: string
    TerminalSession:
      type: object
      required: [id, profile_id, name, cwd, status, created_at]
      properties:
        id:
          type: string
        profile_id:
          type: string
        name:
          type: string
        cwd:
          type: string
        status:
          type: string
          enum: [running, exited, closing]
        exit_code:
          type: [integer, "null"]
        created_at:
          type: integer
    TerminalSessionCreateRequest:
      type: object
      required: [profile_id, cwd, cols, rows]
      properties:
        profile_id:
          type: string
        cwd:
          type: string
        cols:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
