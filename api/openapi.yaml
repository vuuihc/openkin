openapi: 3.1.0
info:
  title: OpenKin Task Live-Resource Contract
  version: 0.1.0
  description: |
    Authoritative contract for the beta Web and iOS client surface, including
    task, approval, question, workspace, device-pairing, and live update APIs.
    Go handlers remain handwritten; TypeScript types are generated from this
    document. Relay requests add room and key query credentials.

    ## Authentication

    Every operation below inherits the `security` requirement declared at the
    root unless it overrides it: public operations declare `security: []`, and
    `GET /api/auth/me` declares the session cookie alone. The daemon accepts
    four credentials, and they are not equivalent:

    - **Master token** — the bearer credential in `~/.kin/token` on the machine
      running the daemon. It is the operator's own credential.
    - **Paired device token** — minted by the pairing exchange. A device token
      acts for the machine's holder: it can read the holder's tasks and files
      and act on them (prompt, approve, answer, publish a branch), but cannot
      administer the Hub. Operator-only routes — uploads, workspace file
      writes, device management — still require the master token or an owner
      account. The integrated terminal is local-desktop-only and stays operator
      and loopback gated.
    - **Browser session cookie** — `kin_session`, set by login, bootstrap, join,
      or the OIDC callback. It belongs to an account, and the account's role
      decides what it may do.
    - **`?token=` query parameter** — the same master or device token, for
      clients that cannot set an `Authorization` header (the WebSocket and SSE
      routes, and relay-forwarded requests). Prefer the header elsewhere.

    Tokens are presented as `Authorization: Bearer <token>`. `kin_session` is
    HttpOnly and SameSite=Lax; it is marked Secure when the daemon serves TLS.
    The relay's `room` and `key` query parameters are transport credentials for
    the Cloudflare Worker in front of a daemon, not daemon credentials: the
    Worker validates them, forwards the request, converts `?token=` to a Bearer
    header, and strips `room`, `key`, `role`, and `token` before the daemon sees
    it. The daemon still authenticates the request.

    ### Pairing a device

    1. `POST /api/pairing/sessions` with the master token or an owner session.
       The response carries a one-time secret valid for five minutes.
    2. `POST /api/pairing/exchange` with that secret and a label. A successful
       exchange answers 201 with the device id, the device token, and this
       daemon's `desktop_id` and `desktop_name`.
    3. A client that loses the exchange response — not the secret — may repeat
       the same exchange with `X-Kin-Pairing-Recovery: 1` within five minutes of
       the successful exchange. The daemon then answers 200 with the same
       credential instead of consuming a second pairing. The recovery window
       starts at the exchange, not at the pairing session's creation.

    ### Accounts and browser sessions

    `GET /api/auth/status` is the unauthenticated probe that tells a client
    whether accounts exist, whether an owner can still be claimed, and which
    sign-in providers are configured. A standalone daemon reports no providers,
    and clients keep using their device token.

    - The first owner is created by `POST /api/auth/bootstrap` with the Hub's
      bootstrap code.
    - Later members are created by `POST /api/auth/join` with an invitation
      code. The route decides the role; the body never does.
    - Password sign-in is `POST /api/auth/login`.
    - OIDC sign-in starts at `GET /api/auth/oidc/start` and completes at
      `GET /api/auth/oidc/callback`, which redirects into the console. A caller
      that already has a session links the provider identity to that account
      instead of creating a new one.
    - `POST /api/auth/logout` ends the session and clears the cookie.

    ### Authorization classes

    Three narrower classes refine "any authenticated caller"; an operation's
    description names the class where it applies:

    - **Operator only** — the master token, or an account whose role is
      `owner`. These routes administer this machine and the Hub.
    - **Holder only** — the operator or a paired device acting for the machine's
      holder. These routes read or change the holder's work.
    - **Loopback only** — the request must arrive on the loopback interface.
      This covers the internal approval bridge and the integrated terminal.

    ### Optional surfaces

    `/a2a/*` is mounted only when the daemon starts with `KIN_A2A_ENABLED=1`;
    otherwise those paths answer 404. The root `/.well-known/agent-card.json`
    is registered under the same condition and also answers 404 when A2A is
    disabled. The integrated terminal routes exist on a local desktop only and
    answer 503 when no terminal manager is configured.

servers:
  - url: /
security:
  - bearerAuth: []
  - sessionCookie: []
  - tokenQuery: []
paths:
  /api/health:
    get:
      security: []
      operationId: health
      responses:
        "200":
          description: Daemon liveness
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  bus_overflow:
                    type: integer
  /api/version:
    get:
      security: []
      operationId: version
      responses:
        "200":
          description: Daemon version
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    type: string
                  desktop_id:
                    type: string
                    description: Stable daemon identity, returned only to authenticated clients.
                  desktop_name:
                    type: string
                    description: Human-readable desktop name, returned only to authenticated clients.
  /api/pairing/exchange:
    post:
      security: []
      operationId: exchangePairingSecret
      parameters:
        - $ref: "#/components/parameters/RelayRoom"
        - $ref: "#/components/parameters/RelayKey"
        - in: header
          name: X-Kin-Pairing-Recovery
          required: false
          schema:
            type: string
            enum: ["1"]
          description: |
            Set to `1` to retry an exchange whose response was lost. Within five
            minutes of the successful exchange the daemon answers 200 with the
            same device credential instead of 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingExchangeRequest"
      responses:
        "200":
          description: Recovered credential for a lost response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingExchangeResponse"
        "201":
          description: Scoped device credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingExchangeResponse"
        "400":
          description: Invalid JSON, or the secret is missing
        "401":
          description: Expired, replayed, or invalid pairing secret
  /api/pairing/sessions:
    post:
      operationId: createPairingSession
      description: Mint a one-time pairing secret. Operator only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingSessionRequest"
      responses:
        "201":
          description: One-time pairing secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSessionResponse"
        "400":
          description: Invalid JSON; an absent body is refused. Send at least `{}`.
  /api/devices:
    get:
      operationId: listDevices
      description: Paired devices. Operator only.
      responses:
        "200":
          description: Paired devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      description: Revoke a paired device. Operator only.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Device revoked
  /api/workers:
    get:
      operationId: listWorkers
      responses:
        "200":
          description: User-owned worker leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
  /api/workers/register:
    post:
      operationId: registerWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHello"
      responses:
        "201":
          description: Registered worker lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
  /api/workers/heartbeat:
    post:
      operationId: heartbeatWorker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeat"
      responses:
        "200":
          description: Renewed worker lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
  /api/workers/{workerId}/revoke:
    post:
      operationId: revokeWorker
      parameters:
        - in: path
          name: workerId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Worker lease revoked
  /api/agent-providers:
    get:
      operationId: listAgentProviders
      responses:
        "200":
          description: Local Agent discovery and session capability evidence
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentProvider"
  /api/agent-sessions:
    get:
      operationId: listAgentSessions
      parameters:
        - in: query
          name: agent
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: cwd
          schema:
            type: string
        - in: query
          name: linked
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Metadata-only index of provider-owned local sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSession"
  /api/agent-sessions/page:
    get:
      operationId: listAgentSessionsPage
      parameters:
        - in: query
          name: agent
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: cwd
          schema:
            type: string
        - in: query
          name: linked
          schema:
            type: boolean
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Cursor page of provider-owned local session metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionListPage"
  /api/agent-sessions/{id}:
    get:
      operationId: getAgentSession
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
      responses:
        "200":
          description: One indexed provider-owned local session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSession"
        "404":
          description: Indexed session not found
  /api/agent-sessions/import:
    post:
      operationId: importAgentSessions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionImportRequest"
      responses:
        "200":
          description: Import summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionImportResponse"
        "400":
          description: >-
            More agents than one import carries, or the named device_id is not a
            machine this Hub can reach — unknown, or revoked.
        "409":
          description: >-
            The named machine is paired but not connected, so there is nothing to
            ask. Every other machine's sessions are unaffected; a console that
            imports from several machines treats this as one failure among them.
        "500":
          description: >-
            The machine answered and this Hub could not read the answer. That is
            a disagreement between the two sides about the protocol, not
            anything the caller did.
        "501":
          description: >-
            The machine read the question and declined it — usually because it
            runs an older build that has never heard of it. Its own sentence is
            the response body.
        "503":
          description: >-
            This Hub has no channel to the machine it was told to ask, or it
            cannot read its own catalogs. Nothing was asked, so nothing was
            imported.
        "504":
          description: The machine was asked and did not answer in time.
  /api/agent-sessions/{id}/history:
    get:
      operationId: getAgentSessionHistory
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
        - in: query
          name: cursor
          schema:
            type: string
          description: >-
            Opaque continuation from the previous page, at most 512 bytes — bytes
            rather than characters, because it is the bound the wire carries. A
            longer one is refused with 400 whichever machine holds the session,
            so the same transcript does not page one way here and another way
            through a paired machine.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Provider history page read directly from the source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionHistoryPage"
        "400":
          description: >-
            The limit is out of range, or the cursor is longer than one cursor
            may be (512 bytes). Both are checked the same way whether the session
            lives on this machine or on another one, so the same page is
            readable through either path.
        "404":
          description: Indexed session not found
        "409":
          description: >-
            The session lives on a paired machine that is not connected, so there
            is nothing to ask. Only sessions read from another machine answer
            this.
        "500":
          description: >-
            The machine that holds the session answered and this Hub could not
            read the answer — a disagreement between the two sides about the
            protocol, not anything the caller did.
        "501":
          description: >-
            Provider history is not supported — by this machine's catalog, or by
            the machine holding the session, which declined the question
            (usually an older build that has never heard of it).
        "503":
          description: >-
            The session lives on a paired machine and this Hub has no channel to
            it, or this Hub cannot read its own catalogs.
        "504":
          description: The machine was asked and did not answer in time.
  /api/agent-sessions/{id}/attach:
    post:
      operationId: attachAgentSession
      parameters:
        - $ref: "#/components/parameters/AgentSessionId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentSessionAttachRequest"
      responses:
        "200":
          description: Existing Kin task attached to the provider session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionAttachResponse"
        "201":
          description: New Kin task created and attached to the provider session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSessionAttachResponse"
        "409":
          description: Session, task, or provider cannot be attached
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Daemon settings and connection projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /api/relay/pairing:
    post:
      operationId: refreshRelayPairing
      responses:
        "200":
          description: Updated Relay pairing projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Relay is not configured or pairing could not be refreshed
        "401":
          description: Master authentication required
        "501":
          description: Relay runtime is unavailable
  /api/cloudflare/oauth/start:
    post:
      operationId: startCloudflareOAuth
      responses:
        "200":
          description: Cloudflare OAuth authorization URL
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url:
                    type: string
        "401":
          description: Master authentication required
        "400":
          description: Cloudflare authorization could not be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/accounts:
    get:
      operationId: listCloudflareAccounts
      responses:
        "200":
          description: Cloudflare accounts available to the authorized user
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloudflareAccount"
        "400":
          description: Cloudflare accounts could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/zones:
    get:
      operationId: listCloudflareZones
      parameters:
        - in: query
          name: account_id
          schema:
            type: string
      responses:
        "200":
          description: Cloudflare zones available to the authorized user
          content:
            application/json:
              schema:
                type: object
                required: [zones]
                properties:
                  zones:
                    type: array
                    items:
                      $ref: "#/components/schemas/CloudflareZone"
        "400":
          description: Cloudflare zones could not be listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/relay/deploy:
    post:
      operationId: deployCloudflareRelay
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareRelayDeployRequest"
      responses:
        "200":
          description: Updated settings after Worker deployment and Relay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Cloudflare authorization, deployment, or Relay configuration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/cloudflare/relay/domain:
    post:
      operationId: bindCloudflareRelayDomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudflareRelayDomainRequest"
      responses:
        "200":
          description: Updated settings after custom domain binding and Relay configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: Cloudflare authorization, domain binding, or Relay configuration failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Master authentication required
        "501":
          description: Cloudflare integration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/sessions:
    get:
      operationId: listSessions
      description: |
        The global change feed: tasks whose rows changed after the cursor, plus
        the ids of tasks that were deleted, merged into one chronological order.
        Without updated_since it walks the history from the beginning, which is
        how a client builds its first snapshot: page until has_more is false.
        A client takes /api/sessions/cursor before its snapshot and follows the
        feed from there.
      parameters:
        - in: query
          name: updated_since
          schema:
            type: integer
            minimum: 0
          description: Cursor from the previous page. Omit to start from the beginning.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
          description: Changes per page, default 200, capped at 500.
      responses:
        "200":
          description: One page of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionChangePage"
        "400":
          description: Invalid cursor or limit
  /api/sessions/cursor:
    get:
      operationId: getSessionCursor
      description: |
        The current end of the change feed. Read it before building a snapshot
        from the list endpoints; a change that lands in between is then
        delivered twice rather than not at all.
      responses:
        "200":
          description: Current cursor
          content:
            application/json:
              schema:
                type: object
                required: [cursor]
                properties:
                  cursor:
                    type: integer
  /api/sessions/wait:
    get:
      operationId: waitForSessions
      description: |
        Bounded long poll for clients that cannot hold a stream open. Answers as
        soon as something changed, and otherwise after timeout with an empty
        page in the same shape as /api/sessions.
      parameters:
        - in: query
          name: updated_since
          schema:
            type: integer
            minimum: 0
        - in: query
          name: timeout
          schema:
            type: integer
            minimum: 0
          description: Seconds to wait, default 25, capped at 60.
      responses:
        "200":
          description: One page of changes, possibly empty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionChangePage"
        "400":
          description: Invalid cursor or timeout
  /api/events:
    get:
      operationId: streamEvents
      description: |
        Server-Sent Events. Each frame is `event: <kind>` with one WSMessage as
        its data, so a client shares one message handler with the WebSocket bus.
        Realtime is an accelerant, never the truth: a client advances its cursor
        only from /api/sessions, because a frame says nothing about the changes
        it did not carry. Comment lines (`: ping`) are heartbeats.
      parameters:
        - $ref: "#/components/parameters/RelayRoom"
        - $ref: "#/components/parameters/RelayKey"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
  /api/tasks:
    get:
      operationId: listTasks
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 0
        - in: query
          name: before
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: archived
          schema:
            type: string
            enum: ["0", "1"]
          description: >-
            Which side of the archive to list. Absent or "0" is the
            conversation list; "1" is the archive view. There is deliberately
            no value that returns both.
        - in: query
          name: routine_id
          schema:
            type: string
          description: >-
            A routine id returns only that routine's runs; `*` returns every run
            spawned by a routine; empty or absent means no filter, not "tasks
            without a routine".
        - in: query
          name: order
          schema:
            type: string
            enum: [activity]
          description: Sort by most recent task activity when set to activity.
      responses:
        "200":
          description: Task snapshot
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/browser/actions:
    post:
      operationId: runBrowserAction
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAction"
      responses:
        "200":
          description: Browser action completed
          content:
            application/json:
              schema:
                type: object
                required: [task_id, status]
                properties:
                  task_id:
                    type: string
                  status:
                    const: completed
        "409":
          description: Another browser action is already running for the task
        "400":
          description: Invalid action or worker failure
        "404":
          description: Task not found
        "503":
          description: Browser worker is not configured
  /api/tasks/{taskId}:
    get:
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      description: |
        Delete one conversation and its rows. Operator only. Archiving is the
        reversible alternative and is available to the holder.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "400":
          description: The task cannot be deleted in its current state
        "404":
          description: Task not found
  /api/tasks/{taskId}/limit-wait:
    get:
      operationId: getTaskLimitWait
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Durable quota wait state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskLimitWait"
        "404":
          description: No active or historical quota wait
  /api/tasks/{taskId}/prompt:
    post:
      operationId: followUpTask
      description: |
        Send a prompt to a task.

        A task that is still working accepts the prompt into its queue and
        delivers it at the next turn boundary, oldest first; nothing in flight
        is cancelled. Set `interrupt: true` to cut the running turn short and
        deliver next instead, which costs the work in flight.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowUpRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /api/tasks/{taskId}/prompts:
    get:
      operationId: listQueuedPrompts
      description: |
        Prompts accepted for this task that are still waiting for a turn,
        oldest first. An empty list means every message the user has sent has
        been answered. Items carry the `user_seq` of the message event that was
        written when the prompt was accepted, which is what a client marks as
        waiting for an answer.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Queued prompts, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueuedPrompt"
        "404":
          description: Task not found
  /api/tasks/{taskId}/prompts/{promptId}:
    delete:
      operationId: withdrawQueuedPrompt
      description: |
        Take back a queued prompt before it is delivered. The message itself
        stays in the transcript — events do not change once they are written —
        and a `notice` event records the withdrawal so other devices do not read
        the bubble as delivered. Answering 404 means the queue row was already
        gone: it ran, or another device withdrew it first.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/PromptId"
      responses:
        "204":
          description: Withdrawn; the transcript now carries a withdrawal note
        "400":
          description: Not a prompt id
        "404":
          description: No such queued prompt for this task
  /api/tasks/{taskId}/cancel:
    post:
      operationId: cancelTask
