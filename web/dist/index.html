        height: 32px;

      .kin-ios-spoke {

        background: rgb(92 92 97);
      }
      @keyframes kin-ios-spin {

      @media (prefers-reduced-motion: reduce) {

        color: #f5f5f7;

      html.light .kin-boot-retry {

      .kin-boot-retry:focus-visible {

        outline-offset: 2px;
      }
      html.light .kin-boot-retry:focus-visible {
        outline-color: #0b6fe0; /* --kin-focus-ring (light) */
      }
