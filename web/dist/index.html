<!doctype html>
<!-- `zh-Hans`, not `en` and not `zh`: the product's default locale is Simplified
     Chinese, and the tag is what picks the Simplified glyph shapes out of a CJK
     font (under `lang="en"` a Chinese page gets Japanese forms for 直, 骨, 令),
     the CJK line-breaking rules, and the screen reader's voice. `i18n/index.ts`
     keeps it in step on a locale switch; this line is what makes the first
     paint right before any script runs. -->
<html lang="zh-Hans" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The colour the browser paints its own chrome with. Written by
         `applyTheme()` from `--kin-page`, because `content` takes no `var()` and
         a hand-written hex here would be the one colour outside the token
         layer. This value is what a browser that has not run the app yet sees. -->
    <meta name="theme-color" content="#0e0e10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kin" />
    <!-- `use-credentials` is load-bearing behind the relay, not decoration: a
         manifest fetch omits cookies by default — even same-origin ones — so on
         a relayed console this request would arrive with neither the cookie nor
         a query credential and the worker would answer 400. The icons below need
         no attribute; image fetches send same-origin cookies already. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Kin</title>
    <style>
      .kin-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e0e10;
      }
      html.light .kin-boot {
        background: #e0e0e5;
      }
      /* The splash wheel: `IosSpinner.tsx` at size 32 — spokes 8% wide, 25%
         tall, their centres 32% of the size out from the middle. The owner
         asked for the iOS indicator on 2026-11-19 (D13); the shell's boot page
         in `desktop/boot.html` draws the same wheel. The tick is twelve
         discrete steps; a smooth sweep loses the iOS read. */
      .kin-ios-spinner {
        position: relative;
        width: 32px;
        height: 32px;
        animation: kin-ios-spin 1s steps(12, end) infinite;
      }
      .kin-ios-spoke {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.56px;
        height: 8px;
        border-radius: 9999px;
        /* --kin-muted-rgb (dark) in `src/design/theme.css`. */
        background: rgb(152 152 157);
      }
      html.light .kin-ios-spoke {
        /* --kin-muted-rgb (light). */
        background: rgb(92 92 97);
      }
      @keyframes kin-ios-spin {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Still, but present: the wheel is what says "waiting", not its motion. */
        .kin-ios-spinner {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-v_LXSYLY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BWtC1IF3.css">
  </head>
