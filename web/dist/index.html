<!doctype html>
<!-- `zh-Hans`, not `en` and not `zh`: the product's default locale is Simplified
     Chinese, and the tag is what picks the Simplified glyph shapes out of a CJK
     font (under `lang="en"` a Chinese page gets Japanese forms for 直, 骨, 令),
     the CJK line-breaking rules, and the screen reader's voice. `i18n/index.ts`
     keeps it in step on a locale switch; this line is what makes the first
     paint right before any script runs. -->

         `applyTheme()` from `--kin-page`, because `content` takes no `var()` and
         a hand-written hex here would be the one colour outside the token
         layer. This value is what a browser that has not run the app yet sees. -->
    <meta name="theme-color" content="#0e0e10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kin" />
    <!-- `use-credentials` is load-bearing behind the relay, not decoration: a
         manifest fetch omits cookies by default — even same-origin ones — so on
         a relayed console this request would arrive with neither the cookie nor
         a query credential and the worker would answer 400. The icons below need
         no attribute; image fetches send same-origin cookies already. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
