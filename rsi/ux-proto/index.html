function routineTable(ph){return `<table class="tbl"><thead><tr><th>任务</th>${ph?'':'<th>计划</th>'}<th>上次运行</th></tr></thead><tbody>${ROUTINES.map(r=>`<tr class="${S.routines.sel===r.id?'sel':''}" data-rt="${r.id}" style="cursor:pointer"><td><div class="b">${r.name}</div>${ph?`<div class="mut xs">${r.when}</div>`:''}</td>${ph?'':`<td>${r.when}</td>`}<td><span class="pill ${r.st==='ok'?'ok':r.st==='bad'?'bad':''}">${r.last}</span></td></tr>`).join('')}</tbody></table>`}
function routines(ph){const r=ROUTINES.find(x=>x.id===S.routines.sel);
 return `<div class="${ph?'ph':'dh'}" ${ph?'':'style="padding:14px 20px"'}><div class="title">例行任务</div><span class="sp"></span><button class="btn pri sm" data-act="rnew">${I('plus')} 新建任务</button></div>
 <div class="row" style="padding:0 ${ph?16:20}px 10px"><button class="chip">${I('clock')} 工作室 · 在线 ${I('down')}</button><span class="mut xs">4 个任务 · 下次 09:00</span></div>
 <div class="scroll" data-sk="routines">${routineTable(ph)}${ph?'':`<div class="card" style="margin:16px 20px"><div class="b">${r.name} · 最近运行</div><div class="mut" style="margin:4px 0 10px">选择的机器属于例行任务，不属于导航。运行详情是只读记录，批准与停止在那台机器自己的控制台上。</div><button class="btn sm" data-act="rundetail">打开运行详情 ${I('chev')}</button></div>`}</div>`}
function settings(ph,detail){const sec=S.settings.sec;
 const nav=SECTIONS.map(([k,l])=>`<button class="item" data-sec="${k}" aria-selected="${!ph&&sec===k}" style="min-height:44px;align-items:center;padding-left:${ph?16:22}px"><span style="flex:1">${l}</span>${ph?I('chev','mut'):''}</button>`).join('');
 const body=sec==='operations'?`<div class="b" style="font-size:17px;margin-bottom:4px">Agent 运维</div><div class="mut" style="margin-bottom:14px">机器、Agent 目录与用量。发现新 Agent 不会自动接入。</div>
  <table class="tbl"><thead><tr><th>机器</th><th>Agent</th><th>状态</th></tr></thead><tbody><tr><td class="b">本机</td><td>Claude Code · Codex</td><td><span class="pill ok">在线</span></td></tr><tr><td class="b">工作室</td><td>Claude Code · Droid</td><td><span class="pill ok">在线</span></td></tr><tr><td class="b">旧笔记本</td><td>—</td><td><span class="pill">离线 · 3 天</span></td></tr></tbody></table>
  <div class="card row" style="margin-top:16px"><div style="flex:1"><div class="b">发现 1 个新 Agent</div><div class="mut xs">Trae · 已安装，未接入</div></div><button class="btn sm">确认接入</button></div>`
  :`<div class="b" style="font-size:17px;margin-bottom:14px">${(SECTIONS.find(s=>s[0]===sec)||[])[1]}</div>
  <div class="field"><label>外观</label><div class="seg" style="width:240px"><button aria-selected="false">浅色</button><button aria-selected="true">深色</button><button aria-selected="false">跟随系统</button></div></div>
  <div class="field"><label>默认 Agent</label><div class="in"><span>Claude Code</span>${I('down','mut')}</div><span class="mut xs">新对话的起点；可在发送前更改。</span></div>
  <div class="field"><label>默认权限</label><div class="in"><span>默认 · 每次修改前询问</span>${I('down','mut')}</div></div>
  <div class="row field" style="flex-direction:row;justify-content:space-between"><div><label>通知</label><div class="mut xs">此设备：已授权</div></div><div class="tog" role="switch" aria-checked="true" tabindex="0"></div></div>`;
 if(ph&&!detail)return `<div class="ph"><div class="title">设置</div></div><div class="scroll" data-sk="settings">${nav}</div>`;
 if(ph)return `<div class="dh"><button class="icon" data-back aria-label="返回">${I('back')}</button><h1>${(SECTIONS.find(s=>s[0]===sec)||[])[1]}</h1></div><div class="scroll" style="padding:16px">${body}</div>`;
 return `<div class="col" style="width:224px"><div class="colh"><div class="title">设置</div></div><div class="scroll">${nav}</div></div><div class="main"><div class="scroll" data-sk="settings" style="padding:28px 40px"><div style="max-width:620px">${body}</div></div></div>`}
function diffPanel(ph){const p=S.panel,f=DIFF[p.file];const nc=Object.values(p.comments).reduce((a,b)=>a+b.length,0);
 const lines=f.t.map((l,i)=>{const k=p.file+':'+i;const cs=(p.comments[k]||[]).map(c=>`<div class="cm">${esc(c)}</div>`).join('');
  const comp=p.composing===k?`<div class="cm"><textarea id="cmt" placeholder="给 Agent 的评论…"></textarea><div class="row" style="margin-top:6px"><button class="btn sm" data-cmsave="${k}">添加评论</button><button class="btn sm ghost" data-cmcancel>取消</button></div></div>`:'';
  if(l[0]==='h')return `<div class="dl h">${esc(l[1])}</div>`;
  return `<div class="dl ${l[0]==='a'?'a':l[0]==='d'?'d':''}"><span class="g" data-cm="${k}" title="添加评论">+</span><span class="n">${l[1]}</span><span>${l[0]==='a'?'+ ':l[0]==='d'?'− ':'  '}${esc(l[2])}</span></div>${cs}${comp}`}).join('');
 return `<div class="${ph?'':'dh'}" ${ph?'style="padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--kin-hair)"':'style="min-height:56px"'}>${ph?`<button class="icon" data-act="panel" aria-label="关闭">${I('x')}</button>`:''}<div class="seg" style="flex:1">${[['changes','变更'],['files','文件'],['term','终端'],['pr','PR']].map(([k,l])=>`<button data-ptab="${k}" aria-selected="${p.tab===k}">${l}</button>`).join('')}</div>${ph?'':`<button class="icon" data-act="wide" aria-pressed="${!!p.wide}" aria-label="展开面板" title="展开/收起">${I('side')}</button><button class="icon" data-act="panel" aria-label="关闭面板">${I('x')}</button>`}</div>
 ${p.tab!=='changes'?`<div class="mut" style="padding:40px 24px;text-align:center">${p.tab==='files'?'文件树与预览（沿用现有 WorkspacePanel，换进同一标签容器）':p.tab==='term'?'终端（沿用现有 xterm 面板）':'PR 与 CI（沿用现有 PullRequestPanel）'}</div>`:`
 <div style="padding:10px 14px 4px"><div class="sec xs" style="margin-bottom:8px"><b>Agent 说：</b>新增区域定义表，Mac 侧栏与手机 Tab 都从它渲染；归档收成对话范围。</div><div class="row"><div class="seg" style="flex:1">${[['turn','本轮'],['branch','分支'],['unc','未提交']].map(([k,l])=>`<button data-pscope="${k}" aria-selected="${p.scope===k}">${l}</button>`).join('')}</div></div></div>
 <div class="fl">${DIFF.map((d,i)=>`<button data-pfile="${i}" aria-selected="${p.file===i}">${I('file','mut')}<span class="trunc" style="flex:1">${d.f.split('/').pop()}</span><span class="xs" style="color:var(--green-ink)">+${d.a}</span><span class="xs" style="color:var(--red-ink)">−${d.d}</span></button>`).join('')}</div>
 <div class="scroll" data-sk="diff"><div class="diff">${lines}</div></div>
 <div class="row" style="padding:10px 14px;border-top:1px solid var(--kin-hair);background:var(--kin-inspector)"><span class="sec xs" style="flex:1">${nc?`${nc} 条评论`:'悬停行号点 + 可评论'}</span><button class="btn ${(nc&&S.approved)?'pri ':''}sm" data-act="sendc" ${nc?'':'disabled'}>发给 Agent</button><button class="btn ${(!nc&&S.approved)?'pri ':''}sm" data-act="pr">提交并创建 PR</button></div>`}`}
/* ---------- composition ---------- */
function mac(){
 const rail=`<nav class="rail ${S.compact()?'compact':''}" aria-label="区域"><div class="logo"><i>K</i><b>Kin</b></div>${AREAS.map(([k,l,ic],n)=>`<button class="nav" data-area="${k}" aria-current="${S.area===k?'page':'false'}" aria-label="${l}" title="${l} ⌘${n+1}">${I(ic)}<span>${l}</span>${k==='chats'&&attention()?`<span class="bd" aria-label="${attention()} 条待处理">${attention()}</span>`:`<span class="kbd">⌘${n+1}</span>`}</button>`).join('')}<button class="hint" data-act="pal" title="⌘K">${I('search')}<span>搜索与命令 ⌘K</span></button></nav>`;
 let mid='';
 if(S.area==='chats'){const c=S.chats;mid=`${S.listHidden()&&!S.newChat?'':`<div class="col">${chatList(false)}</div>`}<div class="main">${S.newChat?newChat(false):taskDetail(c.sel,false)}</div>${S.panel.open&&!S.newChat?`<aside class="panel ${S.panel.wide?'wide':''}" aria-label="变更与文件">${diffPanel(false)}</aside>`:''}`}
 else if(S.area==='projects')mid=`<div class="col">${projList()}</div><div class="main">${S.newChat?newChat(false):projCover(S.projects.sel,false)}</div>`;
 else if(S.area==='routines')mid=`<div class="main">${routines(false)}</div>`;
 else mid=settings(false);
 return rail+mid}
function phone(){
 const root=!S.stack[S.area].length&&!S.newChat&&!(S.area==='settings'&&false);let pg='';const tp=topPg();
 if(S.newChat)pg=newChat(true);
 else if(S.area==='chats')pg=tp?(S.panel.open?diffPanel(true):taskDetail(tp.id,true)):`<div class="ph"><div class="title">对话</div><span class="sp"></span><button class="btn sm" data-act="new">${I('plus')} 新建</button></div>${chatList(true)}`;
 else if(S.area==='projects')pg=tp?projCover(tp.id,true):`<div class="ph"><div class="title">项目</div></div>${projList()}`;
 else if(S.area==='routines')pg=routines(true);
 else pg=settings(true,!!tp);
 const showTabs=root||(S.area==='settings'&&!tp);
 const tabs=`<nav class="tabs" aria-label="区域">${AREAS.map(([k,l,ic])=>`<button data-area="${k}" aria-current="${S.area===k?'page':'false'}" aria-label="${l}">${I(ic)}<span>${l}</span>${k==='chats'&&attention()?`<span class="bd">${attention()}</span>`:''}</button>`).join('')}</nav>`;
 return `<div class="pg ${S.pushed?'push':''}" id="pg">${pg}</div>${showTabs?tabs:''}`}
function overlays(){let h='';
 if(S.banner)h+=`<div class="banner" role="alert" data-banner>${I('bell')}<div style="flex:1;min-width:0"><div class="b">${esc(S.banner.t)}</div><div class="sec">${esc(S.banner.b)}</div></div><span class="xs mut">现在</span></div>`;
 if(S.pal){const q=S.pal.q||'';const cmds=[['新建对话','⌘N','new'],...AREAS.map(([k,l],n)=>['前往 '+l,'⌘'+(n+1),'area:'+k]),...S.tasks.filter(t=>!t.archived).map(t=>['对话：'+t.title,t.meta.split(' · ')[0],'task:'+t.id]),['打开变更面板','⌘\\','panel']].filter(c=>c[0].includes(q));
  h+=`<div class="scrim" data-close><div class="pal" data-stop><input id="pin" placeholder="搜索对话、区域和命令" value="${esc(q)}" autofocus>${cmds.slice(0,8).map((c,i)=>`<button class="${i===0?'on':''}" data-cmd="${c[2]}"><span style="flex:1">${esc(c[0])}</span><span class="mut xs">${c[1]}</span></button>`).join('')||'<div class="mut" style="padding:16px">没有结果</div>'}</div></div>`}
 if(S.pop)h+=popover();
 return h}
function render(){const act=document.activeElement&&document.activeElement.id;const st=act&&document.activeElement.selectionStart;saveScroll();
 const ph=PHONE();document.documentElement.classList.toggle('phone',ph);
 $('#app').innerHTML=(ph?phone():mac())+overlays();restoreScroll();S.pushed=false;
 const m=$('#msgs');if(m&&S.stick!==false&&!S.hl&&!S.keepScroll){m.scrollTop=m.scrollHeight;S.newBelow=false}S.keepScroll=false;
 if(act&&$('#'+act)){const e=$('#'+act);e.focus();try{e.setSelectionRange(st,st)}catch(_){}}
 if(S.pal&&!act)$('#pin')&&$('#pin').focus()}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const rm=e.target.closest('[data-rowmenu]');if(rm){e.stopPropagation();const r=rm.getBoundingClientRect();S.pop='row:'+rm.dataset.rowmenu;S.popX=Math.min(r.left,window.innerWidth-190);S.popY=r.bottom+4;return render()}
 const ra=e.target.closest('[data-rowact]');if(ra){const[k,id]=ra.dataset.rowact.split(':');const t=T(id);if(k==='archive')t.archived=t.archived?0:1;if(k==='del')S.tasks=S.tasks.filter(x=>x.id!==id);if(k==='pin')t.pinned=1;S.pop=null;if(S.chats.sel===id){const n=S.tasks.find(x=>!x.archived);S.chats.sel=n&&n.id}return render()}
 const t=e.target.closest('[data-area],[data-task],[data-scope],[data-act],[data-back],[data-pop],[data-pick],[data-proj],[data-pdev],[data-sec],[data-rt],[data-ptab],[data-pscope],[data-pfile],[data-cm],[data-cmsave],[data-cmcancel],[data-close],[data-stop],[data-cmd],[data-banner],[data-send]');
 if(!t){if(S.pop){S.pop=null;render()}return}
 const d=t.dataset;
 if(d.stop!==undefined&&!e.target.closest('[data-pick],[data-cmd]'))return;
 if('close' in d&&e.target===t){S.pal=null;S.pop=null;return render()}
 if(d.area)return go(d.area);
 if(d.back!==undefined)return back();
 if(d.banner!==undefined){S.banner=null;return openTask('t1',{hl:'appr'})}
 if(d.cmd){const [k,v]=d.cmd.split(':');S.pal=null;if(k==='new'){S.area='chats';S.newChat=true}else if(k==='area')S.area=v;else if(k==='task')return openTask(v);else if(k==='panel')S.panel.open=true;return render()}
 if(d.task){S.chats.sel=d.task;S.newChat=false;S.area='chats';if(PHONE()){S.stack.chats=[{p:'task',id:d.task}];S.pushed=true}S.stick=true;return render()}
 if(d.scope){S.chats.scope=d.scope;return render()}
 if(d.proj){S.projects.sel=d.proj;if(PHONE())push({p:'proj',id:d.proj});else render();return}
 if(d.pdev){S.projects.dev=d.pdev;return render()}
 if(d.sec){S.settings.sec=d.sec;if(PHONE())push({p:'sec'});else render();return}
 if(d.rt){S.routines.sel=d.rt;return render()}
 if(d.ptab){S.panel.tab=d.ptab;return render()}
 if(d.pscope){S.panel.scope=d.pscope;return render()}
 if(d.pfile){S.panel.file=+d.pfile;return render()}
 if(d.cm){S.panel.composing=d.cm;return render()}
 if(d.cmcancel!==undefined){S.panel.composing=null;return render()}
 if(d.cmsave){const v=$('#cmt').value.trim();if(v)(S.panel.comments[d.cmsave]=S.panel.comments[d.cmsave]||[]).push(v);S.panel.composing=null;return render()}
 if(d.pop){const r=t.getBoundingClientRect();S.pop=d.pop;S.popX=Math.max(8,Math.min(r.left,window.innerWidth-250));S.popY=r.top-6;e.stopPropagation();return render()}
 if(d.pick){const[k,i]=d.pick.split(':');S.cfg[k]=+i;S.pop=PHONE()?'cfg':null;return render()}
 if(d.send){const id=d.send;if(id==='new'){const v=($('#cin').value||'').trim()||'整理本周的待办并给出优先级';const n='t'+(S.tasks.length+1);S.tasks.unshift({id:n,title:v.slice(0,24),dev:'本机',proj:'控制台',st:'run',meta:'刚刚 · 运行中',branch:'',files:0});S.draft.new='';S.chats.sel=n;S.newChat=false;S.area='chats';if(PHONE()){S.stack.chats=[{p:'task',id:n}];S.pushed=true}S.extra=[];return render()}
   S.draft[id]='';return render()}
 const a=d.act;if(!a)return;
 if(a==='new'){S.newChat=true;return render()}
 if(a.startsWith('new-in')){S.newChat=true;return render()}
 if(a==='pal'){S.pal={q:''};return render()}
 if(a==='approve'){S.approved=true;T('t1').st='run';T('t1').meta='刚刚 · 运行中';return render()}
 if(a==='jump'){const x=$('#appr');x&&x.scrollIntoView({block:'center',behavior:'smooth'});return}
 if(a==='deny'){T('t1').st='ok';T('t1').meta='刚刚 · 已拒绝';S.approved=true;return render()}
 if(a==='tobottom'){S.newBelow=false;S.stick=true;render();return}
 if(a==='showlist'){S.panel.wide=false;if(window.innerWidth<1280)S.panel.open=false;return render()}
 if(a==='wide'){S.panel.wide=!S.panel.wide;return render()}
 if(a==='panel'){S.panel.open=!S.panel.open;return render()}
 if(a.startsWith('panel:')){S.panel.open=true;S.panel.tab=a.split(':')[1];return render()}
 if(a==='sendc'){S.panel.sent=Object.values(S.panel.comments).reduce((x,y)=>x+y.length,0);S.sent=S.panel.sent;S.panel.comments={};if(PHONE())S.panel.open=false;return render()}
 if(a==='pr'){S.banner={t:'已创建 PR #72',b:'ux/four-areas → main · CI 运行中'};render();setTimeout(()=>{S.banner=null;render()},2500)}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.chats.q=t.value;S.chats.loaded=true;render()}
 else if(t.id==='pq'){S.projects.q=t.value;render()}
 else if(t.id==='pin'){S.pal.q=t.value;render()}
 else if(t.dataset.draft)S.draft[t.dataset.draft]=t.value});
document.addEventListener('keydown',e=>{const meta=e.metaKey||e.ctrlKey;
 if(meta&&e.key==='k'){e.preventDefault();S.pal=S.pal?null:{q:''};return render()}
 if(meta&&/^[1-4]$/.test(e.key)){e.preventDefault();return go(AREAS[+e.key-1][0])}
 if(meta&&e.key==='n'){e.preventDefault();S.newChat=true;return render()}
 if(meta&&e.key==='\\'){e.preventDefault();S.panel.open=!S.panel.open;return render()}
 if(e.key==='Escape'){if(S.pop||S.pal||S.panel.composing||S.newChat||S.sheet){S.pop=null;S.pal=null;S.panel.composing=null;S.newChat=false;S.sheet=null;return render()}if(S.panel.open){S.panel.open=false;return render()}}
 if(e.key==='Enter'&&meta&&e.target.dataset&&e.target.dataset.draft){const b=$('[data-send]');b&&b.click()}
 if(e.key==='Enter'&&S.pal){const b=$('[data-cmd]');b&&b.click()}
 if(!PHONE()&&S.area==='chats'&&(e.key==='j'||e.key==='k')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!S.pal&&!S.pop){const vis=S.tasks.filter(t=>!t.archived);const i=vis.findIndex(t=>t.id===S.chats.sel);const n=vis[Math.max(0,Math.min(vis.length-1,i+(e.key==='j'?1:-1)))];S.chats.sel=n.id;render()}});
window.addEventListener('resize',render);
document.addEventListener('contextmenu',e=>{const it=e.target.closest('[data-task]');if(it&&it.classList.contains('item')){e.preventDefault();S.pop='row:'+it.dataset.task;render()}});
/* live "follow a running task": a new step every few seconds; stay pinned to the bottom unless the user scrolled up */
setInterval(()=>{if(Q.get('still'))return;if(S.chats.sel==='t2'&&S.area==='chats'&&S.extra.length<5){S.extra.push('<code>diff</code> v1.'+(4+S.extra.length)+' ↔ CHANGELOG 第 '+(7+S.extra.length)+' 条 · 一致');const m=$('#msgs');S.stick=m?(m.scrollHeight-m.scrollTop-m.clientHeight<80):true;S.newBelow=!S.stick;S.keepScroll=!S.stick;render()}},4000);
/* test/dev hooks for the journey walk */
window.kinProto={step(){S.extra.push('<code>diff</code> 新一步');const m=$('#msgs');S.stick=m?(m.scrollHeight-m.scrollTop-m.clientHeight<80):true;S.newBelow=!S.stick;S.keepScroll=!S.stick;render()},notify(){S.banner={t:'Kin · 完善移动端的导航结构',b:'允许修改导航组件？ 轻点处理'};render()},offline(v){S.offline=v;render()},theme(m){document.documentElement.className=m==='light'?'light':'';render()},state:S,reduceMotion(){document.head.insertAdjacentHTML('beforeend','<style>*{animation:none!important;transition:none!important}</style>')}};
setTimeout(()=>{S.chats.loaded=true;render()},Q.get('still')?0:700);
render();
</script>
