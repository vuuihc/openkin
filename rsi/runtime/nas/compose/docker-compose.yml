# Kin RSI NAS worker stack.
# Isolated user-defined bridge only. Do not attach to host, macvlan, or any existing network.
# Do not publish ports. Reaches the host's existing magpie (port 3425) via host-gateway.
# CPU 1.0 and memory 5g are for the whole stack (up to 2 lanes share this container).
name: kin-rsi-nas
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    image: kin-rsi-nas:worker
    pull_policy: never
    container_name: kin-rsi-nas-worker
    restart: unless-stopped
    init: true
    user: "1000:10"
    cpus: "1.0"
    mem_limit: 5g
    memswap_limit: 5g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Singapore
      HOME: /work/home
      ANTHROPIC_BASE_URL: http://host.docker.internal:3425
    volumes:
      - /home/zhushihao/kin-rsi-nas/work:/work
      - /home/zhushihao/kin-rsi-nas/secrets:/secrets:ro
      - /home/zhushihao/kin-rsi-nas/nas-side:/opt/rsi:ro
    networks:
      - kin-rsi-nas
    # No ports. No privileged. No host/macvlan.

networks:
  kin-rsi-nas:
    name: kin-rsi-nas
    driver: bridge
